<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#050811'); g.addColorStop(.55, '#0b1730'); g.addColorStop(.76, '#123356'); g.addColorStop(.86, '#0a1524'); g.addColorStop(1, '#05080f');
  x.fillStyle = g; x.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4.25, 0);
controls.minDistance = 6; controls.maxDistance = 60;

scene.add(new THREE.HemisphereLight(0xa9c8ff, 0x24344e, 2.1));
const key = new THREE.DirectionalLight(0xf2f6ff, 3);
key.position.set(-5, 13, 11); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 11, bottom: -3, far: 45 });
key.shadow.bias = -.0012; key.shadow.normalBias = .03;
scene.add(key);
const rim = new THREE.DirectionalLight(0x38e2ff, 4.2); // cyan rim, so black armour still reads on a dark set
rim.position.set(7, 8, -10); scene.add(rim);
const rimRed = new THREE.DirectionalLight(0xff3a30, 2.6);
rimRed.position.set(-8, 4, -7); scene.add(rimRed);
const impactLight = new THREE.PointLight(0x7fe9ff, 0, 18, 1.4);
impactLight.position.set(0, 4.5, 3.5); scene.add(impactLight);

const floorTile = (() => {
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#121a2b'; x.fillRect(0, 0, S, S);
  x.fillStyle = '#2fb7d6'; x.fillRect(0, 0, S, 2); x.fillRect(0, 0, 2, S);
  x.fillStyle = '#1a2a42'; x.fillRect(0, S / 2, S, 1); x.fillRect(S / 2, 0, 1, S);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30);
  t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const floorFade = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, '#fff'); g.addColorStop(.45, '#fff'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ map: floorTile, alphaMap: floorFade, transparent: true, depthWrite: false }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

/* ---------- materials ---------- */
const ramp = new THREE.DataTexture(new Uint8Array([70, 140, 215, 255]), 4, 1, THREE.RedFormat);
ramp.magFilter = ramp.minFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = color => new THREE.MeshToonMaterial({ color, gradientMap: ramp });
const flat = color => new THREE.MeshBasicMaterial({ color, toneMapped: false });
const fxTime = { value: 0 }, eyeFlare = { value: 0 };
const visorMat = new THREE.ShaderMaterial({ // a live HUD: dark glass, a sweeping scan line and two eye slits
  uniforms: { time: fxTime, flare: eyeFlare },
  vertexShader: `varying vec3 vP; varying vec3 vN; varying vec3 vV;
    void main(){ vP = position; vN = normalize(normalMatrix * normal); vec4 p = modelViewMatrix * vec4(position, 1.); vV = normalize(-p.xyz); gl_Position = projectionMatrix * p; }`,
  fragmentShader: `uniform float time, flare; varying vec3 vP; varying vec3 vN; varying vec3 vV;
    void main(){
      float a = atan(vP.x, vP.z + .02), h = (vP.y - 7.05) / .37;
      float sheen = pow(1. - max(dot(normalize(vN), normalize(vV)), 0.), 2.5);
      float scan = exp(-pow((a - sin(time * .9) * 1.05) * 7., 2.));
      float rows = smoothstep(.72, 1., sin(h * 62.)) * .1;
      float eye = (1. - smoothstep(.0, .3, abs(abs(a) - .42) - .15)) * exp(-pow((h - .58) * 7.5, 2.));
      vec3 c = vec3(.012, .03, .05) + vec3(.1, .55, .75) * (rows + scan * .45 + sheen * .5);
      c += mix(vec3(.2, .85, 1.), vec3(1., .22, .14), flare) * eye * (.9 + flare * 1.6);
      gl_FragColor = vec4(c, 1.);
    }`,
});
const M = {
  suit: toon(0x191b21), strap: toon(0x101114), armor: toon(0x2b2f37), armorLite: toon(0x3e444e),
  silver: toon(0x98a1ab), silverDark: toon(0x6f7883), visor: visorMat,
  red: flat(0xe3201d), light: flat(0xf3f7ff), neon: flat(0x38e2ff),
};

/* a soft flame: distance to a tapering capsule, on a quad that turns about its axis to face the camera */
function softFlame(parent, pos, dir, { len, rad, color, power }) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(rad * 3.4, len + rad * 3.4).translate(0, len / 2, 0), new THREE.ShaderMaterial({
    side: THREE.DoubleSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    uniforms: { time: fxTime, power, len: { value: len }, rad: { value: rad }, color: { value: new THREE.Color(color) } },
    vertexShader: `varying vec2 vP;
      void main(){
        vec4 c = modelViewMatrix * vec4(0., 0., 0., 1.);
        vec3 axis = normalize((modelViewMatrix * vec4(0., 1., 0., 0.)).xyz);
        vec3 view = normalize(-c.xyz);
        vec3 side = normalize(cross(axis, view));
        vP = position.xy;
        gl_Position = projectionMatrix * vec4(c.xyz + side * position.x + axis * position.y + view * .25, 1.);
      }`,
    fragmentShader: `uniform float time, power, len, rad; uniform vec3 color; varying vec2 vP;
      void main(){
        float up = clamp(vP.y / max(len, .001), 0., 1.);
        float wob = sin(vP.y * 6. - time * 13.) * .05 + sin(vP.y * 13. - time * 21. + 1.) * .03;
        float d = length(vec2(vP.x + wob * up * rad * 1.6, vP.y - clamp(vP.y, 0., len * (.88 + .12 * sin(time * 19.)))));
        float g = clamp(1. - d / (rad * mix(1., .28, up)), 0., 1.);
        vec3 col = mix(color, vec3(1.), smoothstep(.55, 1., g));
        gl_FragColor = vec4(col * g * g * power, 1.);
      }`,
  }));
  mesh.position.set(...rel(pos, pivotOf(parent)));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...dir).normalize());
  mesh.frustumCulled = false; parent.add(mesh);
  return mesh;
}

const hullMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: `attribute vec3 smoothNormal;
    void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + smoothNormal * .018, 1.); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(.03,.035,.05,1.); }`,
});

/* ---------- building blocks: everything is authored in rest-pose world coordinates ---------- */
const rel = (p, o) => p.map((v, i) => v - o[i]);
const lerp3 = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
const pivotOf = g => g.userData.pivot || [0, 0, 0];

function joint(parent, pivot, name) {
  const g = new THREE.Group(); g.name = name; g.userData.pivot = pivot;
  g.position.set(...rel(pivot, pivotOf(parent))); parent.add(g);
  return g;
}

function outlined(geo) { // averaged normals keep the outline closed at hard corners
  const p = geo.attributes.position, n = geo.attributes.normal, sum = new Map(), keys = [];
  for (let i = 0; i < p.count; i++) {
    const key = `${Math.round(p.getX(i) * 1e3)},${Math.round(p.getY(i) * 1e3)},${Math.round(p.getZ(i) * 1e3)}`;
    keys.push(key);
    const v = sum.get(key) || new THREE.Vector3();
    v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(key, v);
  }
  const smooth = new Float32Array(p.count * 3);
  keys.forEach((key, i) => { const v = sum.get(key).clone().normalize(); smooth.set([v.x, v.y, v.z], i * 3); });
  geo.setAttribute('smoothNormal', new THREE.BufferAttribute(smooth, 3));
  return geo;
}

function add(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], outline = true) {
  const m = new THREE.Mesh(outlined(geo), mat);
  m.position.set(...rel(pos, pivotOf(parent))); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = !mat.isMeshBasicMaterial;
  if (outline) m.add(new THREE.Mesh(geo, hullMat));
  parent.add(m);
  return m;
}

function aim(mesh, a, b) {
  const d = new THREE.Vector3(...b).sub(new THREE.Vector3(...a)).normalize();
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
  return mesh;
}
const dist = (a, b) => new THREE.Vector3(...a).distanceTo(new THREE.Vector3(...b));

function limb(parent, a, b, r1, r2, mat, sides = 16) { // a tapered capsule
  const L = dist(a, b), pts = [];
  for (let i = 0; i <= 5; i++) { const t = -Math.PI / 2 + i / 5 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(t) * r1, 1e-3), Math.sin(t) * r1)); }
  for (let i = 0; i <= 5; i++) { const t = i / 5 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(t) * r2, 1e-3), L + Math.sin(t) * r2)); }
  return aim(add(parent, new THREE.LatheGeometry(pts, sides), mat, a), a, b);
}
function cyl(parent, a, b, r1, r2, mat, sides = 18, outline = true) {
  const g = new THREE.CylinderGeometry(r2, r1, dist(a, b), sides, 1);
  return aim(add(parent, g, mat, lerp3(a, b, .5), [0, 0, 0], outline), a, b);
}
function bar(parent, a, b, w, t, mat, outline = true) {
  return aim(add(parent, new THREE.BoxGeometry(w, dist(a, b), t), mat, lerp3(a, b, .5), [0, 0, 0], outline), a, b);
}
function ball(parent, pos, [rx, ry, rz], mat) {
  return add(parent, new THREE.SphereGeometry(1, 22, 16).scale(rx, ry, rz), mat, pos);
}
const box = (parent, pos, size, mat, rot, outline = true) => add(parent, new THREE.BoxGeometry(...size), mat, pos, rot, outline);

function shapeGeo(points, depth, bevel = 0) {
  const s = new THREE.Shape(points.map(p => new THREE.Vector2(...p)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 2, curveSegments: 6 });
  g.translate(0, 0, -depth / 2);
  return g;
}
const rrect = (w, h, c) => [[-w + c, -h], [w - c, -h], [w, -h + c], [w, h - c], [w - c, h], [-w + c, h], [-w, h - c], [-w, -h + c]];
function pad(parent, pos, [w, h, d], mat, rot) { // a chamfered tactical block
  const b = Math.min(.03, d / 4);
  return add(parent, shapeGeo(rrect(w / 2 - b, h / 2 - b, Math.min(w, h) * .16), d - b * 2, b), mat, pos, rot);
}

/* lofted surfaces: stacked ellipses {y, rx, rz, cx, cz, half}, half being a shell's angular half-width */
const KEYS = ['y', 'rx', 'rz', 'cx', 'cz', 'half'];
function refine(s, n = 4) { // Catmull-Rom between sections, so a few numbers give a smooth profile
  const at = i => s[Math.max(0, Math.min(s.length - 1, i))], out = [];
  for (let i = 0; i < s.length - 1; i++) for (let k = 0; k < n; k++) {
    const u = k / n, o = {};
    for (const key of KEYS) {
      const [a, b, c, d] = [at(i - 1), at(i), at(i + 1), at(i + 2)].map(x => x[key] || 0);
      o[key] = .5 * (2 * b + (c - a) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (3 * b - a - 3 * c + d) * u * u * u);
    }
    o.rx = Math.max(o.rx, .002); o.rz = Math.max(o.rz, .002);
    out.push(o);
  }
  out.push({ cx: 0, cz: 0, half: 0, ...s[s.length - 1] });
  return out;
}
function section(secs, y) {
  for (let i = 0; i < secs.length - 1; i++) {
    const a = secs[i], b = secs[i + 1];
    if (y <= b.y || i === secs.length - 2) {
      const u = (y - a.y) / (b.y - a.y), o = {};
      for (const key of KEYS) o[key] = (a[key] || 0) + ((b[key] || 0) - (a[key] || 0)) * u;
      return o;
    }
  }
}
const onSurface = (s, y, th, lift = 0) => [s.cx + (s.rx + lift) * Math.sin(th), y, s.cz + (s.rz + lift) * Math.cos(th)];
const pointAtX = (secs, y, x, lift = 0) => { const s = section(secs, y); return onSurface(s, y, Math.asin((x - s.cx) / s.rx), lift); };

function indexed(positions, index) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(index); g.computeVertexNormals();
  return g;
}
function loftBody(secs, sides = 30) { // a closed solid
  const pos = [], idx = [], rings = secs.length;
  for (const s of secs) for (let j = 0; j < sides; j++) pos.push(...onSurface(s, s.y, j / sides * Math.PI * 2));
  for (let i = 0; i < rings - 1; i++) for (let j = 0; j < sides; j++) {
    const a = i * sides + j, b = i * sides + (j + 1) % sides, c = a + sides, d = b + sides;
    idx.push(a, b, d, a, d, c);
  }
  const first = secs[0], last = secs[rings - 1], bottom = pos.length / 3, top = bottom + 1;
  pos.push(first.cx, first.y, first.cz, last.cx, last.y, last.cz);
  for (let j = 0; j < sides; j++) {
    const k = (j + 1) % sides;
    idx.push(bottom, k, j, top, (rings - 1) * sides + j, (rings - 1) * sides + k);
  }
  return indexed(pos, idx);
}
function loftShell(secs, { th0 = 0, depth = .05, cols = 24 } = {}) { // a curved armour plate with real thickness
  const pos = [], idx = [], ring = secs.length;
  const P = (i, j, inset) => { const s = secs[i]; return onSurface(s, s.y, th0 + (j / cols * 2 - 1) * s.half, inset); };
  const grid = (inset, flip) => {
    const base = pos.length / 3;
    for (let i = 0; i < ring; i++) for (let j = 0; j <= cols; j++) pos.push(...P(i, j, inset));
    for (let i = 0; i < ring - 1; i++) for (let j = 0; j < cols; j++) {
      const a = base + i * (cols + 1) + j, b = a + 1, c = a + cols + 1, d = c + 1;
      if (flip) idx.push(a, d, b, a, c, d); else idx.push(a, b, d, a, d, c);
    }
  };
  grid(0, false); grid(-depth, true);
  const quad = (a, b, c, d) => { const n = pos.length / 3; pos.push(...a, ...b, ...c, ...d); idx.push(n, n + 1, n + 2, n, n + 2, n + 3); };
  for (let i = 0; i < ring - 1; i++) {
    quad(P(i, 0, 0), P(i + 1, 0, 0), P(i + 1, 0, -depth), P(i, 0, -depth));
    quad(P(i + 1, cols, 0), P(i, cols, 0), P(i, cols, -depth), P(i + 1, cols, -depth));
  }
  for (let j = 0; j < cols; j++) {
    quad(P(ring - 1, j, 0), P(ring - 1, j + 1, 0), P(ring - 1, j + 1, -depth), P(ring - 1, j, -depth));
    quad(P(0, j + 1, 0), P(0, j, 0), P(0, j, -depth), P(0, j + 1, -depth));
  }
  return indexed(pos, idx);
}
const shell = (parent, secs, mat, opts, outline = true) => add(parent, loftShell(refine(secs), opts), mat, [0, 0, 0], [0, 0, 0], outline);
const solid = (parent, secs, mat, sides) => add(parent, loftBody(refine(secs), sides), mat);
function band(parent, y, h, cx, cz, rx, rz, mat) {
  const c = { cx, cz, rx, rz };
  return solid(parent, [{ ...c, y: y - h / 2 }, { ...c, y: y + h / 2 }], mat, 22);
}

function canvasTexture(draw, w = 512, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function decal(parent, secs, yBottom, yTop, half, texture, th0 = 0, lift = .012) { // lettering that follows the curve of a plate
  const fine = refine(secs), pos = [], uv = [], idx = [], cols = 18, rows = 10;
  for (let i = 0; i <= rows; i++) for (let j = 0; j <= cols; j++) {
    const u = j / cols, v = i / rows, y = yBottom + (yTop - yBottom) * v;
    pos.push(...onSurface(section(fine, y), y, th0 + (u * 2 - 1) * half, lift)); uv.push(u, v);
    if (i < rows && j < cols) { const a = i * (cols + 1) + j; idx.push(a, a + 1, a + cols + 2, a, a + cols + 2, a + cols + 1); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = add(parent, g, new THREE.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: .35, side: THREE.DoubleSide, toneMapped: false }), [0, 0, 0], [0, 0, 0], false);
  m.castShadow = false;
  return m;
}
const FONT = 'Arial,Helvetica,sans-serif';
const chestLogo = canvasTexture((x, w, h) => {
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#e3201d'; x.font = `900 150px ${FONT}`; x.fillText('xAI', w / 2, h * .36);
  x.fillStyle = '#f3f7ff'; x.font = `800 74px ${FONT}`; x.fillText('GROK', w / 2, h * .83);
});
const shoulderLogo = canvasTexture((x, w, h) => {
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#e3201d'; x.font = `900 136px ${FONT}`; x.fillText('xAI', w / 2, h * .36);
  x.fillStyle = '#c9d0d8'; x.font = `800 66px ${FONT}`; x.fillText('GROK', w / 2, h * .82);
});
const backLogo = canvasTexture((x, w, h) => {
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#e8edf3'; x.font = `800 92px ${FONT}`; x.fillText('GROK', w / 2, h / 2);
}, 512, 128);

/* ---------- rig ---------- */
const root = new THREE.Group(); root.name = 'GrokFighter'; scene.add(root);
const pelvis = joint(root, [0, 4.1, 0], 'Pelvis');
const spine = joint(pelvis, [0, 4.55, 0], 'Spine');
const head = joint(spine, [0, 6.62, .02], 'Head');

/* ---------- torso ---------- */
const TORSO = [{ y: 4.5, rx: .6, rz: .4 }, { y: 4.78, rx: .6, rz: .41 }, { y: 5.2, rx: .74, rz: .5 }, { y: 5.7, rx: .92, rz: .6 }, { y: 6.05, rx: .98, rz: .6 }, { y: 6.3, rx: .8, rz: .5 }, { y: 6.5, rx: .42, rz: .36 }];
const torsoFine = refine(TORSO);

  ribbonNow.baton = ch('Bt');

  fxTime.value = time;
  eyeFlare.value = Math.min(1, fw * .35 + ch('eye'));
  thrust.value = .3 + fw * .28 + ch('boost') + Math.sin(time * 31) * .05;
  coreGlow.value = (.5 + breathe * .1 + fw * .22) * (1 + ch('eye') * .9);
  impactLight.intensity = flash;
  const pulse = .78 + Math.sin(time * 2.6) * .22 + ch('eye') * .3;
  M.neon.color.copy(neonBase).multiplyScalar(pulse);
  M.red.color.copy(redBase).multiplyScalar(.82 + Math.sin(time * 3) * .18);
}

/* ---------- GLB export ---------- */
const exportMats = new Map();
function exportMaterial(mat) {
  if (!exportMats.has(mat)) {
    exportMats.set(mat, mat.isMeshToonMaterial ? new THREE.MeshStandardMaterial({ color: mat.color, roughness: .55, metalness: .2 })
      : mat.isShaderMaterial ? new THREE.MeshStandardMaterial({ color: 0x0b1420, roughness: .15, metalness: .4 }) // the visor
      : mat.clone());
  }
  return exportMats.get(mat);
}
function exportTree(src) {
  let out;
  if (src.isMesh) {
    const g = new THREE.BufferGeometry();
    for (const name of ['position', 'normal', 'uv']) if (src.geometry.attributes[name]) g.setAttribute(name, src.geometry.attributes[name].clone());
    if (src.geometry.index) g.setIndex(src.geometry.index.clone());
    out = new THREE.Mesh(g, exportMaterial(src.material));
  } else out = new THREE.Group();
  out.name = src.name;
  out.position.copy(src.position); out.quaternion.copy(src.quaternion); out.scale.copy(src.scale);
  for (const child of src.children) { // outlines and additive energy are renderer tricks glTF cannot carry
    if (child.material !== hullMat && child.material?.blending !== THREE.AdditiveBlending) out.add(exportTree(child));
  }
  return out;
}
document.getElementById('download').onclick = async e => {
  const button = e.target, label = 'DOWNLOAD GLB';
  button.disabled = true; button.textContent = 'EXPORTING…';
  try {
    pose(0, 0, null, 0); // always export the neutral stance, baton out
    const glb = await new GLTFExporter().parseAsync(exportTree(root), { binary: true });
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'grok_fighter.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    button.textContent = label;
  } catch (err) {
    console.error(err);
    button.textContent = 'EXPORT FAILED';
  }
  button.disabled = false;
};

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1);
  const t0 = t, move = act ? MOVES[act] : null, p0 = move ? actT / move.dur : 0;
  t += dt;
  fightW += ((mode === 'fight' ? 1 : 0) - fightW) * (1 - Math.exp(-dt * 11));
  let name = act, p1 = p0, due = [];
  if (move) {
    actT += dt; p1 = Math.min(1, actT / move.dur);
    due = move.fx.filter(([at]) => p0 < at && p1 >= at);
    if (p1 >= 1) { act = null; actT = 0; showAct(); name = null; p1 = 0; }
  }
  // several poses per frame keep the motion trails smooth through fast strikes
  const steps = name ? 3 : 1;
  for (let i = 1; i <= steps; i++) {
    const u = i / steps, at = t0 + (t - t0) * u;
    pose(at, fightW, name, name ? p0 + (p1 - p0) * u : 0);
    root.updateWorldMatrix(true, true);
    for (const s of [-1, 1]) {
      const c = fistLocal(s);
      ribbons[s].push(arms[s].hand.localToWorld(c.clone().setX(c.x - .2)), arms[s].hand.localToWorld(c.clone().setX(c.x + .2)), ribbonNow[s], at);
    }
    ribbons.baton.push(baton.localToWorld(new THREE.Vector3(...batonPivotLocal[0])), baton.localToWorld(new THREE.Vector3(...batonPivotLocal[1])), ribbonNow.baton, at);
  }
  updateFx(dt);
  due.forEach(([, fx, ...args]) => FX[fx](...args));
  for (const r of Object.values(ribbons)) r.draw(t);
  if (goal) {
    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  const off = new THREE.Vector3((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);
  camera.position.add(off);
  renderer.render(scene, camera);
  camera.position.sub(off);
  camShake *= Math.exp(-dt * 9);
}
animate();
</script>
