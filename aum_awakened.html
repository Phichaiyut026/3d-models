<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- scene: deep space ---------- */
const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#03030e'); g.addColorStop(.55, '#0a0a2a'); g.addColorStop(.82, '#14123e'); g.addColorStop(1, '#05040f');
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 1200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4.25, 0);
controls.minDistance = 3; controls.maxDistance = 220;

scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x3a3488, 1.7));
const key = new THREE.DirectionalLight(0xfff6ee, 2.3);
key.position.set(-5, 13, 11); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 11, bottom: -2, far: 45 });
key.shadow.bias = -.0012; key.shadow.normalBias = .03;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fd8ff, 2.2); rim.position.set(7, 8, -10); scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), new THREE.ShadowMaterial({ opacity: .4, color: 0x000008 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(60, 60, 0x3a3a90, 0x1a1a4a); grid.position.y = .003; scene.add(grid);

/* ---------- materials ---------- */
const ramp = new THREE.DataTexture(new Uint8Array([95, 160, 220, 255]), 4, 1, THREE.RedFormat);
ramp.magFilter = ramp.minFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = color => new THREE.MeshToonMaterial({ color, gradientMap: ramp });
const flat = color => new THREE.MeshBasicMaterial({ color, toneMapped: false });
const M = {
  skin: toon(0xe3b692), lip: toon(0xa86a58), hair: toon(0x171a22), white: flat(0xf2f4f6), iris: flat(0x14202a),
  under: toon(0x17191d), jacket: toon(0x565a62), jacketDark: toon(0x303339), sleeve: toon(0x1e2024),
  pants: toon(0x1f2125), plate: toon(0x41454d), lite: toon(0x666b74), strap: toon(0x101114), glove: toon(0x24262b),
  sole: toon(0x0b0c0e), metal: toon(0x8b929c), teal: flat(0x45f0d8), red: flat(0xff3a4a),
  lens: new THREE.MeshBasicMaterial({ color: 0x57f3df, transparent: true, opacity: .5, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }),
};

const hullMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: `attribute vec3 smoothNormal;
    void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + smoothNormal * .018, 1.); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(.03,.035,.05,1.); }`,
});

/* ---------- building blocks: everything is authored in rest-pose world coordinates ---------- */
const rel = (p, o) => p.map((v, i) => v - o[i]);
const lerp3 = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
const pivotOf = g => g.userData.pivot || [0, 0, 0];

function joint(parent, pivot, name) {
  const g = new THREE.Group(); g.name = name; g.userData.pivot = pivot;
  g.position.set(...rel(pivot, pivotOf(parent))); parent.add(g);
  return g;
}

function outlined(geo) { // averaged normals keep the outline closed at hard corners
  const p = geo.attributes.position, n = geo.attributes.normal, sum = new Map(), keys = [];
  for (let i = 0; i < p.count; i++) {
    const key = `${Math.round(p.getX(i) * 1e3)},${Math.round(p.getY(i) * 1e3)},${Math.round(p.getZ(i) * 1e3)}`;
    keys.push(key);
    const v = sum.get(key) || new THREE.Vector3();
    v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(key, v);
  }
  const smooth = new Float32Array(p.count * 3);
  keys.forEach((key, i) => { const v = sum.get(key).clone().normalize(); smooth.set([v.x, v.y, v.z], i * 3); });
  geo.setAttribute('smoothNormal', new THREE.BufferAttribute(smooth, 3));
  return geo;
}

function add(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], outline = true) {
  const m = new THREE.Mesh(outlined(geo), mat);
  m.position.set(...rel(pos, pivotOf(parent))); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = !mat.isMeshBasicMaterial;
  if (outline) m.add(new THREE.Mesh(geo, hullMat));
  parent.add(m);
  return m;
}

function aim(mesh, a, b) {
  const d = new THREE.Vector3(...b).sub(new THREE.Vector3(...a)).normalize();
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
  return mesh;
}
const dist = (a, b) => new THREE.Vector3(...a).distanceTo(new THREE.Vector3(...b));

function limb(parent, a, b, r1, r2, mat, sides = 16) { // a tapered capsule
  const L = dist(a, b), pts = [];
  for (let i = 0; i <= 5; i++) { const t = -Math.PI / 2 + i / 5 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(t) * r1, 1e-3), Math.sin(t) * r1)); }
  for (let i = 0; i <= 5; i++) { const t = i / 5 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(t) * r2, 1e-3), L + Math.sin(t) * r2)); }
  return aim(add(parent, new THREE.LatheGeometry(pts, sides), mat, a), a, b);
}
function cyl(parent, a, b, r1, r2, mat, sides = 18, outline = true) {
  const g = new THREE.CylinderGeometry(r2, r1, dist(a, b), sides, 1);
  return aim(add(parent, g, mat, lerp3(a, b, .5), [0, 0, 0], outline), a, b);
}
function bar(parent, a, b, w, t, mat, outline = true) {
  return aim(add(parent, new THREE.BoxGeometry(w, dist(a, b), t), mat, lerp3(a, b, .5), [0, 0, 0], outline), a, b);
}
function ball(parent, pos, [rx, ry, rz], mat) {
  return add(parent, new THREE.SphereGeometry(1, 22, 16).scale(rx, ry, rz), mat, pos);
}
const box = (parent, pos, size, mat, rot, outline = true) => add(parent, new THREE.BoxGeometry(...size), mat, pos, rot, outline);

function shapeGeo(points, depth, bevel = 0) {
  const s = new THREE.Shape(points.map(p => new THREE.Vector2(...p)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 2, curveSegments: 6 });
  g.translate(0, 0, -depth / 2);
  return g;
}
const rrect = (w, h, c) => [[-w + c, -h], [w - c, -h], [w, -h + c], [w, h - c], [w - c, h], [-w + c, h], [-w, h - c], [-w, -h + c]];
function pad(parent, pos, [w, h, d], mat, rot) { // a chamfered tactical block
  const b = Math.min(.03, d / 4);
  return add(parent, shapeGeo(rrect(w / 2 - b, h / 2 - b, Math.min(w, h) * .16), d - b * 2, b), mat, pos, rot);
}

/* lofted surfaces: stacked ellipses {y, rx, rz, cx, cz, half}, half being a shell's angular half-width */
const KEYS = ['y', 'rx', 'rz', 'cx', 'cz', 'half'];
function refine(s, n = 4) { // Catmull-Rom between sections, so a few numbers give a smooth profile
  const at = i => s[Math.max(0, Math.min(s.length - 1, i))], out = [];
  for (let i = 0; i < s.length - 1; i++) for (let k = 0; k < n; k++) {
    const u = k / n, o = {};
    for (const key of KEYS) {
      const [a, b, c, d] = [at(i - 1), at(i), at(i + 1), at(i + 2)].map(x => x[key] || 0);
      o[key] = .5 * (2 * b + (c - a) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (3 * b - a - 3 * c + d) * u * u * u);
    }
    o.rx = Math.max(o.rx, .002); o.rz = Math.max(o.rz, .002);
    out.push(o);
  }
  out.push({ cx: 0, cz: 0, half: 0, ...s[s.length - 1] });
  return out;
}
function section(secs, y) {
  for (let i = 0; i < secs.length - 1; i++) {
    const a = secs[i], b = secs[i + 1];
    if (y <= b.y || i === secs.length - 2) {
      const u = (y - a.y) / (b.y - a.y), o = {};
      for (const key of KEYS) o[key] = (a[key] || 0) + ((b[key] || 0) - (a[key] || 0)) * u;
      return o;
    }
  }
}
const onSurface = (s, y, th, lift = 0) => [s.cx + (s.rx + lift) * Math.sin(th), y, s.cz + (s.rz + lift) * Math.cos(th)];
const pointAtX = (secs, y, x, lift = 0) => { const s = section(secs, y); return onSurface(s, y, Math.asin((x - s.cx) / s.rx), lift); };

function indexed(positions, index) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(index); g.computeVertexNormals();
  return g;
}
function loftBody(secs, sides = 30) { // a closed solid
  const pos = [], idx = [], rings = secs.length;
  for (const s of secs) for (let j = 0; j < sides; j++) pos.push(...onSurface(s, s.y, j / sides * Math.PI * 2));
  for (let i = 0; i < rings - 1; i++) for (let j = 0; j < sides; j++) {
    const a = i * sides + j, b = i * sides + (j + 1) % sides, c = a + sides, d = b + sides;
    idx.push(a, b, d, a, d, c);
  }
  const first = secs[0], last = secs[rings - 1], bottom = pos.length / 3, top = bottom + 1;
  pos.push(first.cx, first.y, first.cz, last.cx, last.y, last.cz);
  for (let j = 0; j < sides; j++) {
    const k = (j + 1) % sides;
    idx.push(bottom, k, j, top, (rings - 1) * sides + j, (rings - 1) * sides + k);
  }
  return indexed(pos, idx);
}
function loftShell(secs, { th0 = 0, depth = .05, cols = 24 } = {}) { // a curved armour plate with real thickness
  const pos = [], idx = [], ring = secs.length;
  const P = (i, j, inset) => { const s = secs[i]; return onSurface(s, s.y, th0 + (j / cols * 2 - 1) * s.half, inset); };
  const grid = (inset, flip) => {
    const base = pos.length / 3;
    for (let i = 0; i < ring; i++) for (let j = 0; j <= cols; j++) pos.push(...P(i, j, inset));
    for (let i = 0; i < ring - 1; i++) for (let j = 0; j < cols; j++) {
      const a = base + i * (cols + 1) + j, b = a + 1, c = a + cols + 1, d = c + 1;
      if (flip) idx.push(a, d, b, a, c, d); else idx.push(a, b, d, a, d, c);
    }
  };
  grid(0, false); grid(-depth, true);
  const quad = (a, b, c, d) => { const n = pos.length / 3; pos.push(...a, ...b, ...c, ...d); idx.push(n, n + 1, n + 2, n, n + 2, n + 3); };
  for (let i = 0; i < ring - 1; i++) {
    quad(P(i, 0, 0), P(i + 1, 0, 0), P(i + 1, 0, -depth), P(i, 0, -depth));
    quad(P(i + 1, cols, 0), P(i, cols, 0), P(i, cols, -depth), P(i + 1, cols, -depth));
  }
  for (let j = 0; j < cols; j++) {
    quad(P(ring - 1, j, 0), P(ring - 1, j + 1, 0), P(ring - 1, j + 1, -depth), P(ring - 1, j, -depth));
    quad(P(0, j + 1, 0), P(0, j, 0), P(0, j, -depth), P(0, j + 1, -depth));
  }
  return indexed(pos, idx);
}
const shell = (parent, secs, mat, opts, outline = true) => add(parent, loftShell(refine(secs), opts), mat, [0, 0, 0], [0, 0, 0], outline);
const solid = (parent, secs, mat, sides) => add(parent, loftBody(refine(secs), sides), mat);
function band(parent, y, h, cx, cz, rx, rz, mat) {
  const c = { cx, cz, rx, rz };
  return solid(parent, [{ ...c, y: y - h / 2 }, { ...c, y: y + h / 2 }], mat, 22);
}

function canvasTexture(draw, w = 512, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

/* ---------- rig ---------- */
const root = new THREE.Group(); root.name = 'AumCosmos'; scene.add(root);
const pelvis = joint(root, [0, 4.1, 0], 'Pelvis');
const spine = joint(pelvis, [0, 4.6, 0], 'Spine');
const head = joint(spine, [0, 6.72, .02], 'Head');

/* ---------- head ---------- */
const HEAD = [{ y: 6.95, rx: .13, rz: .09, cz: .2 }, { y: 7.03, rx: .22, rz: .2, cz: .15 }, { y: 7.2, rx: .32, rz: .32, cz: .06 }, { y: 7.42, rx: .36, rz: .4, cz: .01 }, { y: 7.66, rx: .385, rz: .44, cz: -.02 }, { y: 7.86, rx: .33, rz: .39, cz: -.03 }, { y: 7.97, rx: .18, rz: .23, cz: -.03 }, { y: 8.02, rx: .04, rz: .05, cz: -.03 }];
const headFine = refine(HEAD);
const onHead = (y, th, lift = 0) => onSurface(section(headFine, y), y, th, lift);
const headOver = (lift, spans) => spans.map(([y, half]) => { const s = section(headFine, y); return { y, half, cx: s.cx, cz: s.cz, rx: s.rx + lift, rz: s.rz + lift }; });
solid(head, HEAD, M.skin, 32);
limb(head, [0, 6.62, -.02], [0, 7.1, 0], .2, .19, M.skin);

// face under the goggles
const nose = onHead(7.34, 0, 0);
add(head, new THREE.SphereGeometry(1, 16, 12).scale(.042, .06, .055), M.skin, [nose[0], nose[1], nose[2] + .025], [0, 0, 0], false);
bar(head, onHead(7.54, 0, .01), [nose[0], 7.37, nose[2] + .06], .055, .05, M.skin, false);
bar(head, onHead(7.17, -.24, .012), onHead(7.17, .24, .012), .018, .012, M.lip, false);
for (const s of [-1, 1]) {
  const e = onHead(7.5, s * .4, -.018);
  ball(head, e, [.08, .042, .035], M.white);
  ball(head, [e[0] - s * .012, e[1], e[2] + .022], [.032, .04, .022], M.iris);
  bar(head, onHead(7.66, s * .16, .035), onHead(7.7, s * .68, .03), .05, .04, M.hair, false);
  ball(head, onHead(7.44, s * 1.55, .01), [.05, .13, .085], M.skin);
}

// the goggles: two wrapped lenses, a frame and a strap around the head
for (const s of [-1, 1]) {
  shell(head, headOver(.075, [[7.39, .36], [7.46, .46], [7.61, .49]]), M.lens, { th0: s * .5, depth: .004 }, false);
  bar(head, onHead(7.57, s * .28, .085), onHead(7.53, s * .62, .085), .014, .004, M.white, false);
  bar(head, onHead(7.49, s * .28, .085), onHead(7.46, s * .46, .085), .012, .004, M.white, false);
  shell(head, headOver(.09, [[7.38, .1], [7.62, .12]]), M.plate, { th0: s * .98, depth: .05 });
}
shell(head, headOver(.1, [[7.59, .95], [7.645, 1.02]]), M.plate, { depth: .05 });
shell(head, headOver(.095, [[7.355, .86], [7.4, .9]]), M.plate, { depth: .05 });
shell(head, headOver(.095, [[7.47, .028], [7.6, .028]]), M.plate, { depth: .05 });
shell(head, headOver(.02, [[7.45, 2.22], [7.56, 2.22]]), M.strap, { th0: Math.PI, depth: .03 });
bar(head, onHead(7.625, -.55, .115), onHead(7.625, -.3, .115), .03, .006, M.teal, false);

// headset on the left ear, mic to the corner of the mouth
{
  const ear = onHead(7.44, 1.55, .05);
  cyl(head, ear, [ear[0] + .07, ear[1], ear[2]], .14, .12, M.plate, 16);
  cyl(head, [ear[0] + .065, ear[1], ear[2]], [ear[0] + .08, ear[1], ear[2]], .07, .07, M.teal, 14, false);
  const m = [ear[0] + .02, 7.26, ear[2] + .2], end = onHead(7.14, .55, .08);
  cyl(head, ear, m, .018, .018, M.strap, 8);
  cyl(head, m, end, .018, .016, M.strap, 8);
  ball(head, end, [.028, .025, .036], M.plate);
}

/* ---------- hair: a dark cap and hand-placed spiky locks ---------- */
const hairCap = (y, half) => ({ ...headOver(.035, [[y, half]])[0] });
shell(head, [hairCap(7.16, .8), hairCap(7.32, 1.45), hairCap(7.5, 1.85), hairCap(7.64, 2.18), hairCap(7.8, 3.05), hairCap(7.97, 3.14)], M.hair, { th0: Math.PI, depth: .1, cols: 36 });
solid(head, [{ ...hairCap(7.74, 0) }, { ...hairCap(7.86, 0) }, { y: 8, rx: .24, rz: .3, cz: -.03 }, { y: 8.08, rx: .07, rz: .09, cz: -.03 }], M.hair, 26);
function lock(th, y, len, up, side = 0, r = .1, lift = 0) {
  const b = onHead(y, th, lift), ox = Math.sin(th), oz = Math.cos(th);
  const mid = [b[0] + ox * len * .36 + side * len * .28, b[1] + up * len * .5, b[2] + oz * len * .36];
  const tip = [b[0] + ox * len * .46 + side * len * .85, b[1] + up * len, b[2] + oz * len * .46];
  limb(head, b, mid, r, r * .62, M.hair, 7);
  limb(head, mid, tip, r * .62, .006, M.hair, 7);
}
const wob = i => Math.sin(i * 12.9898) * 43758.5453 % 1; // repeatable jitter
for (let i = 0; i < 18; i++) lock(i / 18 * Math.PI * 2, 7.88 + wob(i) * .04, .27 + wob(i + 3) * .07, .34 + wob(i + 5) * .2, wob(i + 7) * .4, .13);
for (let i = 0; i < 12; i++) lock(i / 12 * Math.PI * 2 + .3, 7.96, .26 + wob(i + 9) * .07, .6, Math.sin(i * 2.4) * .6, .13, .03);
lock(.05, 7.98, .4, .62, .5, .15, .03); lock(-.32, 7.97, .36, .68, -.55, .14, .03); lock(.42, 7.95, .34, .6, .62, .14, .03); lock(-.7, 7.93, .32, .55, -.6, .13, .03);
for (const [th, side, len] of [[-.56, -.3, .27], [-.24, -.42, .34], [.08, -.5, .32], [-.02, .12, .27], [.2, .3, .26], [.36, .38, .3], [.66, .34, .24]]) lock(th, 7.83, len, -.62, side, .1, .03); // a loose fringe that stops above the goggles
for (const s of [-1, 1]) for (const [th, y, len] of [[1.22, 7.82, .24], [1.5, 7.76, .28], [1.8, 7.72, .3], [2.1, 7.68, .3]]) lock(s * th, y, len, -.86, s * .14, .1, .03);
for (let i = 0; i < 13; i++) lock(Math.PI + (i - 6) * .24, 7.6 + (Math.abs(i - 6) % 2) * .06, .34 + wob(i + 13) * .06, -.86, 0, .11, .04);

/* ---------- torso ---------- */

/* ---------- arms ---------- */

  band(shin, .94, .09, s * .574, 0, .285, .315, M.strap);
  trace(shin, [onSurface(section(gFine, 1.3), 1.3, Math.PI, -.0), onSurface(section(gFine, .8), .8, Math.PI, -.0)], .05);

  const cx = s * .58, BOOT = [{ y: .08, rx: .325, rz: .66, cx, cz: .24 }, { y: .22, rx: .325, rz: .64, cx, cz: .22 }, { y: .4, rx: .285, rz: .46, cx, cz: .1 }, { y: .62, rx: .27, rz: .34, cx, cz: -.02 }, { y: .86, rx: .265, rz: .29, cx, cz: 0 }];

  solid(foot, [{ y: .1, rx: .342, rz: .685, cx, cz: .24 }, { y: .128, rx: .342, rz: .685, cx, cz: .24 }], M.teal, 34);
  // toe cap, heel cup and an instep strap with a buckle

/* ---------- what only the cosmic half has ---------- */
const fxTime = { value: 0 };
// hair that has stopped obeying gravity
for (const [th, len, side] of [[-.35, 1.3, -.1], [-.8, 1.75, -.36], [-1.25, 1.5, -.55], [-1.7, 1.7, -.42], [-2.15, 1.45, -.32], [-2.6, 1.6, -.16], [-.55, 1.15, .1], [-1.5, 1.2, -.7]]) lock(th, 7.92, len, .96, side, .2);
// a half cape, torn at the hem
const CAPE_W = 12, CAPE_H = 18, capeGeo = new THREE.PlaneGeometry(1, 1, CAPE_W, CAPE_H), capeRest = [];
{
  const p = capeGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) + .5, v = .5 - p.getY(i), hem = v > .84 ? (Math.abs(Math.sin(i * 7.31)) * .85) * (v - .84) * 6 : 0;
    const x = -.1 - u * (1.05 + v * .85), y = 6.42 - v * 5.5 + hem, z = -1.04 - v * .55;
    p.setXYZ(i, x, y, z); capeRest.push({ x, z, v });
  }
  capeGeo.computeVertexNormals();
}
M.cape = new THREE.MeshToonMaterial({ color: 0x20204a, gradientMap: ramp, side: THREE.DoubleSide });
const cape = add(spine, capeGeo, M.cape, [0, 0, 0], [0, 0, 0], false);
cape.frustumCulled = false;

/* ---------- the split: everything left of a wandering line is the universe ---------- */
const COSMOS = `
  uniform float uT;
  float hash31(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
  float vnoise(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(mix(hash31(i), hash31(i + vec3(1., 0., 0.)), f.x), mix(hash31(i + vec3(0., 1., 0.)), hash31(i + vec3(1., 1., 0.)), f.x), f.y),
               mix(mix(hash31(i + vec3(0., 0., 1.)), hash31(i + vec3(1., 0., 1.)), f.x), mix(hash31(i + vec3(0., 1., 1.)), hash31(i + vec3(1., 1., 1.)), f.x), f.y), f.z); }
  float fbm3(vec3 p){ float f = 0., a = .5; for (int i = 0; i < 3; i++) { f += a * vnoise(p); p = p * 2.05 + 7.1; a *= .5; } return f; }
  float splitAt(vec3 r){ return (vnoise(vec3(r.y * 1.05, r.z * 1.3, 2.)) - .5) * .62 + (vnoise(vec3(r.y * 6., r.z * 6., 5.)) - .5) * .13; }
  vec3 starLayer(vec3 p, float scale, float size){
    vec3 id = floor(p * scale), f = fract(p * scale);
    float h = hash31(id + 71.), d = length(f - (vec3(hash31(id), hash31(id + 17.), hash31(id + 41.)) * .7 + .15));
    float twinkle = .62 + .38 * sin(uT * (1.5 + h * 4.) + h * 40.);
    return smoothstep(size, 0., d) * step(.5, h) * twinkle * mix(vec3(.72, .86, 1.), vec3(1., .82, .74), fract(h * 9.)) * 2.2;
  }
  vec3 cosmos(vec3 r, vec3 V){
    vec3 p = r + vec3(V.xy, 0.) * -.9;
    float t = uT * .05, n = fbm3(p * .42 + vec3(0., -t, t));
    vec3 c = mix(vec3(.012, .012, .07), vec3(.1, .05, .36), smoothstep(.28, .7, n));
    c += vec3(.72, .12, .62) * pow(fbm3(p * .7 + vec3(7., t, 2.)), 3.) * 2.6;
    c += vec3(.04, .55, .78) * pow(fbm3(p * .55 + vec3(13., 3., -t)), 3.) * 2.4;
    float lane = exp(-pow((p.y - p.x * 1.3 - 4.6) / 1.15, 2.));
    c += vec3(.95, .78, .95) * lane * smoothstep(.34, .68, n) * .55;
    vec2 g = p.xy - vec2(-.5, 5.72); float gr = max(length(g), .001);
    float arm = pow(.5 + .5 * cos(atan(g.y, g.x) * 2. - log(gr) * 5. + uT * .55), 2.);
    c += vec3(.72, .78, 1.) * arm * exp(-gr * 1.7) * .9 + vec3(1., .92, .78) * (exp(-gr * gr * 16.) * .9);
    c += starLayer(r + vec3(V.xy, 0.) * -.4, 6., .16) + starLayer(r + vec3(V.xy, 0.) * -1.1, 13., .2) + starLayer(r + vec3(V.xy, 0.) * -2., 26., .24) * .7;
    return c;
  }
`;
function cosmify(mat, { cut = false, always = false } = {}) {
  mat.defines = { ...(mat.defines || {}), ...(cut ? { COSMIC_CUT: '' } : {}), ...(always ? { COSMIC_ALWAYS: '' } : {}) };
  mat.onBeforeCompile = sh => {
    sh.uniforms.uT = fxTime;
    sh.vertexShader = 'attribute vec3 aRest; varying vec3 vRest; varying vec3 vV; varying vec3 vNv;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vRest = aRest; vV = (modelViewMatrix * vec4(position, 1.)).xyz; vNv = normalize(normalMatrix * normal);`);
    sh.fragmentShader = 'varying vec3 vRest; varying vec3 vV; varying vec3 vNv;\n' + COSMOS + sh.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      float _b = splitAt(vRest), _m = smoothstep(-.012, .012, _b - vRest.x);
      #ifdef COSMIC_ALWAYS

  genesis: { dur: 7, pull: true, k: { pull: [[0, 0], [.14, 1], [.9, 1], [1, 0]], gal: [[0, 0], [.2, 1], [.7, 1], [.8, 0], [.92, 1], [1, 0]], giant: [[0, 0], [.14, 0], [.3, 1], [.84, 1], [.95, 0], [1, 0]], sky: [[0, 0], [.14, 1], [.9, 1], [1, 0]], veil: [[0, 0], [.14, 1.5], [.7, 2], [.9, 1], [1, 0]], Rz: [[0, 0], [.42, -.4], [.7, -.4], [.78, -.2], [1, 0]], Rx: [[0, 0], [.42, -2.75], [.7, -2.75], [.78, -1.25], [.9, -1.25], [1, 0]], Rf: [[0, 0], [.42, -.08], [.7, -.08], [.78, 0], [1, 0]], hover: [[0, 0], [.2, 2.4], [.9, 2.4], [1, 0]] }, fx: [[.14, 'rise'], [.7, 'bang'], [.82, 'reborn']] },
};

/* ---------- pose ---------- */
const THIGH = 1.75, SHIN = 1.73, ANKLE_Y = .62;
const unit = v => Math.max(-1, Math.min(1, v));
function legIK(l, drop, stride) {
  const V = l.H[1] - drop - ANKLE_Y, D = Math.min(Math.hypot(stride, V), THIGH + SHIN - 1e-4);
  const line = Math.atan2(stride, V), hip = Math.acos(unit((THIGH * THIGH + D * D - SHIN * SHIN) / (2 * THIGH * D)));
  const knee = Math.PI - Math.acos(unit((THIGH * THIGH + SHIN * SHIN - D * D) / (2 * THIGH * SHIN)));
  l.thigh.position.set(l.H[0], l.H[1] - drop, l.H[2]);
  l.thigh.rotation.x = -(line + hip); l.shin.rotation.x = knee; l.foot.rotation.x = line + hip - knee;
}
let worldT = 0;
function pose(time, fw = fightW, name = act, p = name ? actT / MOVES[name].dur : 0) {
  const m = name ? MOVES[name] : null, ch = key => (m && m.k[key] ? track(p, m.k[key]) : 0);
  const breathe = Math.sin(time * 1.4), idleW = 1 - fw;
  root.position.set(ch('dx'), idleW * (.34 + Math.sin(time * 1.1) * .06) + ch('hover'), ch('dz'));
  const drop = .03 + fw * .08;
  pelvis.position.set(0, 4.1 - drop, 0);
  for (const s of [-1, 1]) {
    legIK(legs[s], drop, s * fw * .24);
    // floating, the toes hang a little
    legs[s].shin.rotation.x += idleW * (s > 0 ? .2 : .06);
    legs[s].thigh.rotation.x -= idleW * (s > 0 ? .12 : .02);
    legs[s].foot.rotation.x += idleW * .3;
  }
  const twist = ch('twist') + fw * .12;
  spine.rotation.set(breathe * .012 + fw * .02 + ch('lean'), twist, 0);
  head.rotation.y = -twist * .8 + Math.sin(time * .4) * .08 * idleW;
  head.rotation.x = .02 - fw * .03 + (name === 'genesis' ? -.08 : 0);
  for (const s of [-1, 1]) {
    const S = s > 0 ? 'L' : 'R', a = arms[s];
    a.upper.rotation.set(fw * -.14 + ch(S + 'x'), 0, s * (.12 + breathe * .008 + fw * .12) + ch(S + 'z'));
    a.fore.rotation.set(-.2 - fw * .3 + ch(S + 'f'), 0, 0);
    a.fingers.forEach((f, i) => { f.a.rotation.z = -s * (.3 + i * .06); f.b.rotation.z = -s * (.38 + i * .06); });
    a.thumb.rotation.z = s * -.15;
  }
  fxTime.value = worldT;
  const pulse = 1 + Math.sin(time * 2.1) * .14;
  starEye.scale.setScalar(.85 * pulse); heart.scale.setScalar((.85 + ch('veil') * .7) * (1 + Math.sin(time * 1.4) * .1));
  veilPower.value = (1 + Math.sin(time * 3.1) * .05) * (1 + ch('veil') * .9);
  veilReach.value = 1 + ch('veil') * .8;
  halo.material.uniforms.power.value = .72 + ch('veil') * .4;
  { const c = capeGeo.attributes.position; capeRest.forEach((r, i) => c.setZ(i, r.z + (Math.sin(time * 1.4 + r.x * 1.6 + r.v * 5) * .24 + Math.sin(time * 2.9 + r.x * 3) * .06) * r.v)); c.needsUpdate = true; }
  for (let i = 0; i < FLAKES; i++) {
    const f = flakeSeed[i], life = (worldT * f.v + f.o) % 1, drift = life * 7.5;
    dummy.position.set(-drift * (.7 + Math.sin(f.a) * .25) + Math.sin(life * 7 + f.a) * .14, f.y + drift * .42, f.z + Math.cos(life * 5 + f.a) * drift * .34);
    dummy.rotation.set(worldT * 1.3 + f.a, worldT * .9 + f.a * 2, f.a);
    dummy.scale.setScalar(Math.max(.001, f.s * (life < .08 ? life / .08 : 1 - (life - .08) / .92)) * 2.3);
    dummy.updateMatrix(); flakes.setMatrixAt(i, dummy.matrix);
  }
  flakes.instanceMatrix.needsUpdate = true;
  for (const o of orbits) { const a = worldT * o.s + o.r; o.p.position.set(Math.cos(a) * o.r, Math.sin(a) * o.r, 0); }

  meteorOn = ch('rain') > .5;
  const size = ch('gal'), inPalm = name === 'palm' && size > .02 && ch('hide') < .5;
  palmGalaxy.visible = inPalm;
  if (inPalm) {
    root.updateWorldMatrix(true, true);
    const at = palm(); at.y += .45 + size * .32; at.z += ch('galZ');
    palmGalaxy.position.copy(at); palmGalaxy.scale.setScalar(size * 2.2);
  }
  const g = ch('giant');
  giant.g.visible = g > .01;
  if (g > .01) { syncGhost(giant); giant.g.position.set(0, -root.position.y, -36); giant.g.scale.setScalar(5.6); giant.mat.opacity = .96 * g; }
  const universe = name === 'genesis' ? size : 0;
  for (const o of galaxies) {
    if (universe < .01 || (eraseWave.userData.gone && o.userData.d < eraseWave.userData.gone)) { o.visible = false; continue; }
    o.visible = true; o.scale.setScalar(o.userData.size * universe); o.quaternion.copy(camera.quaternion); o.rotateZ(o.userData.d);
  }
  const sky = ch('sky');
  openSky.visible = sky > .01; openSky.material.uniforms.a.value = sky; grid.visible = sky < .4;
}
function cinematic(name, p) { // the final move backs the camera out so the whole cosmos fits
  const m = name ? MOVES[name] : null;
  if (!m || !m.pull || !pullFrom) return;
  const u = track(p, m.k.pull);
  camera.position.lerpVectors(pullFrom, tmp.set(0, 26, 158), u);
  controls.target.lerpVectors(pullTarget, tmp.set(0, 30, -8), u);
}
function updateFx(dt) {
  for (const o of ghosts) if (o.g.visible) {
    o.life -= dt; o.mat.opacity = Math.max(0, o.life / o.max) * .9;
    o.g.position.copy(o.at).sub(root.position);
    if (o.life <= 0) o.g.visible = false;
  }
  for (const r of ringPool) if (r.visible) {
    const u = r.userData; u.life -= dt; r.scale.addScalar(u.grow * dt); r.material.opacity = Math.max(0, u.life / u.max);
    r.quaternion.copy(camera.quaternion);
    if (u.life <= 0) r.visible = false;
  }
  if (linkFade > 0) {
    linkFade -= dt; const a = Math.min(1, linkFade); links.material.opacity = a; nodes.forEach(n => { n.material.opacity = a; });
    if (linkFade <= 0) { linkCount = 0; lastHop = null; linkGeo.setDrawRange(0, 0); nodes.forEach(n => { n.visible = false; }); }
  }
  if (meteorOn) {
    meteorAcc += dt * 42;
    while (meteorAcc >= 1) { meteorAcc--; const f = meteors.find(x => x.t < 0); if (f) { f.t = 0; f.x = (Math.random() - .5) * 64; f.z = -28 + Math.random() * 42; f.size = .7 + Math.random() * .8; } }
  }
  let live = false;
  meteors.forEach((f, i) => {
    if (f.t < 0) { dummy.scale.setScalar(0); dummy.updateMatrix(); meteorMesh.setMatrixAt(i, dummy.matrix); return; }
    live = true; f.t += dt;
    const u = f.t / mLife, h = 58 * (1 - u);
    dummy.position.set(f.x, 0, f.z).addScaledVector(mDir, h); dummy.quaternion.copy(mQuat); dummy.scale.set(.2 * f.size, 15 * f.size, .2 * f.size); dummy.updateMatrix(); meteorMesh.setMatrixAt(i, dummy.matrix);
    if (u >= 1) { f.t = -1; ringAt(tmp.set(f.x, .4, f.z).clone(), .4, 13, .34, 0xb9dcff); camShake = Math.max(camShake, .22); }
  });
  dummy.quaternion.identity();
  meteorMesh.visible = live; meteorMesh.instanceMatrix.needsUpdate = true;
  palmGalaxy.quaternion.copy(camera.quaternion);
  if (eraseWave.visible) {
    const u = eraseWave.userData; u.life += dt;
    const r = 5 + u.life * u.life * 620;
    eraseWave.position.set(0, 20, -10); eraseWave.scale.setScalar(r); eraseWave.material.opacity = Math.max(0, 1 - u.life / .85) * .7; u.gone = r;
    if (u.life > .85) eraseWave.visible = false;
  }
  flash *= Math.exp(-dt * 6.5);
  whiteOut.visible = flash > .01; whiteOut.material.uniforms.a.value = Math.min(1, flash);
}

const clock = new THREE.Clock();
let t = 0;

/* ---------- GLB export ---------- */
const exportMats = new Map();
function exportMaterial(mat) {
  if (!exportMats.has(mat)) exportMats.set(mat, mat.isMeshToonMaterial ? new THREE.MeshStandardMaterial({ color: mat.color, roughness: .62, metalness: .1 }) : mat.clone());
  return exportMats.get(mat);
}
function exportTree(src) {
  let out;
  if (src.isMesh) {
    const g = new THREE.BufferGeometry();
    for (const name of ['position', 'normal', 'uv']) if (src.geometry.attributes[name]) g.setAttribute(name, src.geometry.attributes[name].clone());
    if (src.geometry.index) g.setIndex(src.geometry.index.clone());
    out = new THREE.Mesh(g, exportMaterial(src.material));
  } else out = new THREE.Group();
  out.name = src.name;
  out.position.copy(src.position); out.quaternion.copy(src.quaternion); out.scale.copy(src.scale);
  for (const child of src.children) { // outlines and additive light are renderer tricks glTF cannot carry
    if (child.name !== 'Ghost' && child.material !== hullMat && child.material?.blending !== THREE.AdditiveBlending) out.add(exportTree(child));
  }
  return out;
}
document.getElementById('download').onclick = async e => {
  const button = e.target, label = 'DOWNLOAD GLB';
  button.disabled = true; button.textContent = 'EXPORTING…';
  try {
    pose(0, 0, null, 0);
    const glb = await new GLTFExporter().parseAsync(exportTree(root), { binary: true });
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'aum_cosmos.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    button.textContent = label;
  } catch (err) {
    console.error(err);
    button.textContent = 'EXPORT FAILED';
  }
  button.disabled = false;
};

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1);
  t += dt; worldT += dt;
  fightW += ((mode === 'fight' ? 1 : 0) - fightW) * (1 - Math.exp(-dt * 8));
  const move = act ? MOVES[act] : null, p0 = move ? actT / move.dur : 0;
  let name = act, p1 = 0, due = [];
  if (move) {
    actT += dt; p1 = Math.min(1, actT / move.dur);
    due = move.fx.filter(([at]) => p0 < at && p1 >= at);
    if (p1 >= 1) { if (move.pull) { camera.position.copy(pullFrom); controls.target.copy(pullTarget); pullFrom = null; } eraseWave.userData.gone = 0; act = null; actT = 0; showAct(); name = null; p1 = 0; }
  }
  pose(t, fightW, name, p1);
  root.updateWorldMatrix(true, true);
  cinematic(name, p1);
  due.forEach(([, fx, ...args]) => FX[fx](...args));
  updateFx(dt);
  if (goal) {
    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  const off = new THREE.Vector3((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);
  camera.position.add(off);
  renderer.render(scene, camera);
  camera.position.sub(off);
  camShake *= Math.exp(-dt * 8);
}
animate();
