const PAGES = ["<!doctype html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n<title>Cosmic Warrior 3D · Form 1<\/title>\n<style>\n  html,body{margin:0;height:100%;overflow:hidden;background:#2c6690;font-family:ui-monospace,Menlo,monospace;color:#e6f6ff}\n  canvas{display:block}\n  #title{position:fixed;left:20px;top:16px;font:600 22px/1.1 system-ui,sans-serif;letter-spacing:.03em;pointer-events:none}\n  #title small{display:block;font:500 12px/1.6 system-ui,sans-serif;opacity:.75;letter-spacing:0}\n  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}\n  button{font:600 12px ui-monospace,Menlo,monospace;padding:9px 12px;background:#14325a;color:#dff4ff;border:1px solid #6fc8ee;border-radius:3px;cursor:pointer}\n  button:hover{background:#245083}\n  button.on{background:#5a34d0;border-color:#b9a4ff;color:#fff}\n  .gap{width:10px}\n  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}\n  @media (max-width:640px){button{padding:6px 7px;font-size:11px}.gap{width:2px}#bar{gap:4px;bottom:10px}}\n  /* forms */\n  #forms{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:6px;z-index:4}\n  #forms button{padding:7px 11px;font-size:11px}\n  #formFade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .28s}\n  @media (max-width:900px){#forms{left:20px;transform:none;top:100px;flex-direction:column;align-items:flex-start}}\n  /* /forms */\n<\/style>\n<script type=\"importmap\">\n{\"imports\":{\"three\":\"https://unpkg.com/three@0.160.0/build/three.module.js\",\"three/addons/\":\"https://unpkg.com/three@0.160.0/examples/jsm/\"}}\n<\/script>\n<\/head>\n<body>\n<div id=\"title\">COSMIC WARRIOR<small>ลากเพื่อหมุน · เลื่อนเพื่อซูม · คลิกขวาลากเพื่อเลื่อน<\/small><\/div>\n<div id=\"flash\"><\/div>\n<div id=\"bar\">\n  <button data-view=\"front\">FRONT<\/button>\n  <button data-view=\"side\">SIDE<\/button>\n  <button data-view=\"back\">BACK<\/button>\n  <button data-view=\"iso\">ISO<\/button>\n  <span class=\"gap\"><\/span>\n  <button id=\"idle\" class=\"on\">IDLE<\/button>\n  <button id=\"energy\">ENERGY<\/button>\n  <button data-mode=\"fight\">FIGHT<\/button>\n  <span class=\"gap\"><\/span>\n  <button data-act=\"nova\">NOVA<\/button>\n  <button data-act=\"comet\">COMET<\/button>\n  <button data-act=\"galaxy\">GALAXY<\/button>\n  <button data-act=\"barrage\">BARRAGE<\/button>\n  <button data-act=\"starfall\">STARFALL<\/button>\n  <button data-act=\"hole\">BLACK HOLE<\/button>\n  <button data-act=\"supernova\">SUPERNOVA<\/button>\n<\/div>\n<script type=\"module\">\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n\n/* ---------- scene ---------- */\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(0x2c6690);\nconst camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 200);\nconst renderer = new THREE.WebGLRenderer({ antialias: true });\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\nrenderer.shadowMap.enabled = true;\ndocument.body.appendChild(renderer.domElement);\nrenderer.shadowMap.type = THREE.PCFShadowMap;\ndocument.body.appendChild(renderer.domElement);\nconst controls = new OrbitControls(camera, renderer.domElement);\ncontrols.enableDamping = true;\ncontrols.target.set(0, 2.95, 0);\ncontrols.minDistance = 5; controls.maxDistance = 60;\n\nscene.add(new THREE.HemisphereLight(0xe4e6ff, 0x5a4fb0, 1.9));\nconst key = new THREE.DirectionalLight(0xffffff, 2.2);\nkey.position.set(-4, 11, 9); key.castShadow = true;\nkey.shadow.mapSize.set(2048, 2048);\nObject.assign(key.shadow.camera, { left: -7, right: 7, top: 9, bottom: -5, far: 40 });\nkey.shadow.bias = -.001; key.shadow.normalBias = .03;\nscene.add(key);\nconst backLight = new THREE.DirectionalLight(0xcfd4ff, 1.7);\nbackLight.position.set(3, 6, -10); scene.add(backLight);\nconst impactLight = new THREE.PointLight(0xc2adff, 0, 26, 1.3);\nimpactLight.position.set(0, 4, 3.4); scene.add(impactLight);\n\nconst ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: .28, color: 0x0b2240 }));\nground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);\nconst grid = new THREE.GridHelper(24, 48, 0x8fd8f5, 0x4d8fb5);\ngrid.position.y = .002; scene.add(grid);\n\n/* ---------- surfaces ---------- */\nlet seed = 11;\nconst rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;\nconst TILE = 4;\n\nfunction canvasTexture(size, draw, repeat) {\n  const c = document.createElement('canvas'); c.width = c.height = size;\n  draw(c.getContext('2d'), size);\n  const t = new THREE.CanvasTexture(c);\n  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;\n  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;\n  return t;\n}\nfunction blob(x, px, py, r, color, alpha) {\n  const g = x.createRadialGradient(px, py, 0, px, py, r);\n  const [a, b, c] = color;\n  g.addColorStop(0, `rgba(${a},${b},${c},${alpha})`);\n  g.addColorStop(1, `rgba(${a},${b},${c},0)`);\n  x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);\n}\nfunction stars(x, S, count, wrap) {\n  for (let i = 0; i < count; i++) {\n    const px = rnd() * S, py = rnd() * S, v = rnd();\n    x.fillStyle = v > .7 ? '#fff' : v > .35 ? '#c8d6ff' : '#b89aff';\n    const s = v > .94 ? 2.4 : v > .6 ? 1.6 : 1;\n    x.fillRect(px, py, s, s);\n  }\n  x.fillStyle = '#fff';\n  for (let i = 0; i < count / 22; i++) {\n    const px = rnd() * S, py = rnd() * S, r = 3 + rnd() * 5;\n    x.fillRect(px - r, py - .6, r * 2, 1.2); x.fillRect(px - .6, py - r, 1.2, r * 2);\n  }\n}\nconst NEBULA = [[122, 53, 224], [52, 86, 255], [192, 80, 224]];\nconst cosmicTex = canvasTexture(512, (x, S) => {\n  x.fillStyle = '#120c48'; x.fillRect(0, 0, S, S);\n  x.globalCompositeOperation = 'lighter';\n  for (let i = 0; i < 34; i++) {\n    const px = rnd() * S, py = rnd() * S, r = 50 + rnd() * 90, col = NEBULA[rnd() * 3 | 0];\n    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) blob(x, px + dx, py + dy, r, col, .26);\n  }\n  x.globalCompositeOperation = 'source-over';\n}, true);\n// Wing image: u runs from the spine outward, v from the lowest spike to the top tip.\nconst wingTex = canvasTexture(1024, (x, S) => {\n  x.fillStyle = '#17105a'; x.fillRect(0, 0, S, S);\n  x.globalCompositeOperation = 'lighter';\n  const spot = (wx, wy, r, col, a) => blob(x, (wx / 2.9) * S, (1 - (wy - 2.1) / 3.1) * S, r * S / 2.9, col, a);\n  spot(1.1, 4.15, .75, [52, 96, 255], .75);\n  spot(1.55, 3.45, .85, [150, 60, 240], .8);\n  spot(1.95, 3.1, .55, [226, 96, 230], .55);\n  spot(1.35, 3.85, .35, [150, 190, 255], .55);\n  for (let i = 0; i < 22; i++) spot(.7 + rnd() * 1.7, 2.7 + rnd() * 1.8, .1 + rnd() * .25, NEBULA[rnd() * 3 | 0], .3);\n  x.globalCompositeOperation = 'source-over';\n});\n\nconst ramp = new THREE.DataTexture(new Uint8Array([120, 185, 255]), 3, 1, THREE.RedFormat);\nramp.magFilter = ramp.minFilter = THREE.NearestFilter; ramp.needsUpdate = true;\nconst toon = color => new THREE.MeshToonMaterial({ color, gradientMap: ramp });\nconst flat = color => new THREE.MeshBasicMaterial({ color, toneMapped: false });\nconst M = {\n  armor: toon(0x4f2db4), lite: toon(0x7450e4), deep: toon(0x35197f), suit: toon(0x211d6a), sole: toon(0x241254),\n  cosmic: new THREE.MeshBasicMaterial({ map: cosmicTex, toneMapped: false }),\n  wing: new THREE.MeshBasicMaterial({ map: wingTex, toneMapped: false }),\n  white: flat(0xffffff), ice: flat(0xc4ecff), line: flat(0xbfdcff), neon: flat(0x6f8dff),\n};\n\n/* Live stars: nebula images stay still while shader layers orbit and twinkle over them.\n   glTF cannot carry a shader, so the GLB uses a copy of each image with stars painted in. */\nconst starTime = { value: 0 };\nconst STAR_GLSL = `\n  uniform float uStarTime, uScale; uniform vec2 uCenter;\n  float starHash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }\n  vec3 starLayer(vec2 uv, float density, float speed, float radius, float prob, float glint){\n    float a = uStarTime * speed, c = cos(a), s = sin(a);\n    vec2 p = mat2(c, -s, s, c) * uv * density + prob * 37.;\n    vec2 id = floor(p), f = fract(p);\n    float h = starHash(id);\n    if (h > prob) return vec3(0.);\n    vec2 d = f - (.3 + .4 * vec2(fract(h * 91.7), fract(h * 47.3)));\n    float v = fract(h * 13.1);\n    float tw = .3 + .7 * pow(.5 + .5 * sin(uStarTime * (1.2 + v * 4.) + h * 80.), 2.);\n    float core = smoothstep(radius * (.6 + .8 * v), 0., length(d));\n    float arms = glint * (smoothstep(.3, 0., abs(d.x)) * smoothstep(.022, 0., abs(d.y)) + smoothstep(.3, 0., abs(d.y)) * smoothstep(.022, 0., abs(d.x)));\n    vec3 tint = v > .66 ? vec3(1.) : v > .33 ? vec3(.7, .8, 1.) : vec3(.78, .6, 1.);\n    return tint * (core + arms) * tw * 1.6;\n  }`;\nfunction liveStars(mat, scale, center, exportCount) {\n  const nebula = mat.map;\n  mat.userData.exportMap = canvasTexture(nebula.image.width, (x, S) => { x.drawImage(nebula.image, 0, 0); stars(x, S, exportCount); }, nebula.wrapS === THREE.RepeatWrapping);\n  mat.onBeforeCompile = shader => {\n    Object.assign(shader.uniforms, { uStarTime: starTime, uScale: { value: scale }, uCenter: { value: new THREE.Vector2(...center) } });\n    shader.fragmentShader = shader.fragmentShader\n      .replace('#include <common>', `#include <common>\\n${STAR_GLSL}`)\n      .replace('#include <map_fragment>', `#include <map_fragment>\n        vec2 starUv = vMapUv * uScale - uCenter;\n        diffuseColor.rgb += starLayer(starUv, 9., .028, .1, .62, 0.) + starLayer(starUv, 5.5, .05, .12, .55, 0.) + starLayer(starUv, 3., .085, .11, .4, 1.);`);\n  };\n}\nliveStars(M.cosmic, TILE, [0, 0], 1400);\nliveStars(M.wing, 2.9, [1.5, 1.4], 2400); // the wing layers orbit the brightest part of the galaxy\n\n// hands get their own materials so they can light up without brightening the suit\nM.handSuit = toon(0x211d6a); M.handDeep = toon(0x35197f);\nfor (const m of [M.handSuit, M.handDeep]) { m.emissive.setHex(0xb49cff); m.emissiveIntensity = 0; }\n\nconst hull = (color, t) => new THREE.ShaderMaterial({\n  side: THREE.BackSide,\n  uniforms: { t: { value: t }, c: { value: new THREE.Color(color).convertLinearToSRGB() } },\n  vertexShader: `attribute vec3 smoothNormal; uniform float t;\n    void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + smoothNormal * t, 1.); }`,\n  fragmentShader: `uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.); }`,\n});\nconst outlineMat = hull(0x120a3a, .02), wingRim = hull(0x4a27b0, .05);\n\nfunction prepare(geo, smooth) {\n  let g = geo;\n  if (smooth) { g.computeVertexNormals(); g = g.toNonIndexed(); }\n  else { if (g.index) g = g.toNonIndexed(); g.computeVertexNormals(); }\n  const p = g.attributes.position, n = g.attributes.normal, count = p.count;\n  const uv = new Float32Array(count * 2), ou = rnd(), ov = rnd(), k = 1 / TILE;\n  for (let i = 0; i < count; i++) {\n    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));\n    let u, v;\n    if (ax >= ay && ax >= az) { u = p.getZ(i); v = p.getY(i); }\n    else if (ay >= az) { u = p.getX(i); v = p.getZ(i); }\n    else { u = p.getX(i); v = p.getY(i); }\n    uv[i * 2] = u * k + ou; uv[i * 2 + 1] = v * k + ov;\n  }\n  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));\n  const sum = new Map(), keys = [];\n  for (let i = 0; i < count; i++) {\n    const key = `${Math.round(p.getX(i) * 1e3)},${Math.round(p.getY(i) * 1e3)},${Math.round(p.getZ(i) * 1e3)}`;\n    keys.push(key);\n    const v = sum.get(key) || new THREE.Vector3();\n    v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(key, v);\n  }\n  const out = new Float32Array(count * 3);\n  keys.forEach((key, i) => { const v = sum.get(key).clone().normalize(); out.set([v.x, v.y, v.z], i * 3); });\n  g.setAttribute('smoothNormal', new THREE.BufferAttribute(out, 3));\n  return g;\n}\n\nfunction add(parent, geo, mat, pos = [0, 0, 0], { rot = [0, 0, 0], outline = outlineMat, smooth = false } = {}) {\n  const g = prepare(geo, smooth);\n  const m = new THREE.Mesh(g, mat);\n  m.position.set(...pos); m.rotation.set(...rot);\n  m.castShadow = true; m.receiveShadow = !mat.isMeshBasicMaterial;\n  if (outline) { const h = new THREE.Mesh(g, outline); h.userData.helper = true; m.add(h); }\n  parent.add(m);\n  return m;\n}\n\n/* Lofted solid: rings are [height, halfWidth, halfDepth, depthOffset] */\nfunction loftGeo(rings, N = 14, p = .8) {\n  const pos = [], idx = [];\n  rings.forEach(([y, w, d, o = 0]) => {\n    for (let i = 0; i < N; i++) {\n      const a = i / N * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);\n      pos.push(w * Math.sign(c) * Math.abs(c) ** p, y, d * Math.sign(s) * Math.abs(s) ** p + o);\n    }\n  });\n  const R = rings.length, bottom = pos.length / 3; pos.push(0, rings[0][0], rings[0][3] || 0);\n  const top = pos.length / 3; pos.push(0, rings[R - 1][0], rings[R - 1][3] || 0);\n  for (let j = 0; j < R - 1; j++) for (let i = 0; i < N; i++) {\n    const a = j * N + i, b = j * N + (i + 1) % N, c = a + N, d = b + N;\n    idx.push(a, c, d, a, d, b);\n  }\n  for (let i = 0; i < N; i++) {\n    idx.push(bottom, i, (i + 1) % N);\n    idx.push(top, (R - 1) * N + (i + 1) % N, (R - 1) * N + i);\n  }\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));\n  g.setIndex(idx);\n  return g;\n}\nconst loft = (parent, rings, mat, pos, p, N) => add(parent, loftGeo(rings, N, p), mat, pos, { smooth: true });\nconst UP = new THREE.Vector3(0, 1, 0);\n\n/* Limb from a to b: rings are [fraction, halfWidth, halfDepth] */\nfunction limb(parent, a, b, rings, mat, p = 1, N = 12) {\n  const A = new THREE.Vector3(...a), d = new THREE.Vector3(...b).sub(A), len = d.length();\n  const m = [[1.05, 4.76], [.3, 4.93], [0, 5.73], [-.3, 4.93], [-1.05, 4.76], [-.42, 4.42], [0, 3.97], [.42, 4.42]];\n  const ring = (f, z) => rim.map(([x, y]) => [C[0] + (x - C[0]) * f, C[1] + (y - C[1]) * f, z]);\n  const shell = (outer, inner, flip) => {\n    const v = [];\n    for (let i = 0; i < 8; i++) {\n      const j = (i + 1) % 8, a = outer[i], b = outer[j], c = inner[j], d = inner[i];\n      if (flip) v.push(...a, ...c, ...b, ...a, ...d, ...c);\n      else v.push(...a, ...b, ...c, ...a, ...c, ...d);\n    }\n    return v;\n  };\n  const geo = v => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); return g; };\n  const R = [ring(1, 0), ring(.87, .2), ring(.5, .52), ring(.001, .62)];\n  add(upper, geo(shell(R[0], R[1])), M.lite);\n  add(upper, geo([...shell(R[1], R[2]), ...shell(R[2], R[3])]), M.cosmic);\n  // the rear stays shallow before the spike, which gives the concave star profile from the side\n  const waist = ring(.38, -.2), apex = ring(.001, -.9);\n  add(upper, geo([...shell(R[0], waist, true), ...shell(waist, apex, true)]), M.armor);\n\n  for (const s of [-1, 1]) {\n    const eye = k => [[-.15 * k, -.075 * k], [.06 * k, -.075 * k], [.17 * k, .085 * k], [-.03 * k, .085 * k]].map(([o, y]) => [s * o, y]);\n    const g = new THREE.Group(); g.position.set(s * .24, 4.66, .61); g.rotation.y = s * .3; upper.add(g);\n    add(g, shapeGeo(eye(1), .02), M.white, [0, 0, 0], { outline: null });\n    glow(g, [0, 0, .02], .9, 0x5f8dff, .9);\n  }\n}\n\n/* neck, torso and hips */\nloft(upper, [[3.9, .3, .28], [4.25, .26, .26]], M.suit, [0, 0, 0]);\nloft(upper, [[3.92, .46, .38], [4.14, .34, .32]], M.deep, [0, 0, -.02]);\nloft(upper, [[2.5, .5, .34], [2.75, .46, .31], [3.25, .55, .38]], M.suit, [0, 0, 0], .75);\nloft(upper, [[3.1, .56, .38], [3.5, .66, .47], [3.82, .64, .46], [4.02, .38, .32]], M.armor, [0, 0, 0], .7);\nloft(upper, [[2.5, .55, .375], [2.64, .56, .385]], M.armor, [0, 0, 0], .7);\nloft(root, [[2.03, .22, .24 * .08);\n\n  const pitch = fw * GUARD_BODY.lean + ch('lean'), twist = fw * GUARD_BODY.twist + ch('twist');\n  upper.rotation.set(pitch, twist, 0);\n  upper.position.set(0, Math.sin(time * 1.8) * .012 * (1 - p) + HIP_Y * (1 - Math.cos(pitch)), -HIP_Y * Math.sin(pitch));\n\n  const sway = Math.sin(time * 1.5) * .02 * (1 - fw), G = POSES.guard;\n  const energyArm = { [-1]: [p * -.45, p * .1, p * -.82 + sway, p * -.15, p * -.18], 1: [p * -.32, 0, p * .2 - sway, p * -.72, p * -.22] };\n  for (const s of [-1, 1]) {\n    const S = s > 0 ? 'L' : 'R', a = ARMS[s], e = energyArm[s], v = i => fw * G[i] + ch(S + 'xyzfr'[i]);\n    a.arm.rotation.set(e[0] + v(0), e[1] + s * v(1), e[2] + s * v(2));\n    a.fore.rotation.set(e[3] + v(3), s * v(4), e[4]);\n    // relaxed: palm toward the body with the thumb forward; energy: open palm facing out; cast: palm forward, fingers up\n    const open = ch(S + 'o'), base = -s * (2.18 * (1 - p) + .3 * p);\n    a.palm.rotation.y = base * (1 - open) - s * Math.PI * open;\n    a.hand.rotation.x = -Math.PI / 2 * open;\n    ribbonNow[s] = ch(S + 't');\n  }\n  handHeat = [p + fw * .12 + ch('Rh'), p + fw * .12 + ch('Lh')]; // FLAMES holds right then left\n\n  for (const s of [-1, 1]) {\n    const [thigh, knee] = legSolve(drop, s * fw * GUARD_BODY.stride, s), L = LEGS[s], kick = s < 0;\n    const kx = kick ? ch('kx') : 0, ks = kick ? ch('ks') : 0;\n    const rx = (s < 0 ? p * -.85 : p * .22) + thigh + kx, sx = (s < 0 ? p * 1.75 : p * .3) + (kx ? knee * (1 - Math.min(1, -kx)) + ks : knee);\n    L.leg.rotation.set(rx, 0, s < 0 ? p * -.12 : p * .05);\n    L.shin.rotation.set(sx, 0, 0);\n    L.foot.rotation.set((s < 0 ? p * -.3 : p * .45) - thigh - knee, 0, 0);\n  }\n\n  const flap = Math.sin(time * 1.2) * .035, spread = ch('wing'), big = 1 + ch('wingS');\n  WINGS[-1].rotation.y = flap + spread; WINGS[1].rotation.y = -flap - spread;\n  WINGS[-1].scale.setScalar(big); WINGS[1].scale.setScalar(big);\n  const pulse = .84 + Math.sin(time * 2.4) * .16;\n  pulse \n  if (holeCore.visible) inflow(HOLE_POS, 5, 9, .5);\n  if (coreGlow.value > .1) inflow(Vec(0, 3.48 + root.position.y, .7), 4, 7, .45);\n  updateEnergy(flameTime, handHeat);\n  starTime.value = flameTime;\n  updateFx(dt); updateShots(dt); updateCrescents(dt); updateMeteors(dt);\n  due.forEach(([, fx, ...args]) => FX[fx](...args));\n  for (const r of Object.values(ribbons)) r.draw(flameTime);\n  flashEl.style.opacity = whiteNow;\n  camera.fov = baseFov * (1 + wideNow * .85); camera.updateProjectionMatrix();\n  if (goal) {\n    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));\n    if (camera.position.distanceTo(goal) < .02) goal = null;\n  }\n  controls.update();\n  const off = Vec((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);\n  camera.position.add(off);\n  renderer.render(scene, camera);\n  camera.position.sub(off);\n  camShake *= Math.exp(-dt * 7);\n}\n// precompile\n// Draw one frame with every effect switched on while the page loads, clipped to a single pixel so nothing\n// shows. That builds every shader and sends every mesh and texture to the GPU now; otherwise each skill\n// does it the first time it is used, and the page freezes for up to a few seconds as the move starts.\n{\n  const hidden = [];\n  scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });\n  renderer.setScissorTest(true); renderer.setScissor(0, 0, 1, 1);\n  renderer.render(scene, camera);\n  renderer.setScissorTest(false);\n  hidden.forEach(o => { o.visible = false; });\n}\n// /precompile\nanimate();\n<\/script>\n<\!-- forms -->\n<div id=\"forms\" title=\"กด T เพื่อเปลี่ยนร่าง\">\n  <button data-form=\"cosmic_warrior_base.html\" class=\"on\">ร่าง 1 · COSMIC<\/button>\n  <button data-form=\"cosmic_warrior.html\">ร่าง 2 · SUPREME<\/button>\n  <button data-form=\"gemini_aegis.html\">ร่าง 3 · ARGON<\/button>\n<\/div>\n<div id=\"formFade\"><\/div>\n<script>\n// Inside gemini_forms.html every form shares one page, so the switch is handed up to it.\n// Opened on its own, a page can only move to the next file, which works from disk or a server but not from a snapshot.\n(() => {\n  const forms = [...document.querySelectorAll('#forms [data-form]')], fade = document.getElementById('formFade');\n  const here = forms.findIndex(b => b.classList.contains('on'));\n  const hosted = window.parent !== window, canLeave = /^(file|https?):$/.test(location.protocol);\n  if (!hosted && !canLeave) forms.forEach(b => { b.title = 'หน้านี้เปิดแบบสำเนา สลับร่างไม่ได้ · เปิด gemini_forms.html แทน'; });\n  const go = i => {\n    if (i === here) return;\n    if (hosted) return parent.postMessage({ geminiForm: i }, '*');\n    if (!canLeave) return;\n    fade.style.opacity = 1;\n    setTimeout(() => { location.href = forms[i].dataset.form; }, 300);\n    setTimeout(() => { fade.style.opacity = 0; }, 2500); // never strand the page on white if the next one fails to open\n  };\n  forms.forEach((b, i) => b.onclick = () => go(i));\n  addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') go((here + 1) % forms.length); });\n  addEventListener('pageshow', () => { fade.style.opacity = 0; }); // coming back with the browser's back button\n})();\n<\/script>\n<\!-- /forms -->\n<\/body>\n<\/html>\n", "<!doctype html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n<title>Cosmic Warrior 3D<\/title>\n<style>\n  html,body{margin:0;height:100%;overflow:hidden;background:#2c6690;font-family:ui-monospace,Menlo,monospace;color:#e6f6ff}\n  canvas{display:block}\n  #title{position:fixed;left:20px;top:16px;font:600 22px/1.1 system-ui,sans-serif;letter-spacing:.03em;pointer-events:none}\n  #title small{display:block;font:500 12px/1.6 system-ui,sans-serif;opacity:.75;letter-spacing:0}\n  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}\n cument.getElementById('download').onclick = async e => {\n  const button = e.target, label = 'DOWNLOAD GLB';\n  button.disabled = true; button.textContent = 'EXPORTING…';\n  try {\n    pose(0, 0, 0, null, 0); // always export the neutral stance, which is the one to rig from\n    const glb = await new GLTFExporter().parseAsync(exportTree(root), { binary: true });\n    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));\n    const a = document.createElement('a'); a.href = url; a.download = 'cosmic_warrior.glb'; a.click();\n    setTimeout(() => URL.revokeObjectURL(url), 10000);\n    button.textContent = label;\n  } catch (err) {\n    console.error(err);\n    button.textContent = 'EXPORT FAILED';\n  }\n  button.disabled = false;\n};\n\n/* ---------- ui ---------- */\nconst VIEWS = { front: [0, 7.2, 62], side: [62, 7.2, 0], back: [0, 7.2, -62], iso: [33, 22, 50] };\nlet goal = null;\ncamera.position.set(...VIEWS.iso);\ndocument.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { goal = new THREE.Vector3(...VIEWS[b.dataset.view]); });\ncontrols.addEventListener('start', () => { goal = null; });\n\nlet idle = true, energy = false, power = 0;\nlet fightMode = false, act = null, actT = 0, fightW = 0, whiteNow = 0, baseFov = 20;\nconst flashEl = document.getElementById('flash'), fightBtn = document.querySelector('[data-mode=fight]'), actButtons = document.querySelectorAll('[data-act]');\nconst showAct = () => actButtons.forEach(o => o.classList.toggle('on', o.dataset.act === act));\nconst setFight = on => { fightMode = on; fightBtn.classList.toggle('on', on); };\nfightBtn.onclick = () => { if (!act) setFight(!fightMode); };\nactButtons.forEach(b => b.onclick = () => { if (act) return; setFight(true); act = b.dataset.act; actT = 0; showAct(); }); // a move always finishes first\ndocument.getElementById('idle').onclick = e => { idle = !idle; e.target.classList.toggle('on', idle); };\ndocument.getElementById('energy').onclick = e => { energy = !energy; e.target.classList.toggle('on', energy); };\n\nfunction applySize() {\n  camera.aspect = innerWidth / innerHeight;\n  baseFov = camera.aspect < 1 ? Math.min(50, 20 / camera.aspect) : 20; // long lens keeps front and back wing spans alike\n  camera.fov = baseFov;\n  camera.updateProjectionMatrix();\n  renderer.setSize(innerWidth, innerHeight);\n}\napplySize();\naddEventListener('resize', applySize);\n\nconst clock = new THREE.Clock();\nlet t = 0, flameTime = 0;\nfunction animate() {\n  requestAnimationFrame(animate);\n  const dt = Math.min(clock.getDelta(), .1);\n  const t0 = t, move = act ? MOVES[act] : null, q0 = move ? actT / move.dur : 0, fa = flameTime;\n  if (idle) t += dt;\n  flameTime += dt; // flames and stars keep going even when IDLE is off\n  power += ((energy ? 1 : 0) - power) * (1 - Math.exp(-dt * 6));\n  fightW += ((fightMode ? 1 : 0) - fightW) * (1 - Math.exp(-dt * 10));\n  let name = act, q1 = q0, due = [];\n  if (move) {\n    actT += dt; q1 = Math.min(1, actT / move.dur);\n    due = move.fx.filter(([at]) => q0 < at && q1 >= at);\n    if (q1 >= 1) { act = null; actT = 0; showAct(); name = null; q1 = 0; }\n  }\n  fxTime.value = flameTime;\n  // several poses per frame keep the motion trails smooth through fast strikes\n  const steps = name ? 3 : 1;\n  for (let i = 1; i <= steps; i++) {\n    const u = i / steps, at = fa + (flameTime - fa) * u;\n    pose(t0 + (t - t0) * u, power, fightW, name, name ? q0 + (q1 - q0) * u : 0);\n    root.updateWorldMatrix(true, true);\n    for (const s of [-1, 1]) ribbons[s].push(ARMS[s].hand.localToWorld(Vec(-.26, -.36, 0)), ARMS[s].hand.localToWorld(Vec(.26, -.36, 0)), ribbonNow[s], at);\n    ribbons.blade.push(blade.localToWorld(Vec(0, -.8, 0)), blade.localToWorld(Vec(0, -BLADE_LEN * .98, 0)), ribbonNow.blade, at);\n  }\n  if (holeCore.visible) inflow(HOLE_POS, 5, 9, .5);\n  if (coreGlow.value > .1) inflow(Vec(0, 3.48 * GOD_SCALE + root.position.y, .7 * GOD_SCALE), 4, 7, .45);\n  updateEnergy(flameTime, ySelectorAll('#forms [data-form]')], fade = document.getElementById('formFade');\n  const here = forms.findIndex(b => b.classList.contains('on'));\n  const hosted = window.parent !== window, canLeave = /^(file|https?):$/.test(location.protocol);\n  if (!hosted && !canLeave) forms.forEach(b => { b.title = 'หน้านี้เปิดแบบสำเนา สลับร่างไม่ได้ · เปิด gemini_forms.html แทน'; });\n  const go = i => {\n    if (i === here) return;\n    if (hosted) return parent.postMessage({ geminiForm: i }, '*');\n    if (!canLeave) return;\n    fade.style.opacity = 1;\n    setTimeout(() => { location.href = forms[i].dataset.form; }, 300);\n    setTimeout(() => { fade.style.opacity = 0; }, 2500); // never strand the page on white if the next one fails to open\n  };\n  forms.forEach((b, i) => b.onclick = () => go(i));\n  addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') go((here + 1) % forms.length); });\n  addEventListener('pageshow', () => { fade.style.opacity = 0; }); // coming back with the browser's back button\n})();\n<\/script>\n<\!-- /forms -->\n<\/body>\n<\/html>\n", "<!doctype html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n<title>Gemini Argon<\/title>\n<style>\n  html,body{margin:0;height:100%;overflow:hidden;background:#02080f;font-family:ui-monospace,Menlo,monospace;color:#e6fdff}\n  canvas{display:block}\n  #title{position:fixed;left:20px;top:16px;font:600 22px/1.1 system-ui,sans-serif;letter-spacing:.03em;pointer-events:none}\n  #title small{display:block;font:500 12px/1.6 system-ui,sans-serif;opacity:.75;letter-spacing:0}\n  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}\n  button{font:600 12px ui-monospace,Menlo,monospace;padding:9px 12px;background:#08222e;color:#dffcff;border:1px solid #3fe8ff77;border-radius:3px;cursor:pointer}\n  butto ype=\"importmap\">\n{\"imports\":{\"three\":\"https://unpkg.com/three@0.160.0/build/three.module.js\",\"three/addons/\":\"https://unpkg.com/three@0.160.0/examples/jsm/\"}}\n<\/script>\n<\/head>\n<body>\n<div id=\"title\">GEMINI · ARGON<small>ผู้คุมระบบ · ร่างที่ 3 · แอนตี้ไวรัสผสานพลังดวงดาว<br>ลากเพื่อหมุน · เลื่อนเพื่อซูม · คลิกขวาลากเพื่อเลื่อน<\/small><\/div>\n<div id=\"status\">ARGON · SYSTEM ADMINISTRATOR<br>ACCESS <b>ROOT<\/b><br>POWERS <b>ร่าง 1 · 2 · 3<\/b><br>IMMUNITY <b>100%<\/b><br>VIRUS DEFINITIONS <b>∞<\/b><br>THREATS <b id=\"threats\">0<\/b><\/div>\n<div id=\"call\"><b><\/b><span><\/span><\/div>\n<div id=\"prog\"><div><i><\/i><\/div><span><\/span><\/div>\n<div id=\"flash\"><\/div>\n<div id=\"bar\">\n  <button data-view=\"front\">FRONT<\/button>\n  <button data-view=\"side\">SIDE<\/button>\n  <button data-view=\"back\">BACK<\/button>\n  <button data-view=\"iso\">ISO<\/button>\n  <span class=\"gap\"><\/span>\n  <button id=\"idle\" class=\"on\">IDLE<\/button>\n  <button id=\"energy\">ENERGY<\/button>\n  <button data-mode=\"fight\">FIGHT<\/button>\n  <span class=\"gap\"><\/span>\n  <span class=\"lbl\">ร่าง 1<\/span>\n  <button data-act=\"supernova\">SUPERNOVA<\/button>\n  <span class=\"lbl\">ร่าง 2<\/span>\n  <button data-act=\"bigbang\">BIG BANG<\/button>\n  <span class=\"lbl\">ARGON<\/span>\n  <button data-act=\"scan\">SCAN<\/button>\n  <button data-act=\"quarantine\">QUARANTINE<\/button>\n  <button data-act=\"firewall\">FIREWALL<\/button>\n  <button data-act=\"purge\">PURGE<\/button>\n  <button data-act=\"patch\">PATCH<\/button>\n  <span class=\"gap\"><\/span>\n  <button data-act=\"install\">CLEAN INSTALL<\/button>\n  <span class=\"gap\"><\/span>\n  <button id=\"download\">DOWNLOAD GLB<\/button>\n<\/div>\n<script type=\"module\">\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\nimport { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';\n\n/* ---------- scene ---------- */\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(0x02070d);\nconst camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 700);\nconst renderer = new THREE.WebGLRenderer({ antialias: true });\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\nrenderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = THREE.PCFShadowMap;\ndocument.body.appendChild(renderer.domElement);\nconst controls = new OrbitControls(camera, renderer.domElement);\ncontrols.enableDamping = true;\ncontrols.target.set(0, 8.4, 0);\ncontrols.minDistance = 8; controls.maxDistance = 240;\n\nscene.add(new THREE.HemisphereLight(0xe4f8ff, 0x2a5f9a, 1.9));\nconst key = new THREE.DirectionalLight(0xffffff, 2.2);\nkey.position.set(-8, 22, 18); key.castShadow = true;\nkey.shadow.mapSize.set(2048, 2048);\nObject.assign(key.shadow.camera, { left: -15, right: 15, top: 18, bottom: -8, far: 70 });\nkey.shadow.bias = -.001; key.shadow.normalBias = .03;\nscene.add(key);\nconst backLight = new THREE.DirectionalLight(0xc4f4ff, 1.7);\nbackLight.position.set(3, 6, -10); scene.add(backLight);\nconst impactLight = new THREE.PointLight(0xc8fff6, 0, 26, 1.3);\nimpactLight.position.set(0, 4, 3.4); scene.add(impactLight);\n\nconst ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: .28, color: 0x0b2240 }));\nground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);\nconst grid = new THREE.GridHelper(60, 60, 0x2fd0e8, 0x0c2c40);\ngrid.position.y = .002; scene.add(grid);\n\n/* ---------- surfaces ---------- */\nlet seed = 11;\nconst rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;\nconst TILE = 4;\n\nfunction canvasTexture(size, draw, repeat) {\n  const c = document.createElement('canvas'); c.width = c.height = size;\n  draw(c.getContext('2d'), size);\n  const t = new THREE.CanvasTexture(c);\n  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;\n  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;\n  return t;\n}\nfunction blob(x, px, py, r, color, alpha) {\n  const g = x.createRadialGradient(px, py, 0, px, py, r);\n  const [a, b, c] = color;\n  g.addColorStop(0, `rgba(${a},${b},${c},${alpha})`);\n  g.addColorStop(1, `rgba(${a},${b},${c},0)`);\n  x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);\n}\nfunction stars(x, S, count, wrap) {\n  for (let i = 0; i < count; i++) {\n    const px = rnd() * S, py = rnd() * S, v = rnd();\n    x.fillStyle = v > .7 ? '#fff' : v > .35 ? '#c8d6ff' : '#b89aff';\n    const s = v > .94 ? 2.4 : v > .6 ? 1.6 : 1;\n    x.fillRect(px, py, s, s);\n  }\n  x.fillStyle = '#fff';\n  for (let i = 0; i < count / 22; i++) {\n    const px = rnd() * S, py = rnd() * S, r = 3 + rnd() * 5;\n    x.fillRect(px - r, py - .6, r * 2, 1.2); x.fillRect(px - .6, py - r, 1.2, r * 2);\n  }\n}\nconst NEBULA = [[122, 53, 224], [40, 120, 255], [40, 200, 220]];\nconst cosmicTex = canvasTexture(512, (x, S) => {\n  x.fillStyle = '#120c48'; x.fillRect(0, 0, S, S);\n  x.globalCompositeOperation = 'lighter';\n  for (let i = 0; i < 34; i++) {\n    const px = rnd() * S, py = rnd() * S, r = 50 + rnd() * 90, col = NEBULA[rnd() * 3 | 0];\n    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) blob(x, px + dx, py + dy, r, col, .26);\n  }\n  x.globalCompositeOperation = 'source-over';\n  // the antivirus runs through the night sky as circuit traces; each is drawn nine times so the tile wraps\n  const traces = Array.from({ length: 26 }, () => {\n    const p = [[rnd() * S | 0, rnd() * S | 0]];\n    for (let k = 0; k < 4; k++) {\n      const [px, py] = p[p.length - 1], len = 20 + rnd() * 70, dir = rnd() > .5 ? 1 : -1;\n      p.push(k % 2 ? [px, py + len * dir] : [px + len * dir, py]);\n    }\n    return p;\n  });\n  for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) for (const p of traces) {\n    x.strokeStyle = 'rgba(110,255,236,.5)'; x.lineWidth = 2;\n    x.beginPath(); p.forEach(([a, b], i) => (i ? x.lineTo(a + dx, b + dy) : x.moveTo(a + dx, b + dy))); x.stroke
