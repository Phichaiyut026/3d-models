function track(p, keys) {
  if (p <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (p <= b) { const u = b === a ? 1 : (p - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }
  }
  return keys[keys.length - 1][1];
}

function legIK(l, drop, stride) { // keeps the sole flat at a fixed spot while the hips move
  const V = l.H[1] - drop - ANKLE_Y, D = Math.min(Math.hypot(stride, V), THIGH + SHIN - 1e-4);
  const line = Math.atan2(stride, V), hip = Math.acos(unit((THIGH * THIGH + D * D - SHIN * SHIN) / (2 * THIGH * D)));
  const knee = Math.PI - Math.acos(unit((THIGH * THIGH + SHIN * SHIN - D * D) / (2 * THIGH * SHIN)));
  l.thigh.position.set(l.H[0], l.H[1] - drop, l.H[2]);
  l.thigh.rotation.x = -(line + hip);
  l.shin.rotation.x = knee;
  l.foot.rotation.x = line + hip - knee;
}
function pose(time, fw = fightW, name = act, p = name ? actT / MOVES[name].dur : 0, alt = altW, pit = pitchW) {
  const m = name ? MOVES[name] : null, ch = key => (m && m[key] ? track(p, m[key]) : 0);
  const breathe = Math.sin(time * 1.4), idleW = (1 - fw) * (1 - pit), bob = Math.sin(time * 1.5) * fw;

  // flight tilts the whole body about its middle, so it rises rather than swinging from the feet
  const tilt = pit * FLY_PITCH, hover = alt * (FLY_HEIGHT + Math.sin(time * 2.1) * .14);
  root.rotation.set(tilt, ch('spin'), Math.sin(time * .9) * .05 * pit);
  root.position.set(0, ch('leap') * BODY + hover + BODY_CENTER * (1 - Math.cos(tilt)), ch('dash') * BODY - BODY_CENTER * Math.sin(tilt));

  const drop = fw * (GUARD_BODY.drop + bob * .03) + ch('drop');
  pelvis.position.set(0, PELVIS_Y - drop, 0);
  for (const s of [-1, 1]) legIK(legs[s], drop, s * fw * GUARD_BODY.stride + ch(s > 0 ? 'sL' : 'sR'));
  for (const s of [-1, 1]) { legs[s].thigh.rotation.x += pit * .1; legs[s].shin.rotation.x += pit * .25; legs[s].foot.rotation.x += pit * .12; }

  const twist = fw * GUARD_BODY.twist + ch('twist');
  spine.rotation.set(breathe * .01 + fw * GUARD_BODY.lean + ch('lean') - pit * .2, twist, 0);
  head.rotation.y = Math.sin(time * .5) * .16 * idleW - twist * .8;
  head.rotation.x = Math.sin(time * .75) * .02 * idleW - pit * .85;

  const G = POSES.guard, F = POSES.flight, grip = m ? track(p, [[0, 0], [.12, 1], [.88, 1], [1, 0]]) : 0;
  for (const s of [-1, 1]) {
    const S = s > 0 ? 'L' : 'R', a = arms[s], v = i => (fw + idleW) * G[i] + pit * (1 - fw) * F[i] + ch(S + 'xyzfr'[i]);
    a.upper.rotation.set(v(0), s * v(1), s * (v(2) + breathe * .012 * idleW));
    a.fore.rotation.set(v(3) + Math.sin(time * 1.4 + .8) * .018 * idleW, s * v(4), 0);
    a.fore.position.copy(a.foreRest);
    if (s < 0) { const rk = ch('rk'); if (rk) a.fore.position.addScaledVector(toVec(a.foreAxis).applyEuler(a.fore.rotation), rk); }
    a.hand.rotation.x = pit * (1 - fw) * STRAIGHTEN + ch(S + 'w');
    a.hand.rotation.y = s * 2.6 * (fw + idleW) * (1 - grip); // palms turned to face forward
    const closed = grip * (1 - ch('open')); // hands stay open until a move needs a fist
    for (const f of a.fingers) { f.base.rotation.x = .05 + closed * 1.47; f.tip.rotation.x = .06 + closed * 1.69; }
    a.thumb.rotation.x = .08 + closed * .55;
    fistGlow[s].value = fw * .1 + ch(S + 'p');
    palmFlame[s].value = pit * (1 - fw) * 1.15 + alt * (1 - pit) * (1 - fw) * .7 + ch(S + 'g');
    ribbonNow[s] = ch(S + 't');
  }
  rocketFlame.value = ch('rf');

  const out = Math.min(1, ch('blade'));
  sword.visible = out > .01;
  swordCore.scale.y = Math.max(.001, out);
  swordFlame.material.uniforms.len.value = SWORD_LEN * BODY * out;
  swordPower.value = out * (1.05 + Math.sin(time * 37) * .06 + ch('Bp'));
  ribbonNow.blade = ch('Bt');

  fxTime.value = time;
  const flicker = .85 + Math.sin(time * 4) * .15, eye = Math.min(1.6, fw * .4 + ch('eye'));
  glowPower.value = flicker * (.62 + eye * .45);
  chestGlow.value = flicker * (.22 + fw * .12) + ch('charge') * .8;
  wristPower.value = (.92 + Math.sin(time * 9) * .08) * (.95 + ch('wrist'));
  exhaust.value = .62 + fw * .28 + ch('boost') + alt * .9 + pit * .5 + Math.sin(time * 31) * .06;
  soleFlame.value = alt * .85 + pit * .5 + ch('sole') + (alt > .02 ? Math.sin(time * 37) * .06 : 0);
  chestBeam.value = ch('beam') * (.9 + Math.sin(time * 47) * .1);
  if (ch('beam') > .5) camShake = Math.max(camShake, .1);
  impactLight.intensity = flash + ch('beam') * 7;
  M.glow.color.copy(glowBase).multiplyScalar(.85 + flicker * .15);

  moons.rotation.z = time * .35;
  codeRings.forEach(r => { r.t.offset.x = time * r.speed * .03; });
  bubbleOrbit.rotation.y = -time * .12;
  const code = Math.min(1, ch('code')); codeSky.visible = code > .01; codeSkyMat.uniforms.a.value = code;
  const wire = ch('wire'); lattice.visible = latticeCore.visible = wire > .01; lattice.scale.setScalar(wire * 36); lattice.rotation.y = time * .4; latticeCore.scale.setScalar(ch('cite') * 1.7 + wire * 1.3);
  megaPower.value = ch('mega') * (.9 + Math.sin(time * 47) * .1);
  if (ch('mega') > .5) camShake = Math.max(camShake, .55);
  const rw = ch('rw'); rewriteSheet.visible = rw > .004; rewriteMat.uniforms.p.value = rw; rewriteMat.uniforms.aspect.value = innerWidth / innerHeight;
  satellites.rotation.y = time * .55;
  starDust.rotation.y = time * .04;
  const flare = Math.min(1.2, fw * .25 + ch('charge') + ch('boost') * .5);
  finGlow.value = flicker * .7 + flare * .8;
  for (const f of fins) {
    f.arm.rotation.z = -f.s * (f.angle * (1 - pit * .5) + Math.sin(time * 1.2 + f.seed) * .035 * (1 - pit) + flare * .1);
    f.fin.position.y = 1.9 + Math.sin(time * 1.7 + f.seed) * .07 + flare * .45;
    f.fin.rotation.y = f.s * Math.sin(time * .9 + f.seed) * .14;
  }
}

/* ---------- GLB export ---------- */
const exportMats = new Map();
function exportMaterial(mat) {
  if (!exportMats.has(mat)) {
    exportMats.set(mat, mat.isMeshToonMaterial ? new THREE.MeshStandardMaterial({ color: mat.color, roughness: .6, metalness: .15, side: mat.side }) : mat.isShaderMaterial ? new THREE.MeshBasicMaterial({ color: 0x0b3a44, side: mat.side }) : mat.clone());
  }
  return exportMats.get(mat);
}
function exportTree(src) {
  let out;
  if (src.isMesh) {
    const g = new THREE.BufferGeometry();
    for (const name of ['position', 'normal', 'uv']) if (src.geometry.attributes[name]) g.setAttribute(name, src.geometry.attributes[name].clone());
    if (src.geometry.index) g.setIndex(src.geometry.index.clone());
    out = new THREE.Mesh(g, exportMaterial(src.material));
  } else out = new THREE.Group();
  out.name = src.name;
  out.position.copy(src.position); out.quaternion.copy(src.quaternion); out.scale.copy(src.scale);
  for (const child of src.children) { // outlines and additive glow are renderer tricks glTF cannot carry
    if (child.name !== 'LaserSword' && child.material !== hullMat && child.material?.blending !== THREE.AdditiveBlending) out.add(exportTree(child));
  }
  return out;
}
document.getElementById('download').onclick = async e => {
  const button = e.target, label = 'DOWNLOAD GLB';
  button.disabled = true; button.textContent = 'EXPORTING…';
  try {
    pose(0, 0, null, 0, 0, 0); // always export the neutral stance
    const glb = await new GLTFExporter().parseAsync(exportTree(root), { binary: true });
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'chatgpt_mecha.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    button.textContent = label;
  } catch (err) {
    console.error(err);
    button.textContent = 'EXPORT FAILED';
  }
  button.disabled = false;
};

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1);
  const t0 = t, move = act ? MOVES[act] : null, p0 = move ? actT / move.dur : 0;
  t += dt;
  const flying = mode === 'fly';
  fightW += ((mode === 'fight' || (flying && act) ? 1 : 0) - fightW) * (1 - Math.exp(-dt * 9));
  altW += ((flying ? 1 : 0) - altW) * (1 - Math.exp(-dt * 3.2));
  pitchW += ((flying && !act ? 1 : 0) - pitchW) * (1 - Math.exp(-dt * 5));
  flyDist += 24 * pitchW * dt;
  grid.position.z = -(flyDist % 1);
  let name = act, p1 = p0, due = [];
  if (move) {
    actT += dt; p1 = Math.min(1, actT / move.dur);
    due = move.fx.filter(([at]) => p0 < at && p1 >= at);
    if (p1 >= 1) { act = null; actT = 0; showAct(); name = null; p1 = 0; }
  }
  // several poses per frame keep the motion trails smooth through fast strikes
  const steps = name ? 3 : 1;
  for (let i = 1; i <= steps; i++) {
    const u = i / steps, at = t0 + (t - t0) * u;
    pose(at, fightW, name, name ? p0 + (p1 - p0) * u : 0, altW, pitchW);
    root.updateWorldMatrix(true, true);
    for (const s of [-1, 1]) {
      const c = arms[s].fistLocal;
      ribbons[s].push(arms[s].hand.localToWorld(toVec([c[0] - .42, c[1], c[2]])), arms[s].hand.localToWorld(toVec([c[0] + .42, c[1], c[2]])), ribbonNow[s], at);
    }
    ribbons.blade.push(sword.localToWorld(toVec([0, -.4, 0])), swordTip(), ribbonNow.blade, at);
  }
  updateFx(dt);
  updateBolts(dt);
  updateRays(dt);
  updateWind(dt, pitchW);
  due.forEach(([, fx, ...args]) => FX[fx](...args));
  for (const r of Object.values(ribbons)) r.draw(t);
  if (goal) {
    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  const off = new THREE.Vector3((Math.random() - .5) * camShake * 2.4, (Math.random() - .5) * camShake * 2.4, 0);
  camera.position.add(off);
  renderer.render(scene, camera);
  camera.position.sub(off);
  camShake *= Math.exp(-dt * 9);
}
animate();
