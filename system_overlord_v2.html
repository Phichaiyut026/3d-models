<!doctype html>

<style>

<body>
<div id="title">SYSTEM <b>OVERLORD</b><small>The one who controls everything in the system · ลากเพื่อหมุน · เลื่อนเพื่อซูม</small></div>
<div id="flash"></div>
<div id="bar">
  <button data-view="front">FRONT</button>
  <button data-view="side">SIDE</button>
  <button data-view="back">BACK</button>
  <button data-view="iso">ISO</button>
  <span class="gap"></span>
  <button data-act="control">SYSTEM CONTROL</button>
  <button data-act="domination">DATA DOMINATION</button>
  <button data-act="overwrite">REALITY OVERWRITE</button>
  <button data-act="final">FINAL SYSTEM</button>
  <span class="gap"></span>
  <button id="download">DOWNLOAD GLB</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030104);
scene.fog = new THREE.Fog(0x0e0104, 60, 260);
const camera = new THREE.PerspectiveCamera(30, (innerWidth || 1) / (innerHeight || 1), .1, 1500);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth || 1, innerHeight || 1);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 8; controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI * .56;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth || 1, innerHeight || 1), .38, .4, .32));
composer.addPass(new OutputPass());

const key = new THREE.DirectionalLight(0xe8dce6, 1.2);
key.position.set(-10, 30, 22); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -16, right: 16, top: 26, bottom: -4, far: 90 });
scene.add(key);

/* ---------- materials ---------- */
const fxTime = { value: 0 };
const NOISE = `
  float h3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
  float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
  float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }`;

/* Faceted black-violet armour: three hard steps of light, a red rim from the glow behind, and a few red cracks. */
function armor(color, veins = .6, rim = 1) {
  const m = new THREE.ShaderMaterial({
    uniforms: { time: fxTime, base: { value: new THREE.Color(color) }, veins: { value: veins }, rimAmt: { value: rim } },
    vertexShader: `varying vec3 vN, vV, vW;
      void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz;
        vec4 mv = viewMatrix * w; vV = -mv.xyz; vN = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float time, veins, rimAmt; uniform vec3 base; varying vec3 vN, vV, vW;
      ${NOISE}
      void main(){
        vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
        vec3 v = normalize(vV);
        vec3 l = normalize((viewMatrix * vec4(-.45, .75, .55, 0.)).xyz);
        float d = dot(n, l);
        float lit = d > .5 ? 1.4 : (d > .0 ? .7 : .22);
        vec3 col = base * lit;
        float rim = pow(1. - max(dot(n, v), 0.), 3.);
        col += vec3(1., .04, .12) * rim * rimAmt * .22;
        float a = n3(vW * .8 + 7.) + .5 * n3(vW * 2.1);
        float vein = pow(1. - abs(a / 1.5 * 2. - 1.), 110.) * veins * step(.5, n3(vW * .3 + 2.));
        col += vec3(1.6, .05, .16) * vein;
        gl_FragColor = vec4(col, 1.);
      }`,
  });
  m.userData.outline = true;
  return m;
}
const basic = (r, g, b) => { const m = new THREE.MeshBasicMaterial({ toneMapped: false }); m.color.setRGB(r, g, b); return m; };
const M = {
  plate: armor(0x221e2b), dark: armor(0x0d0a12, .4, .8), mid: armor(0x3b3547, .5, 1.1), suit: armor(0x050308, 1.4, .6),
  red: basic(1.9, .08, .22), hot: basic(2.6, .5, .7), white: basic(3, 2.2, 2.4), ember: basic(.9, .03, .1),
};
/* The glowing red line round every silhouette: a slightly larger copy of the shape, drawn inside-out. */
const hullMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, uniforms: { w: { value: .028 } },
  vertexShader: `uniform float w; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normalize(normal) * w, 1.); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(1.5, .06, .18, 1.); }`,
});

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,80,100,.55)'); r.addColorStop(1, 'rgba(255,0,30,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTexture();
function glow(parent, size, color = 0xff1030, opacity = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity, toneMapped: false }));
  s.scale.setScalar(size); s.userData.fx = true; parent.add(s); return s;
}

/* ---------- shape helpers ---------- */
function G(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
function mesh(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m);
  if (mat.userData.outline) { const h = new THREE.Mesh(geo, hullMat); h.userData.line = true; m.add(h); }
  return m;
}
const flip = (pts, s) => s < 0 ? pts.map(p => [-p[0], p[1]]).reverse() : pts;
/* A flat angular plate: a 2D outline extruded `depth`, centred on z, with a small bevel to catch the light. */
function shard(parent, pts, depth, mat = M.plate) {
  const s = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
  const b = Math.min(depth * .35, .07);
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 1 });
  geo.translate(0, 0, -depth / 2); geo.computeVertexNormals();
  return mesh(parent, geo, mat);
}
/* A tapered faceted limb hanging from its joint down -Y. */
function limb(parent, len, r1, r2, mat = M.plate, seg = 6) {
  return mesh(parent, new THREE.CylinderGeometry(r1, r2, len, seg, 1).translate(0, -len / 2, 0), mat);
}
/* A four-sided blade growing from its base up +Y; `flat` squashes it into a diamond section. */
function blade(parent, len, rad, mat = M.plate, flat = .5) {
  const m = mesh(parent, new THREE.ConeGeometry(rad, len, 4).translate(0, len / 2, 0), mat);
  m.scale.z = flat; return m;
}
/* Twelve glowing bars on the edges of a cube. */
function wireCube(parent, size, thick, mat = M.red) {
  const g = G(parent); const h = size / 2;
  for (const axis of [0, 1, 2]) for (const a of [-1, 1]) for (const b of [-1, 1]) {
    const dims = [thick, thick, thick]; dims[axis] = size + thick;
    const pos = [0, 0, 0]; const o = [0, 1, 2].filter(i => i !== axis);
    pos[o[0]] = a * h; pos[o[1]] = b * h;
    const m = new THREE.Mesh(new THREE.BoxGeometry(...dims), mat); m.position.set(...pos); g.add(m);
  }
  return g;
}

/* ---------- the body: twelve heads tall, narrow, all points ---------- */
const rig = G(scene);
const hips = G(rig, 0, 10.6, 0);
const spine = G(hips, 0, .5, 0);
const chest = G(spine, 0, 2.0, 0);
const neck = G(chest, 0, 1.45, 0);
const head = G(neck, 0, .78, 0);

/* a wasp waist in void-black, with small chevrons down the front */
mesh(hips, new THREE.CylinderGeometry(.62, .5, .9, 6), M.dark, 0, 0, 0).scale.z = .7;
mesh(spine, new THREE.CylinderGeometry(.56, .5, 1.7, 6), M.suit, 0, .35, 0).scale.z = .68;
for (let i = 0; i < 3; i++) {
  const w = .36 - i * .04;
  shard(spine, [[-w, 0], [0, -.26], [w, 0], [w * .9, .2], [0, 0], [-w * .9, .2]], .1, M.plate).position.set(0, .05 + i * .4, .4);
}

/* the chest: a wedge from broad shoulders to the waist, a pale breastplate, and the gem */
const torso = mesh(chest, new THREE.CylinderGeometry(1.32, .56, 2.8, 6), M.dark);
torso.rotation.y = Math.PI / 6; torso.scale.set(1, 1, .58);
const breast = shard(chest, [[-1.22, 1.22], [-.42, .92], [0, 1.15], [.42, .92], [1.22, 1.22], [.98, .1], [.38, -.78], [0, -1.8], [-.38, -.78], [-.98, .1]], .26, M.mid);
breast.position.set(0, .05, .62); breast.rotation.x = -.06;
const backplate = shard(chest, [[-1.2, 1.2], [1.2, 1.2], [.9, -.2], [0, -1.6], [-.9, -.2]], .24, M.plate);
backplate.position.set(0, 0, -.62);
shard(chest, [[0, 1.02], [.56, 0], [0, -1.02], [-.56, 0]], .12, M.dark).position.set(0, .12, .8);
const gem = mesh(chest, new THREE.OctahedronGeometry(.5), M.red, 0, .12, .9);
gem.scale.set(.72, 1.5, .42);
mesh(gem, new THREE.OctahedronGeometry(.24), M.white, 0, 0, .25);
glow(gem, 2.6, 0xff1030, .8);
for (const s of [-1, 1]) { // red seams from the gem up to the shoulders and down the ribs
  shard(chest, flip([[.34, .2], [1.12, 1.0], [1.12, 1.1], [.34, .34]], s), .05, M.red).position.set(0, .12, .8);
  shard(chest, flip([[.3, -.3], [.7, -.62], [.66, -.7], [.3, -.42]], s), .05, M.red).position.set(0, .12, .8);
}
const gemLight = new THREE.PointLight(0xff1030, 5, 8, 2); gemLight.position.set(0, .1, 1.8); chest.add(gemLight);

/* a high collar: two points beside the jaw and a plate behind the neck */
for (const s of [-1, 1]) {
  const c = shard(neck, flip([[0, 0], [.55, 0], [.7, 1.55], [.22, .55]], s), .1, M.plate);
  c.position.set(s * .3, -.3, -.2); c.rotation.set(-.15, -s * .55, 0);
}
shard(neck, [[-.6, 0], [.6, 0], [.42, 1.1], [0, 1.35], [-.42, 1.1]], .1, M.dark).position.set(0, -.3, -.5);
limb(neck, .7, .22, .26, M.suit).position.y = .35;

/* the helm: narrow, chin drawn to a point, a black face and two red slits */
const skull = mesh(head, new THREE.CylinderGeometry(.4, .46, .8, 6), M.plate, 0, .28, 0); skull.scale.z = .95;
const jaw = mesh(head, new THREE.ConeGeometry(.46, 1.0, 6), M.plate, 0, -.62, 0); jaw.rotation.x = Math.PI; jaw.scale.z = .95;
shard(head, [[-.34, .32], [.34, .32], [.3, -.1], [0, -.95], [-.3, -.1]], .06, M.suit).position.set(0, -.05, .42);
for (const s of [-1, 1]) {
  const eye = shard(head, flip([[.04, .02], [.3, .16], [.3, .06], [.06, -.06]], s), .04, M.hot);
  eye.position.set(0, .0, .46);
  glow(eye, .6, 0xff1030, .7).position.set(s * .18, .05, .06);
  const brow = shard(head, flip([[0, .12], [.44, .42], [.5, .2], [.1, -.02]], s), .1, M.mid);
  brow.position.set(0, .16, .42);
}
/* the crown grows straight from the helm: a tall centre blade, two flanking, two short */
const crown = G(head, 0, .62, 0);
for (const [x, len, rad, tilt] of [[0, 2.7, .3, 0], [.36, 1.85, .24, .26], [.62, 1.15, .2, .62]])
  for (const s of (x === 0 ? [1] : [-1, 1])) {
    const sp = blade(crown, len, rad, M.plate, .55);
    sp.position.set(s * x, -.05, 0); sp.rotation.z = -s * tilt;
  }
const backSpike = blade(crown, 1.5, .22, M.dark, .6); backSpike.position.set(0, -.1, -.3); backSpike.rotation.x = -.5;

/* the halo: a broad broken band, tipped towards the front, level with the crown */
const halo = G(head, 0, 1.55, 0);
halo.rotation.x = .3;
const haloSpin = G(halo);
const band = (inner, outer, start, len, mat = M.red) => {
  const m = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 96, 1, start, len), mat);
  m.rotation.x = -Math.PI / 2; mat.side = THREE.DoubleSide; haloSpin.add(m); return m;
};
band(2.35, 2.62, .2, Math.PI * 1.25);
band(2.35, 2.62, Math.PI * 1.55, Math.PI * .42);
band(2.72, 2.78, Math.PI * .9, Math.PI * .8, M.ember);
band(2.12, 2.17, 0, Math.PI * 2, M.ember);
for (let i = 0; i < 4; i++) {
  const a = i * Math.PI / 2 + .4;
  mesh(haloSpin, new THREE.BoxGeometry(.5, .05, .12), M.red, Math.cos(a) * 2.95, 0, Math.sin(a) * 2.95).rotation.y = -a;
}

/* shoulders: one great blade thrust out and up, a second below it, a short one beside the neck */
const shoulders = [];
for (const s of [-1, 1]) {
  shoulders.push(G(chest, s * 1.3, 1.02, 0));
  const pad = G(chest, s * 1.3, 1.2, 0);
  mesh(pad, new THREE.SphereGeometry(.62, 6, 4), M.dark).scale.set(1.1, .8, 1);
  const main = blade(pad, 3.0, 1.15, M.plate, .42); // the great plate, thrust out and a little up
  main.rotation.z = -s * 1.2; main.position.set(s * -.35, .1, 0);
  const top = blade(pad, 1.2, .42, M.mid, .5);
  top.rotation.z = -s * .35; top.position.set(s * -.05, .35, -.05);
  const low = blade(pad, 1.9, .7, M.mid, .4);
  low.rotation.z = -s * 1.95; low.position.set(s * .1, -.1, .12);
  mesh(pad, new THREE.OctahedronGeometry(.16), M.red, s * .25, .1, .45).scale.set(.8, 1.3, .5);
}

/* arms: thin, with a flared gauntlet and clawed fingers. The palm is local +Z. */
function arm(side) {
  const upper = G(shoulders[side < 0 ? 0 : 1]);
  limb(upper, 2.6, .3, .23, M.dark);
  const bicep = shard(upper, [[-.22, 0], [.22, 0], [.16, -1.7], [0, -2.1], [-.16, -1.7]], .1, M.plate);
  bicep.position.set(side * .27, -.25, 0); bicep.rotation.y = side * Math.PI / 2;
  const elbow = G(upper, 0, -2.6, 0);
  blade(elbow, .9, .2, M.plate, .7).rotation.x = Math.PI * .62;
  limb(elbow, 2.5, .26, .18, M.dark);
  const cuff = blade(elbow, 1.5, .42, M.mid, .8); cuff.rotation.x = Math.PI; cuff.position.y = -.1; // widest at the elbow
  const fin = shard(elbow, [[0, 0], [.42, -.15], [.16, -1.7], [0, -2.0]], .08, M.plate);
  fin.position.set(side * .2, -.2, -.05); fin.rotation.y = side * Math.PI / 2 + Math.PI * (side < 0 ? 1 : 0);
  const wrist = G(elbow, 0, -2.5, 0);
  const hand = G(wrist);
  mesh(hand, new THREE.BoxGeometry(.46, .5, .14), M.dark, 0, -.27, 0);
  const fingers = [];
  for (let i = 0; i < 4; i++) {
    const f = G(hand, (i - 1.5) * .125, -.52, 0);
    f.rotation.z = (i - 1.5) * .13;
    limb(f, .42, .055, .045, M.plate, 4);
    const tip = G(f, 0, -.42, 0);
    blade(tip, .5, .05, M.plate, 1).rotation.x = Math.PI;
    f.userData.tip = tip; fingers.push(f);
  }
  const thumb = G(hand, -side * .26, -.14, .04);
  thumb.rotation.z = -side * .7;
  limb(thumb, .34, .055, .045, M.plate, 4);
  const thumbTip = G(thumb, 0, -.34, 0);
  blade(thumbTip, .36, .05, M.plate, 1).rotation.x = Math.PI;
  return { upper, elbow, wrist, hand, fingers, thumb, thumbTip };
}
const armR = arm(-1), armL = arm(1);

/* legs: long and thin, ending in points rather than feet, as if it never needs to stand */
function leg(side) {
  const thigh = G(hips, side * .36, -.25, 0);
  limb(thigh, 4.7, .42, .28, M.dark);
  shard(thigh, [[-.24, 0], [.24, 0], [.16, -3.6], [0, -4.3], [-.16, -3.6]], .12, M.plate).position.set(0, -.2, .34);
  const knee = G(thigh, 0, -4.7, 0);
  blade(knee, .9, .2, M.mid, .7).rotation.x = Math.PI * .4;
  limb(knee, 4.5, .28, .13, M.dark);
  shard(knee, [[-.16, 0], [.16, 0], [.05, -4.0], [-.05, -4.0]], .12, M.plate).position.set(0, -.25, .2);
  const ankle = G(knee, 0, -4.5, 0);
  const toe = blade(ankle, 1.3, .16, M.plate, .8); toe.rotation.x = Math.PI * .92; toe.position.y = .1;
  return { thigh, knee, ankle };
}
const legR = leg(-1), legL = leg(1);

/* the coat below the waist: pale pointed hip plates, then long tails ending in points */
const skirt = G(hips, 0, .35, 0);
function tail(pts, x, z, ry, rz, mat, depth = .14) {
  const t = shard(skirt, pts, depth, mat);
  t.position.set(x, 0, z); t.rotation.set(-.03, ry, rz); return t;
}
const front = tail([[-.3, 0], [.3, 0], [.26, -6.2], [0, -10.1], [-.26, -6.2]], 0, .5, 0, 0, M.plate);
shard(front, [[-.035, -.5], [.035, -.5], [.035, -6], [0, -8.5], [-.035, -6]], .04, M.red).position.z = .1;
mesh(skirt, new THREE.OctahedronGeometry(.2), M.red, 0, -.05, .58).scale.set(.8, 1.4, .5);
for (const s of [-1, 1]) {
  tail(flip([[0, .1], [.95, .2], [1.9, -1.9], [.55, -1.2]], s), s * .3, .34, s * .45, 0, M.mid, .16);        // hip plate
  tail(flip([[0, 0], [.8, 0], [1.45, -3.4], [.35, -1.9]], s), s * .34, .2, s * .75, 0, M.plate, .14);           // under it
  tail(flip([[-.42, 0], [.5, 0], [.62, -5.0], [.18, -8.7], [-.3, -5.6]], s), s * .66, .3, s * .4, s * .05, M.plate); // front tail
  tail(flip([[-.6, 0], [.6, 0], [.85, -5.4], [.2, -9.2], [-.5, -6.0]], s), s * .7, -.3, s * 2.3, s * .06, M.dark);   // back tail
}
tail([[-.6, 0], [.6, 0], [.5, -6.4], [0, -9.7], [-.5, -6.4]], 0, -.48, Math.PI, 0, M.dark);

/* ---------- the cape: wide, black outside, red-lit inside, its hem cut into stepped pixel teeth ---------- */
const CAPE = { top: 1.35, len: 14.0 };
const capeMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: { time: fxTime },
  vertexShader: `uniform float time; varying vec2 vUv; varying vec3 vW, vOut; varying float vFold;
    void main(){
      vUv = uv; vec3 p = position; float v = 1. - uv.y;
      vec3 out_ = normalize(vec3(p.x, 0., p.z - .2));
      float sway = sin(v * 4. - time * 1.4 + uv.x * 6.) * .28 + sin(time * .9 + uv.x * 11.) * .12;

      circleMat.uniforms.power.value = 1;

  rig.position.y = .7 + Math.sin(t * 1.1) * .2;
  chest.rotation.x = Math.sin(t * 1.1) * .02;
  head.rotation.y = Math.sin(t * .4) * .06;
  haloSpin.rotation.y = t * .3;
  gemLight.intensity = 5 + Math.sin(t * 2.2) * 2;
  rig.updateMatrixWorld(true);
  applyPose(dt);
  rig.updateMatrixWorld(true);

  /* the cube floats over the open palm */
  armR.hand.localToWorld(cubeHome.set(0, -.45, 0));
  cubeHome.y += 1.45;
  if (cubeOverride.on) { cube.position.copy(cubeOverride.pos); cube.scale.setScalar(cubeOverride.scale); }
  else { cube.position.lerp(cubeHome, t < .3 ? 1 : 1 - Math.exp(-dt * 10)); cube.scale.setScalar(1 + Math.sin(t * 3) * .05); }
  const spinRate = cubeOverride.on ? cubeOverride.spin : 1;
  cubeSpin.rotation.x += dt * .5 * spinRate; cubeSpin.rotation.y += dt * .8 * spinRate;
  cubeLight.intensity = 10 + Math.sin(t * 4) * 3;

  for (const r of ribbons) r.spin.rotation.z += dt * r.speed * slabSpeed;
  /* the slabs only circle while an ability drives them, then settle back where they hang */
  if (slabSpeed > 1.01) slabTurn += dt * .5 * (slabSpeed - 1);
  else slabTurn += (Math.round(slabTurn / (Math.PI * 2)) * Math.PI * 2 - slabTurn) * (1 - Math.exp(-dt * 3));
  for (const s of slabs) {
    const a = s.a + slabTurn + Math.sin(t * .2 + s.bob) * .06;
    const r = s.r * (1 - slabPull);
    s.g.position.set(Math.cos(a) * r, s.y + Math.sin(t * .8 + s.bob) * .4, Math.sin(a) * r);
    s.g.rotation.y = -a + Math.PI / 2 + Math.sin(t * .5 + s.bob) * .3;
    s.g.rotation.z = Math.sin(t * .6 + s.bob) * .08;
  }
  for (let i = 0; i < DUST; i++) {
    const d = dustData[i];
    d.y += dt * d.v * (1 + slabPull * 4);
    if (d.y > 20) { d.y = 0; d.r = 1.5 + Math.random() * 9; }
    const a = d.a + t * .08;
    dummy.position.set(Math.cos(a) * d.r, d.y, Math.sin(a) * d.r);
    dummy.scale.setScalar(d.s * (1 - d.y / 22));
    dummy.rotation.set(0, a, 0);
    dummy.updateMatrix(); dust.setMatrixAt(i, dummy.matrix);
  }
  dust.instanceMatrix.needsUpdate = true;

  for (let i = temp.length - 1; i >= 0; i--) {
    const e = temp[i]; e.t += dt; e.update(e.t, e.o);
    if (e.t >= e.life) { scene.remove(e.o); temp.splice(i, 1); }
  }

  if (viewGoal) { // swing round the target rather than through the body
    const k = 1 - Math.exp(-dt * 5);
    const from = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const to = new THREE.Spherical().setFromVector3(viewGoal.clone().sub(controls.target));
    let dTheta = to.theta - from.theta;
    dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
    from.theta += dTheta * k; from.phi += (to.phi - from.phi) * k; from.radius += (to.radius - from.radius) * k;
    camera.position.setFromSpherical(from).add(controls.target);
    if (camera.position.distanceTo(viewGoal) < .05) viewGoal = null;
  }
  controls.update();
  camera.getWorldDirection(_dir);
  aura.position.set(0, 11, 0).addScaledVector(_dir, 7); // always just behind the figure
  sky.position.copy(camera.position);
  shake *= Math.exp(-dt * 5);
  if (!innerWidth || !innerHeight) return; // a hidden tab has no size to draw into
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  camera.position.x += sx; camera.position.y += sy;
  composer.render();
  camera.position.x -= sx; camera.position.y -= sy;
}
frame();
window.overlord = { camera, controls, setView }; // handy from the console

addEventListener('resize', () => {
  if (!innerWidth || !innerHeight) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
controls.addEventListener('start', () => { viewGoal = null; document.querySelectorAll('[data-view]').forEach(x => x.classList.remove('on')); });
</script>
</body>
</html>
