<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040f);
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 700);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 7.2, 0);
controls.minDistance = 8; controls.maxDistance = 240;

scene.add(new THREE.HemisphereLight(0xe4e6ff, 0x5a4fb0, 1.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-8, 22, 18); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -15, right: 15, top: 18, bottom: -8, far: 70 });
key.shadow.bias = -.001; key.shadow.normalBias = .03;
scene.add(key);
const backLight = new THREE.DirectionalLight(0xcfd4ff, 1.7);
backLight.position.set(3, 6, -10); scene.add(backLight);
const impactLight = new THREE.PointLight(0xfff0c8, 0, 26, 1.3);
impactLight.position.set(0, 4, 3.4); scene.add(impactLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: .28, color: 0x0b2240 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(60, 60, 0x8a74e8, 0x2a2360);
grid.position.y = .002; scene.add(grid);

/* ---------- surfaces ---------- */
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TILE = 4;

function canvasTexture(size, draw, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function blob(x, px, py, r, color, alpha) {
  const g = x.createRadialGradient(px, py, 0, px, py, r);
  const [a, b, c] = color;
  g.addColorStop(0, `rgba(${a},${b},${c},${alpha})`);
  g.addColorStop(1, `rgba(${a},${b},${c},0)`);
  x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
}
function stars(x, S, count, wrap) {
  for (let i = 0; i < count; i++) {
    const px = rnd() * S, py = rnd() * S, v = rnd();
    x.fillStyle = v > .7 ? '#fff' : v > .35 ? '#c8d6ff' : '#b89aff';
    const s = v > .94 ? 2.4 : v > .6 ? 1.6 : 1;
    x.fillRect(px, py, s, s);
  }
  x.fillStyle = '#fff';
  for (let i = 0; i < count / 22; i++) {
    const px = rnd() * S, py = rnd() * S, r = 3 + rnd() * 5;
    x.fillRect(px - r, py - .6, r * 2, 1.2); x.fillRect(px - .6, py - r, 1.2, r * 2);
  }
}
const NEBULA = [[122, 53, 224], [52, 86, 255], [192, 80, 224]];
const cosmicTex = canvasTexture(512, (x, S) => {
  x.fillStyle = '#120c48'; x.fillRect(0, 0, S, S);
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 34; i++) {
    const px = rnd() * S, py = rnd() * S, r = 50 + rnd() * 90, col = NEBULA[rnd() * 3 | 0];
    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) blob(x, px + dx, py + dy, r, col, .26);
  }
  x.globalCompositeOperation = 'source-over';
}, true);
// Wing image: u runs from the spine outward, v from the lowest spike to the top tip.
const wingTex = canvasTexture(1024, (x, S) => {
  x.fillStyle = '#17105a'; x.fillRect(0, 0, S, S);
  x.globalCompositeOperation = 'lighter';
  const spot = (wx, wy, r, col, a) => blob(x, (wx / 2.9) * S, (1 - (wy - 2.1) / 3.1) * S, r * S / 2.9, col, a);
  spot(1.1, 4.15, .75, [52, 96, 255], .75);
  spot(1.55, 3.45, .85, [150, 60, 240], .8);
  spot(1.95, 3.1, .55, [226, 96, 230], .55);
  spot(1.35, 3.85, .35, [150, 190, 255], .55);
  for (let i = 0; i < 22; i++) spot(.7 + rnd() * 1.7, 2.7 + rnd() * 1.8, .1 + rnd() * .25, NEBULA[rnd() * 3 | 0], .3);
  x.globalCompositeOperation = 'source-over';
});

const ramp = new THREE.DataTexture(new Uint8Array([120, 185, 255]), 3, 1, THREE.RedFormat);
ramp.magFilter = ramp.minFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = color => new THREE.MeshToonMaterial({ color, gradientMap: ramp });
const flat = color => new THREE.MeshBasicMaterial({ color, toneMapped: false });
const M = {
  armor: toon(0xf0ecff), lite: toon(0xf4c95d), deep: toon(0x1c1450), suit: toon(0x211d6a), sole: toon(0xb88a2c),
  cosmic: new THREE.MeshBasicMaterial({ map: cosmicTex, toneMapped: false }),
  wing: new THREE.MeshBasicMaterial({ map: wingTex, toneMapped: false }),
  white: flat(0xffffff), ice: flat(0xfff6d8), line: flat(0xfff2c4), neon: flat(0xffe9a8),
};

/* Live stars: nebula images stay still while shader layers orbit and twinkle over them.
   glTF cannot carry a shader, so the GLB uses a copy of each image with stars painted in. */
const starTime = { value: 0 };
const STAR_GLSL = `
  uniform float uStarTime, uScale; uniform vec2 uCenter;
  float starHash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  vec3 starLayer(vec2 uv, float density, float speed, float radius, float prob, float glint){
    float a = uStarTime * speed, c = cos(a), s = sin(a);
    vec2 p = mat2(c, -s, s, c) * uv * density + prob * 37.;
    vec2 id = floor(p), f = fract(p);
    float h = starHash(id);
    if (h > prob) return vec3(0.);
    vec2 d = f - (.3 + .4 * vec2(fract(h * 91.7), fract(h * 47.3)));
    float v = fract(h * 13.1);
    float tw = .3 + .7 * pow(.5 + .5 * sin(uStarTime * (1.2 + v * 4.) + h * 80.), 2.);
    float core = smoothstep(radius * (.6 + .8 * v), 0., length(d));
    float arms = glint * (smoothstep(.3, 0., abs(d.x)) * smoothstep(.022, 0., abs(d.y)) + smoothstep(.3, 0., abs(d.y)) * smoothstep(.022, 0., abs(d.x)));
    vec3 tint = v > .66 ? vec3(1.) : v > .33 ? vec3(.7, .8, 1.) : vec3(.78, .6, 1.);
    return tint * (core + arms) * tw * 1.6;
  }`;
function liveStars(mat, scale, center, exportCount) {
  const nebula = mat.map;
  mat.userData.exportMap = canvasTexture(nebula.image.width, (x, S) => { x.drawImage(nebula.image, 0, 0); stars(x, S, exportCount); }, nebula.wrapS === THREE.RepeatWrapping);
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, { uStarTime: starTime, uScale: { value: scale }, uCenter: { value: new THREE.Vector2(...center) } });
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\n${STAR_GLSL}`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        vec2 starUv = vMapUv * uScale - uCenter;
        diffuseColor.rgb += starLayer(starUv, 9., .028, .1, .62, 0.) + starLayer(starUv, 5.5, .05, .12, .55, 0.) + starLayer(starUv, 3., .085, .11, .4, 1.);`);
  };
}
liveStars(M.cosmic, TILE, [0, 0], 1400);
liveStars(M.wing, 2.9, [1.5, 1.4], 2400); // the wing layers orbit the brightest part of the galaxy
M.suit = M.cosmic; // beneath the armour the body is the universe itself

// hands get their own materials so they can light up without brightening the suit
M.handSuit = toon(0xf0ecff); M.handDeep = toon(0xf4c95d);
for (const m of [M.handSuit, M.handDeep]) { m.emissive.setHex(0xffd98a); m.emissiveIntensity = 0; }

const hull = (color, t) => new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { t: { value: t }, c: { value: new THREE.Color(color).convertLinearToSRGB() } },
  vertexShader: `attribute vec3 smoothNormal; uniform float t;
    void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + smoothNormal * t, 1.); }`,
  fragmentShader: `uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.); }`,
});
const outlineMat = hull(0x120a3a, .02), wingRim = hull(0xf4c95d, .05);

function prepare(geo, smooth) {
  let g = geo;
  if (smooth) { g.computeVertexNormals(); g = g.toNonIndexed(); }
  else { if (g.index) g = g.toNonIndexed(); g.computeVertexNormals(); }
  const p = g.attributes.position, n = g.attributes.normal, count = p.count;
  const uv = new Float32Array(count * 2), ou = rnd(), ov = rnd(), k = 1 / TILE;
  for (let i = 0; i < count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ax >= ay && ax >= az) { u = p.getZ(i); v = p.getY(i); }
    else if (ay >= az) { u = p.getX(i); v = p.getZ(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv[i * 2] = u * k + ou; uv[i * 2 + 1] = v * k + ov;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  const sum = new Map(), keys = [];
  for (let i = 0; i < count; i++) {
    const key = `${Math.round(p.getX(i) * 1e3)},${Math.round(p.getY(i) * 1e3)},${Math.round(p.getZ(i) * 1e3)}`;
    keys.push(key);
    const v = sum.get(key) || new THREE.Vector3();
    v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(key, v);
  }
  const out = new Float32Array(count * 3);
  keys.forEach((key, i) => { const v = sum.get(key).clone().normalize(); out.set([v.x, v.y, v.z], i * 3); });
  g.setAttribute('smoothNormal', new THREE.BufferAttribute(out, 3));
  return g;
}

function add(parent, geo, mat, pos = [0, 0, 0], { rot = [0, 0, 0], outline = outlineMat, smooth = false } = {}) {
  const g = prepare(geo, smooth);
  const m = new THREE.Mesh(g, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = !mat.isMeshBasicMaterial;
  if (outline) { const h = new THREE.Mesh(g, outline); h.userData.helper = true; m.add(h); }
  parent.add(m);
  return m;
}

/* Lofted solid: rings are [height, halfWidth, halfDepth, depthOffset] */
function loftGeo(rings, N = 14, p = .8) {
  const pos = [], idx = [];
  rings.forEach(([y, w, d, o = 0]) => {
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      pos.push(w * Math.sign(c) * Math.abs(c) ** p, y, d * Math.sign(s) * Math.abs(s) ** p + o);
    }
  });
  const R = rings.length, bottom = pos.length / 3; pos.push(0, rings[0][0], rings[0][3] || 0);
  const top = pos.length / 3; pos.push(0, rings[R - 1][0], rings[R - 1][3] || 0);
  for (let j = 0; j < R - 1; j++) for (let i = 0; i < N; i++) {
    const a = j * N + i, b = j * N + (i + 1) % N, c = a + N, d = b + N;
    idx.push(a, c, d, a, d, b);
  }
  for (let i = 0; i < N; i++) {
    idx.push(bottom, i, (i + 1) % N);
    idx.push(top, (R - 1) * N + (i + 1) % N, (R - 1) * N + i);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
const loft = (parent, rings, mat, pos, p, N) => add(parent, loftGeo(rings, N, p), mat, pos, { smooth: true });
const UP = new THREE.Vector3(0, 1, 0);

/* Limb from a to b: rings are [fraction, halfWidth, halfDepth] */
function limb(parent, a, b, rings, mat, p = 1, N = 12) {
  const A = new THREE.Vector3(...a), d = new THREE.Vector3(...b).sub(A), len = d.length();
  const m = loft(parent, rings.map(([t, w, h = w, o = 0]) => [t * len, w, h, o]), mat, a, p, N);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  return m;
}
function shapeGeo(points, depth, bevel = 0) {
  const s = new THREE.Shape(points.map(q => new THREE.Vector2(...q)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 1 });
  g.translate(0, 0, -depth / 2);
  return g;
}
const plate = (parent, pts, depth, mat, pos, opts) => add(parent, shapeGeo(pts, depth, opts?.bevel ?? 0), mat, pos, opts);
const star4 = (r, w = r * .24, h = r) => [[r, 0], [w, w], [0, h], [-w, w], [-r, 0], [-w, -w], [0, -h], [w, -w]];
function orient(obj, normal, up = [0, 1, 0]) {
  const z = new THREE.Vector3(...normal).normalize();
  const x = new THREE.Vector3(...up).cross(z).normalize(), y = z.clone().cross(x);
  obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}

const glowTex = canvasTexture(128, (x, S) => {
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(.4, 'rgba(255,255,255,.25)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
});
const pulses = [];
function glow(parent, pos, size, color, strength = 1) {
  const mat = new THREE.MeshBasicMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat);
  m.position.set(...pos); m.userData.base = strength; pulses.push(m);
  parent.add(m); return m;
}

/* ---------- character ---------- */
const root = new THREE.Group(); root.name = 'CosmicWarrior'; scene.add(root);
const upper = new THREE.Group(); upper.name = 'UpperBody'; root.add(upper);

/* helmet: a four-point star with a bulged mask and a rear spike */
{
  const C = [0, 4.72];
  const rim = [[1.05, 4.76], [.3, 4.93], [0, 5.73], [-.3, 4.93], [-1.05, 4.76], [-.42, 4.42], [0, 3.97], [.42, 4.42]];
  const ring = (f, z) => rim.map(([x, y]) => [C[0] + (x - C[0]) * f, C[1] + (y - C[1]) * f, z]);
  const shell = (outer, inner, flip) => {
    const v = [];
    for (let i = 0; i < 8; i++) {
      const j = (i + 1) % 8, a = outer[i], b = outer[j], c = inner[j], d = inner[i];
      if (flip) v.push(...a, ...c, ...b, ...a, ...d, ...c);
      else v.push(...a, ...b, ...c, ...a, ...c, ...d);
    }
    return v;
  };
  const geo = v => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); return g; };
  const R = [ring(1, 0), ring(.87, .2), ring(.5, .52), ring(.001, .62)];
  add(upper, geo(shell(R[0], R[1])), M.lite);
  add(upper, geo([...shell(R[1], R[2]), ...shell(R[2], R[3])]), M.cosmic);
  // the rear stays shallow before the spike, which gives the concave star profile from the side
  const waist = ring(.38, -.2), apex = ring(.001, -.9);
  add(upper, geo([...shell(R[0], waist, true), ...shell(waist, apex, true)]), M.armor);

  for (const s of [-1, 1]) {
    const eye = k => [[-.15 * k, -.075 * k], [.06 * k, -.075 * k], [.17 * k, .085 * k], [-.03 * k, .085 * k]].map(([o, y]) => [s * o, y]);
    const g = new THREE.Group(); g.position.set(s * .24, 4.66, .61); g.rotation.y = s * .3; upper.add(g);
    add(g, shapeGeo(eye(1), .02), M.white, [0, 0, 0], { outline: null });
    glow(g, [0, 0, .02], .9, 0xffd98a, .9);
  }
}

/* neck, torso and hips */
loft(upper, [[3.9, .3, .28], [4.25, .26, .26]], M.suit, [0, 0, 0]);
loft(upper, [[3.92, .46, .38], [4.14, .34, .32]], M.deep, [0, 0, -.02]);
loft(upper, [[2.5, .5, .34], [2.75, .46, .31], [3.25, .55, .38]], M.suit, [0, 0, 0], .75);
loft(upper, [[3.1, .56, .38], [3.5, .66, .47], [3.82, .64, .46], [4.02, .38, .32]], M.armor, [0, 0, 0], .7);
loft(upper, [[2.5, .55, .375], [2.64, .56, .385]], M.armor, [0, 0, 0], .7);
loft(root, [[2.03, .22, .24], [2.3, .42, .32], [2.54, .5, .34]], M.suit, [0, 0, 0], .75);
plate(root, [[-.2, 2.42], [.2, 2.42], [.09, 2.12], [0, 2.03], [-.09, 2.12]], .3, M.deep, [0, 0, .25], { bevel: .02 });
for (const s of [-1, 1]) plate(root, [[s * .28, 2.52], [s * .56, 2.5], [s * .54, 2.2], [s * .36, 2.1]], .5, M.armor, [0, 0, 0], { bevel: .02 });

// chest plate, star medallion and lower glowing panel
plate(upper, [[-.62, 3.92], [-.66, 3.52], [-.36, 3.26], [0, 3.03], [.36, 3.26], [.66, 3.52], [.62, 3.92], [.26, 3.99], [0, 3.86], [-.26, 3.99]], .5, M.lite, [0, 0, .28], { bevel: .03 });
plate(upper, [[-.52, 3.82], [-.56, 3.54], [-.3, 3.32], [0, 3.14], [.3, 3.32], [.56, 3.54], [.52, 3.82], [.25, 3.88], [0, 3.76], [-.25, 3.88]], .5, M.armor, [0, 0, .3], { outline: null });
plate(upper, star4(.47, .17, .55), .08, M.lite, [0, 3.48, .57], { bevel: .015 });
plate(upper, star4(.35, .09, .42), .02, M.white, [0, 3.48, .625], { outline: null });
glow(upper, [0, 3.48, .645], 1.5, 0xffe3a0, 1);

plate(upper, [[-.48, 3.22], [.48, 3.22], [.46, 2.76], [0, 2.38], [-.46, 2.76]], .55, M.suit, [0, 0, .12]);

function track(q, keys) {
  if (q <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (q <= b) { const u = b === a ? 1 : (q - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }
  }
  return keys[keys.length - 1][1];
}

  add(LEGS[s].shin, new THREE.TorusGeometry(.36, .05, 8, 22), M.lite, [s * .08, -.86, .02], { rot: [Math.PI / 2, 0, 0], smooth: true });
}
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2, r = i % 2 ? .78 : 1.02;
  plate(upper, [[-.045, 0], [.045, 0], [0, r - .6]], .02, M.neon, [Math.cos(a) * .6, 3.48 + Math.sin(a) * .6, .66], { rot: [0, 0, a - Math.PI / 2], outline: null });
}

// the armillary of the multiverse: tilted orbits, each carrying whole universes
const armillary = new THREE.Group(); armillary.position.y = 3.2; root.add(armillary);
const orbits = [[3.2, [1.2, 0, .3], .23], [2.96, [.3, .5, 1.3], -.31], [3.08, [Math.PI / 2 + .55, .9, 0], .17]].map(([r, rot, speed], n) => {
  const tilt = new THREE.Group(); tilt.rotation.set(...rot); armillary.add(tilt);
  const spin = new THREE.Group(); tilt.add(spin);
  add(tilt, new THREE.TorusGeometry(r, .022, 6, 110), M.lite, [0, 0, 0], { smooth: true, outline: null });
  [0xff6ad5, 0x6ae0ff, 0xffd86a, 0x8dff9a, 0xb08cff].forEach((color, i) => {
    const a = i / 5 * Math.PI * 2 + n, q = [Math.cos(a) * r, Math.sin(a) * r, 0], size = .11 + (i * 7 % 5) * .022;
    add(spin, new THREE.SphereGeometry(size, 18, 14), M.cosmic, q, { smooth: true, outline: null });
    glow(spin, q, size * 11, color, 1);
  });
  return { spin, speed };
});

// light of creation, always behind the body
const godRays = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, uniforms: { time: godTime, power: auraPower },
  vertexShader: `varying vec2 vP; void main(){ vP = position.xy; vec4 c = modelViewMatrix * vec4(0., 0., 0., 1.); c.xyz += vec3(position.xy * 10.5, -4.); gl_Position = projectionMatrix * c; }`,
  fragmentShader: `uniform float time, power; varying vec2 vP;
    void main(){
      float r = length(vP), a = atan(vP.y, vP.x), t = time;
      float rays = pow(.5 + .5 * sin(a * 14. + t * .3 + sin(a * 5. - t * .5) * 2.), 3.) * .7 + pow(.5 + .5 * sin(a * 37. - t * .6), 6.) * .5;
      float fall = pow(max(1. - r, 0.), 1.7);
      float ripple = .5 + .5 * sin(r * 46. - t * 3.);
      vec3 pal = .55 + .45 * cos(6.2832 * (a / 6.2832 + r * 1.4 - t * .06 + vec3(0., .33, .67)));
      vec3 col = mix(vec3(1., .9, .66), pal, .55) * (rays * fall * 1.1 + ripple * fall * .1) + vec3(1., .93, .75) * exp(-r * r * 9.) * .9;
      gl_FragColor = vec4(col * power, 1.);
    }`,
}));
godRays.frustumCulled = false; godRays.position.y = 3.2; godRays.renderOrder = 0; root.add(godRays);

// the mandala of creation under the feet
const groundFx = new THREE.Group(); root.add(groundFx);
const mandala = new THREE.Mesh(new THREE.PlaneGeometry(7.4, 7.4).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, uniforms: { time: godTime, power: auraPower },
  vertexShader: `varying vec2 vP; void main(){ vP = position.xz / 3.7; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform float time, power; varying vec2 vP;
    float line(float v, float w){ return smoothstep(w, 0., abs(v)); }
    void main(){
      float d = length(vP), a = atan(vP.y, vP.x), t = time;
      float rings = line(d - .93, .012) + line(d - .78, .008) + line(d - .42, .008) + line(d - .3, .012);
      float k = 12., sect = abs(fract((a + t * .12) / 6.2832 * k) - .5) * 2.;
      float star = line(d - (.3 + .48 * sect), .012) * step(d, .8);
      float k2 = 24., ticks = line(fract((a - t * .2) / 6.2832 * k2) - .5, .06) * step(.8, d) * step(d, .92);
      float wash = pow(max(1. - d, 0.), 2.) * .18;
      vec3 col = vec3(1., .82, .42) * (rings * .9 + star + ticks * .8) + vec3(.65, .45, 1.) * wash;
      gl_FragColor = vec4(col * step(d, 1.) * power, 1.);
    }`,
}));
mandala.position.y = .012; mandala.renderOrder = 1; groundFx.add(mandala);

/* ---------- poses ---------- */
const HIP_Y = 2.5, THIGH = .98, SHIN = 1.08, ANKLE_Y = .34;
const unit = v => Math.max(-1, Math.min(1, v));
let handHeat = [0, 0], wideNow = 0, ribbonNow = { 1: 0, [-1]: 0, blade: 0 };
function legSolve(drop, stride, s) { // knee bend that keeps the foot planted while the hips drop
  const V = LEG_H - drop, D = Math.min(Math.hypot(stride, V), THIGH + SHIN - 1e-4);
  const line = Math.atan2(stride, V), hip = Math.acos(unit((THIGH * THIGH + D * D - SHIN * SHIN) / (2 * THIGH * D)));
  return [-(line + hip), Math.PI - Math.acos(unit((THIGH * THIGH + SHIN * SHIN - D * D) / (2 * THIGH * SHIN)))];
}
const LEG_H = 2.4 - ANKLE_Y;
function pose(time, power, fw = fightW, name = act, q = name ? actT / MOVES[name].dur : 0) {
  const m = name ? MOVES[name] : null, ch = key => (m && m[key] ? track(q, m[key]) : 0);
  const p = power * (1 - fw), lift = Math.sin(time * 1.4) * .04 * p, god = (1 - fw) * (1 - power);
  const drop = fw * GUARD_BODY.drop + ch('drop');
  root.position.set(0, p * .62 + lift - drop * GOD_SCALE + ch('leap') * 1.8 + god * (1.5 + Math.sin(time * 1.1) * .14), ch('dash') * 2);
  root.rotation.set(p * .05 + ch('rootX'), p * .12, p * .08);

  const pitch = fw * GUARD_BODY.lean + ch('lean'), twist = fw * GUARD_BODY.twist + ch('twist');
  upper.rotation.set(pitch, twist, 0);
  upper.position.set(0, Math.sin(time * 1.8) * .012 * (1 - p) + HIP_Y * (1 - Math.cos(pitch)), -HIP_Y * Math.sin(pitch));

  const sway = Math.sin(time * 1.5) * .02 * (1 - fw), G = POSES.guard;
  const energyArm = { [-1]: [p * -.45, p * .1, p * -.82 + sway, p * -.15, p * -.18], 1: [p * -.32, 0, p * .2 - sway, p * -.72, p * -.22] };
  for (const s of [-1, 1]) {
    const S = s > 0 ? 'L' : 'R', a = ARMS[s], e = energyArm[s], v = i => fw * G[i] + ch(S + 'xyzfr'[i]);
    a.arm.rotation.set(e[0] + v(0), e[1] + s * v(1), e[2] + s * v(2));
    a.fore.rotation.set(e[3] + v(3), s * v(4), e[4]);
    a.arm.rotation.z += s * god * .34; // held open, as if presiding over everything
    a.fore.rotation.x -= god * .3;
    // relaxed: palm toward the body with the thumb forward; energy: open palm facing out; cast: palm forward, fingers up
    const open = ch(S + 'o'), bare = Math.max(p, (1 - power) * .85), base = -s * (2.18 * (1 - bare) + .3 * bare);
    a.palm.rotation.y = base * (1 - open) - s * Math.PI * open;
    a.hand.rotation.x = -Math.PI / 2 * open;
    ribbonNow[s] = ch(S + 't');
  }
  handHeat = [p + fw * .12 + ch('Rh'), p + fw * .12 + ch('Lh')]; // FLAMES holds right then left

  for (const s of [-1, 1]) {
    const [thigh, knee] = legSolve(drop, s * fw * GUARD_BODY.stride, s), L = LEGS[s], kick = s < 0;
    const kx = kick ? ch('kx') : 0, ks = kick ? ch('ks') : 0;
    const rx = (s < 0 ? p * -.85 : p * .22) + thigh + kx, sx = (s < 0 ? p * 1.75 : p * .3) + (kx ? knee * (1 - Math.min(1, -kx)) + ks : knee);
    L.leg.rotation.set(rx, 0, s < 0 ? p * -.12 : p * .05);
    L.shin.rotation.set(sx, 0, 0);
    L.foot.rotation.set((s < 0 ? p * -.3 : p * .45) - thigh - knee + god * .5, 0, 0);
  }

  const flap = Math.sin(time * 1.2) * .035, spread = ch('wing'), big = 1 + ch('wingS');
  WINGS[-1].rotation.y = flap + spread; WINGS[1].rotation.y = -flap - spread;
  WINGS[-1].scale.setScalar(big); WINGS[1].scale.setScalar(big);
  const pulse = .84 + Math.sin(time * 2.4) * .16;
  pulses.forEach(g => { g.material.opacity = g.userData.base * pulse; });

  const out = Math.min(1, ch('blade'));
  blade.visible = out > .01; bladeBody.scale.y = Math.max(.001, out);
  const bladeGrow = 1 + ch('bladeS');
  blade.scale.setScalar(bladeGrow);
  bladeFlame.material.uniforms.len.value = BLADE_LEN * GOD_SCALE * bladeGrow * out;
  bladeFlame.material.uniforms.rad.value = 1.3 * GOD_SCALE * (1 + ch('bladeS') * .55);
  bladePower.value = out * (.85 + Math.sin(time * 31) * .07 + ch('Bp'));
  ribbonNow.blade = ch('Bt');

  comet.value = ch('tail');
  coreGlow.value = ch('core');
  const bh = ch('bh'), sn = ch('sn'), domain = ch('dom');
  holeCore.visible = holeDisc.visible = bh > .02;
  holeCore.scale.setScalar(bh * 5.4);
  holeDisc.material.uniforms.size.value = bh * 32; holeDisc.material.uniforms.a.value = Math.min(1, bh * 1.5);
  dome.visible = domain > .01; domeMat.uniforms.a.value = domain;
  novaShell.visible = sn > .002 && sn < .995; novaShell.scale.setScalar(sn * 170); novaMat.uniforms.a.value = (1 - sn) * 1.4;
  whiteNow = ch('white'); wideNow = ch('wide');
  impactLight.intensity = flash;

  godTime.value = time;
  const gal = ch('gal'), mv = ch('mv'), mvC = ch('mvC'), rift = ch('rift'), shat = ch('shatter');
  galaxyDisc.visible = gal > .004; galaxyDisc.scale.setScalar(10 + gal * 250); galaxyDisc.material.uniforms.a.value = Math.min(1, gal * 1.6); galaxyDisc.rotation.z = time * .08;
  for (const u of universes) {
    const grow = Math.max(0, Math.min(1, (mv - u.delay * .7) / .3));
    u.s.visible = grow > .01;
    if (!u.s.visible) continue;
    const a = time * .07, c = Math.cos(a), s = Math.sin(a), k = mvC * mvC;
    u.s.position.set(u.home.x * c - u.home.z * s, u.home.y, u.home.x * s + u.home.z * c).lerp(WORLD_C, k);
    u.s.scale.setScalar(u.size * grow * (1 - k * .75));
  }
  riftPower.value = rift; riftFloor.visible = rift > .01;
  shatter.visible = shat > .004; shatterMat.uniforms.p.value = shat; shatterMat.uniforms.aspect.value = innerWidth / innerHeight;
  auraPower.value = .9 + fw * .2 + Math.min(1, ch('core')) * .5 + Math.sin(time * 2.2) * .05;
  infinity.rotation.y = time * .5;
  armillary.rotation.y = time * .05;
  for (const o of orbits) o.spin.rotation.z = time * o.speed;
  groundFx.position.set(0, -root.position.y / GOD_SCALE, -root.position.z / GOD_SCALE);
}

/* ---------- GLB export ---------- */
const exportMats = new Map();
function exportMaterial(mat) {
  if (!exportMats.has(mat)) {
    exportMats.set(mat, mat.isMeshToonMaterial
      ? new THREE.MeshStandardMaterial({ color: mat.color, roughness: .55, metalness: .1 })
      : mat.userData.exportMap
        ? new THREE.MeshBasicMaterial({ map: mat.userData.exportMap, toneMapped: false })
        : mat);
  }
  return exportMats.get(mat);
}
function exportGeometry(src) {
  const g = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) g.setAttribute(name, src.attributes[name].clone());
  return g;
}
function exportTree(src) {
  const out = src.isMesh ? new THREE.Mesh(exportGeometry(src.geometry), exportMaterial(src.material)) : new THREE.Group();
  out.name = src.name;
  out.position.copy(src.position); out.quaternion.copy(src.quaternion); out.scale.copy(src.scale);
  for (const child of src.children) {
    // outlines, flames and additive glows are viewer effects glTF cannot carry
    if (child.userData.helper || child.isLight || child.material?.blending === THREE.AdditiveBlending) continue;
    out.add(exportTree(child));
  }
  return out;
}
document.getElementById('download').onclick = async e => {
  const button = e.target, label = 'DOWNLOAD GLB';
  button.disabled = true; button.textContent = 'EXPORTING…';
  try {
    pose(0, 0, 0, null, 0); // always export the neutral stance, which is the one to rig from
    const glb = await new GLTFExporter().parseAsync(exportTree(root), { binary: true });
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'cosmic_warrior.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    button.textContent = label;
  } catch (err) {
    console.error(err);
    button.textContent = 'EXPORT FAILED';
  }
  button.disabled = false;
};

/* ---------- ui ---------- */
const VIEWS = { front: [0, 7.2, 62], side: [62, 7.2, 0], back: [0, 7.2, -62], iso: [33, 22, 50] };
let goal = null;
camera.position.set(...VIEWS.iso);
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { goal = new THREE.Vector3(...VIEWS[b.dataset.view]); });
controls.addEventListener('start', () => { goal = null; });

let idle = true, energy = false, power = 0;
let fightMode = false, act = null, actT = 0, fightW = 0, whiteNow = 0, baseFov = 20;
const flashEl = document.getElementById('flash'), fightBtn = document.querySelector('[data-mode=fight]'), actButtons = document.querySelectorAll('[data-act]');
const showAct = () => actButtons.forEach(o => o.classList.toggle('on', o.dataset.act === act));
const setFight = on => { fightMode = on; fightBtn.classList.toggle('on', on); };
fightBtn.onclick = () => { if (!act) setFight(!fightMode); };
actButtons.forEach(b => b.onclick = () => { if (act) return; setFight(true); act = b.dataset.act; actT = 0; showAct(); }); // a move always finishes first
document.getElementById('idle').onclick = e => { idle = !idle; e.target.classList.toggle('on', idle); };
document.getElementById('energy').onclick = e => { energy = !energy; e.target.classList.toggle('on', energy); };

function applySize() {
  camera.aspect = innerWidth / innerHeight;
  baseFov = camera.aspect < 1 ? Math.min(50, 20 / camera.aspect) : 20; // long lens keeps front and back wing spans alike
  camera.fov = baseFov;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
applySize();
addEventListener('resize', applySize);

const clock = new THREE.Clock();
let t = 0, flameTime = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1);
  const t0 = t, move = act ? MOVES[act] : null, q0 = move ? actT / move.dur : 0, fa = flameTime;
  if (idle) t += dt;
  flameTime += dt; // flames and stars keep going even when IDLE is off
  power += ((energy ? 1 : 0) - power) * (1 - Math.exp(-dt * 6));
  fightW += ((fightMode ? 1 : 0) - fightW) * (1 - Math.exp(-dt * 10));
  let name = act, q1 = q0, due = [];
  if (move) {
    actT += dt; q1 = Math.min(1, actT / move.dur);
    due = move.fx.filter(([at]) => q0 < at && q1 >= at);
    if (q1 >= 1) { act = null; actT = 0; showAct(); name = null; q1 = 0; }
  }
  fxTime.value = flameTime;
  // several poses per frame keep the motion trails smooth through fast strikes
  const steps = name ? 3 : 1;
  for (let i = 1; i <= steps; i++) {
    const u = i / steps, at = fa + (flameTime - fa) * u;
    pose(t0 + (t - t0) * u, power, fightW, name, name ? q0 + (q1 - q0) * u : 0);
    root.updateWorldMatrix(true, true);
    for (const s of [-1, 1]) ribbons[s].push(ARMS[s].hand.localToWorld(Vec(-.26, -.36, 0)), ARMS[s].hand.localToWorld(Vec(.26, -.36, 0)), ribbonNow[s], at);
    ribbons.blade.push(blade.localToWorld(Vec(0, -.8, 0)), blade.localToWorld(Vec(0, -BLADE_LEN * .98, 0)), ribbonNow.blade, at);
  }
  if (holeCore.visible) inflow(HOLE_POS, 5, 9, .5);
  if (coreGlow.value > .1) inflow(Vec(0, 3.48 * GOD_SCALE + root.position.y, .7 * GOD_SCALE), 4, 7, .45);
  updateEnergy(flameTime, handHeat);
  starTime.value = flameTime;
  updateFx(dt); updateShots(dt); updateCrescents(dt); updateMeteors(dt);
  due.forEach(([, fx, ...args]) => FX[fx](...args));
  for (const r of Object.values(ribbons)) r.draw(flameTime);
  flashEl.style.opacity = whiteNow;
  camera.fov = baseFov * (1 + wideNow * .85); camera.updateProjectionMatrix();
  if (goal) {
    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  const off = Vec((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);
  camera.position.add(off);
  renderer.render(scene, camera);
  camera.position.sub(off);
  camShake *= Math.exp(-dt * 7);
}
// precompile
// Draw one frame with every effect switched on while the page loads, clipped to a single pixel so nothing
// shows. That builds every shader and sends every mesh and texture to the GPU now; otherwise each skill
// does it the first time it is used, and the page freezes for up to a few seconds as the move starts.
{
  const hidden = [];
  scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
  renderer.setScissorTest(true); renderer.setScissor(0, 0, 1, 1);
  renderer.render(scene, camera);
  renderer.setScissorTest(false);
  hidden.forEach(o => { o.visible = false; });
}
// /precompile
animate();
</script>

<div id="formFade"></div>
<script>
// Inside gemini_forms.html every form shares one page, so the switch is handed up to it.
// Opened on its own, a page can only move to the next file, which works from disk or a server but not from a snapshot.
(() => {
  const forms = [...document.querySelectorAll('#forms [data-form]')], fade = document.getElementById('formFade');
  const here = forms.findIndex(b => b.classList.contains('on'));
  const hosted = window.parent !== window, canLeave = /^(file|https?):$/.test(location.protocol);
  if (!hosted && !canLeave) forms.forEach(b => { b.title = 'หน้านี้เปิดแบบสำเนา สลับร่างไม่ได้ · เปิด gemini_forms.html แทน'; });
  const go = i => {
    if (i === here) return;
    if (hosted) return parent.postMessage({ geminiForm: i }, '*');
    if (!canLeave) return;
    fade.style.opacity = 1;
    setTimeout(() => { location.href = forms[i].dataset.form; }, 300);
    setTimeout(() => { fade.style.opacity = 0; }, 2500); // never strand the page on white if the next one fails to open
  };
  forms.forEach((b, i) => b.onclick = () => go(i));
  addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') go((here + 1) % forms.length); });
  addEventListener('pageshow', () => { fade.style.opacity = 0; }); // coming back with the browser's back button
})();
</script>
