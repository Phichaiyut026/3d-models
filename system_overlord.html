<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050810);
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 1500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 15, 0);
controls.minDistance = 14; controls.maxDistance = 420;

scene.add(new THREE.HemisphereLight(0x8a9ac4, 0x1c1420, 1.6));
const key = new THREE.DirectionalLight(0xdfe4f5, 2.3);
key.position.set(-16, 44, 34); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -30, right: 30, top: 34, bottom: -12, far: 130 });
key.shadow.bias = -.004; key.shadow.normalBias = .2;

const rimRed = new THREE.DirectionalLight(0xff2a40, 3.4); rimRed.position.set(9, 7, -11); scene.add(rimRed);
const rimViolet = new THREE.DirectionalLight(0x8a4cff, 3.4); rimViolet.position.set(-10, 8, -9); scene.add(rimViolet);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: .45 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(150, 60, 0x3a1016, 0x1a0a0e);

/* ---------- materials ---------- */
const ramp = new THREE.DataTexture(new Uint8Array([70, 140, 215, 255]), 4, 1, THREE.RedFormat);

const BODY = 2.7;
const fxTime = { value: 0 };
const voidMat = new THREE.ShaderMaterial({ // not a surface so much as a hole in the shape of a body, veined with red
  uniforms: { time: fxTime },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform float time; varying vec3 vP;

    void main(){
      float a = n(vP * 3.1 + time * .1) + .5 * n(vP * 7.3 - time * .16);
      float vein = pow(1. - abs(a / 1.5 * 2. - 1.), 26.);
      gl_FragColor = vec4(vec3(.004, .002, .006) + vec3(1., .03, .08) * vein * (.7 + .3 * sin(time * 2.6)), 1.);
    }`,

  plate: toon(0x14151d), mid: toon(0x21232e), lite: toon(0x3c3f4e), suit: voidMat, gray: toon(0x1f2028),
  silver: toon(0x6a6e7c), black: toon(0x020204), gold: toon(0x8f6a26),
  cape: new THREE.MeshToonMaterial({ color: 0x4a0a14, gradientMap: ramp, side: THREE.DoubleSide }),

/* a soft flame: distance to a tapering capsule, on a quad that turns about its axis to face the camera */
function softFlame(parent, pos, dir, { len, rad, color, power }) {
  len *= BODY; rad *= BODY;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(rad * 3.4, len + rad * 3.4).translate(0, len / 2, 0), new THREE.ShaderMaterial({
    side: THREE.DoubleSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    uniforms: { time: fxTime, power, len: { value: len }, rad: { value: rad }, color: { value: new THREE.Color(color) } },
    vertexShader: `varying vec2 vP;
      void main(){
        vec4 c = modelViewMatrix * vec4(0., 0., 0., 1.);
        vec3 axis = normalize((modelViewMatrix * vec4(0., 1., 0., 0.)).xyz);
        vec3 view = normalize(-c.xyz);
        vec3 side = normalize(cross(axis, view));
        vP = position.xy;
        gl_Position = projectionMatrix * vec4(c.xyz + side * position.x + axis * position.y + view * .25, 1.);
      }`,
    fragmentShader: `uniform float time, power, len, rad; uniform vec3 color; varying vec2 vP;
      void main(){
        float up = clamp(vP.y / max(len, .001), 0., 1.);
        float wob = sin(vP.y * 6. - time * 13.) * .05 + sin(vP.y * 13. - time * 21. + 1.) * .03;
        float d = length(vec2(vP.x + wob * up * rad * 1.6 / (1. + len * .35), vP.y - clamp(vP.y, 0., len * (.88 + .12 * sin(time * 19.)))));

      }`,
  }));
  mesh.position.set(...rel(pos, pivotOf(parent)));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...dir).normalize());
  mesh.frustumCulled = false; parent.add(mesh);
  return mesh;
}

const hullMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: `attribute vec3 smoothNormal;
    void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + smoothNormal * .024, 1.); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(.03,.035,.05,1.); }`,
});

/* ---------- building blocks: everything is authored in rest-pose world coordinates ---------- */
const rel = (p, o) => p.map((v, i) => v - o[i]);
const lerp3 = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
const pivotOf = g => g.userData.pivot || [0, 0, 0];

function joint(parent, pivot, name) {
  const g = new THREE.Group(); g.name = name; g.userData.pivot = pivot;
  g.position.set(...rel(pivot, pivotOf(parent))); parent.add(g);
  return g;
}

function outlined(geo) { // averaged normals keep the outline closed at hard corners
  const p = geo.attributes.position, n = geo.attributes.normal, sum = new Map(), keys = [];
  for (let i = 0; i < p.count; i++) {
    const key = `${Math.round(p.getX(i) * 1e3)},${Math.round(p.getY(i) * 1e3)},${Math.round(p.getZ(i) * 1e3)}`;
    keys.push(key);
    const v = sum.get(key) || new THREE.Vector3();
    v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(key, v);
  }
  const smooth = new Float32Array(p.count * 3);
  keys.forEach((key, i) => { const v = sum.get(key).clone().normalize(); smooth.set([v.x, v.y, v.z], i * 3); });
  geo.setAttribute('smoothNormal', new THREE.BufferAttribute(smooth, 3));
  return geo;
}

function add(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], outline = true) {
  const m = new THREE.Mesh(outlined(geo), mat);
  m.position.set(...rel(pos, pivotOf(parent))); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = !mat.isMeshBasicMaterial;
  if (outline) m.add(new THREE.Mesh(geo, hullMat));
  parent.add(m);
  return m;
}

function aim(mesh, a, b) {
  const d = new THREE.Vector3(...b).sub(new THREE.Vector3(...a)).normalize();
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
  return mesh;
}
const dist = (a, b) => new THREE.Vector3(...a).distanceTo(new THREE.Vector3(...b));

function limb(parent, a, b, r1, r2, mat, sides = 16) { // a tapered capsule
  const L = dist(a, b), pts = [];
  for (let i = 0; i <= 5; i++) { const t = -Math.PI / 2 + i / 5 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(t) * r1, 1e-3), Math.sin(t) * r1)); }
  for (let i = 0; i <= 5; i++) { const t = i / 5 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(t) * r2, 1e-3), L + Math.sin(t) * r2)); }
  return aim(add(parent, new THREE.LatheGeometry(pts, sides), mat, a), a, b);
}
function cyl(parent, a, b, r1, r2, mat, sides = 18, outline = true) {
  const g = new THREE.CylinderGeometry(r2, r1, dist(a, b), sides, 1);
  return aim(add(parent, g, mat, lerp3(a, b, .5), [0, 0, 0], outline), a, b);
}
function bar(parent, a, b, w, t, mat, outline = true) {
  return aim(add(parent, new THREE.BoxGeometry(w, dist(a, b), t), mat, lerp3(a, b, .5), [0, 0, 0], outline), a, b);
}
function ball(parent, pos, [rx, ry, rz], mat) {
  return add(parent, new THREE.SphereGeometry(1, 22, 16).scale(rx, ry, rz), mat, pos);
}
const box = (parent, pos, size, mat, rot, outline = true) => add(parent, new THREE.BoxGeometry(...size), mat, pos, rot, outline);

function shapeGeo(points, depth, bevel = 0) {
  const s = new THREE.Shape(points.map(p => new THREE.Vector2(...p)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 2, curveSegments: 6 });
  g.translate(0, 0, -depth / 2);
  return g;
}
const rrect = (w, h, c) => [[-w + c, -h], [w - c, -h], [w, -h + c], [w, h - c], [w - c, h], [-w + c, h], [-w, h - c], [-w, -h + c]];
function pad(parent, pos, [w, h, d], mat, rot) { // a chamfered tactical block
  const b = Math.min(.03, d / 4);
  return add(parent, shapeGeo(rrect(w / 2 - b, h / 2 - b, Math.min(w, h) * .16), d - b * 2, b), mat, pos, rot);
}

/* lofted surfaces: stacked ellipses {y, rx, rz, cx, cz, half}, half being a shell's angular half-width */
const KEYS = ['y', 'rx', 'rz', 'cx', 'cz', 'half'];
function refine(s, n = 4) { // Catmull-Rom between sections, so a few numbers give a smooth profile
  const at = i => s[Math.max(0, Math.min(s.length - 1, i))], out = [];
  for (let i = 0; i < s.length - 1; i++) for (let k = 0; k < n; k++) {
    const u = k / n, o = {};
    for (const key of KEYS) {
      const [a, b, c, d] = [at(i - 1), at(i), at(i + 1), at(i + 2)].map(x => x[key] || 0);
      o[key] = .5 * (2 * b + (c - a) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (3 * b - a - 3 * c + d) * u * u * u);
    }
    o.rx = Math.max(o.rx, .002); o.rz = Math.max(o.rz, .002);
    out.push(o);
  }
  out.push({ cx: 0, cz: 0, half: 0, ...s[s.length - 1] });
  return out;
}
function section(secs, y) {
  for (let i = 0; i < secs.length - 1; i++) {
    const a = secs[i], b = secs[i + 1];
    if (y <= b.y || i === secs.length - 2) {
      const u = (y - a.y) / (b.y - a.y), o = {};
      for (const key of KEYS) o[key] = (a[key] || 0) + ((b[key] || 0) - (a[key] || 0)) * u;
      return o;
    }

}
const onSurface = (s, y, th, lift = 0) => [s.cx + (s.rx + lift) * Math.sin(th), y, s.cz + (s.rz + lift) * Math.cos(th)];
const pointAtX = (secs, y, x, lift = 0) => { const s = section(secs, y); return onSurface(s, y, Math.asin((x - s.cx) / s.rx), lift); };

function indexed(positions, index) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(index); g.computeVertexNormals();
  return g;
}
function loftBody(secs, sides = 30) { // a closed solid
  const pos = [], idx = [], rings = secs.length;
  for (const s of secs) for (let j = 0; j < sides; j++) pos.push(...onSurface(s, s.y, j / sides * Math.PI * 2));
  for (let i = 0; i < rings - 1; i++) for (let j = 0; j < sides; j++) {
    const a = i * sides + j, b = i * sides + (j + 1) % sides, c = a + sides, d = b + sides;
    idx.push(a, b, d, a, d, c);
  }
  const first = secs[0], last = secs[rings - 1], bottom = pos.length / 3, top = bottom + 1;
  pos.push(first.cx, first.y, first.cz, last.cx, last.y, last.cz);
  for (let j = 0; j < sides; j++) {
    const k = (j + 1) % sides;
    idx.push(bottom, k, j, top, (rings - 1) * sides + j, (rings - 1) * sides + k);

}
function loftShell(secs, { th0 = 0, depth = .05, cols = 24 } = {}) { // a curved armour plate with real thickness
  const pos = [], idx = [], ring = secs.length;
  const P = (i, j, inset) => { const s = secs[i]; return onSurface(s, s.y, th0 + (j / cols * 2 - 1) * s.half, inset); };
  const grid = (inset, flip) => {
    const base = pos.length / 3;
    for (let i = 0; i < ring; i++) for (let j = 0; j <= cols; j++) pos.push(...P(i, j, inset));
    for (let i = 0; i < ring - 1; i++) for (let j = 0; j < cols; j++) {

  grid(0, false); grid(-depth, true);
  const quad = (a, b, c, d) => { const n = pos.length / 3; pos.push(...a, ...b, ...c, ...d); idx.push(n, n + 1, n + 2, n, n + 2, n + 3); };
  for (let i = 0; i < ring - 1; i++) {
    quad(P(i, 0, 0), P(i + 1, 0, 0), P(i + 1, 0, -depth), P(i, 0, -depth));
    quad(P(i + 1, cols, 0), P(i, cols, 0), P(i, cols, -depth), P(i + 1, cols, -depth));
  }
  for (let j = 0; j < cols; j++) {
    quad(P(ring - 1, j, 0), P(ring - 1, j + 1, 0), P(ring - 1, j + 1, -depth), P(ring - 1, j, -depth));

const shell = (parent, secs, mat, opts, outline = true) => add(parent, loftShell(refine(secs), opts), mat, [0, 0, 0], [0, 0, 0], outline);
const solid = (parent, secs, mat, sides) => add(parent, loftBody(refine(secs), sides), mat);
function band(parent, y, h, cx, cz, rx, rz, mat) {
  const c = { cx, cz, rx, rz };
  return solid(parent, [{ ...c, y: y - h / 2 }, { ...c, y: y + h / 2 }], mat, 22);
}

function canvasTexture(draw, w = 512, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);

  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;

function decal(parent, secs, yBottom, yTop, half, texture, th0 = 0, lift = .012) { // lettering that follows the curve of a plate
  const fine = refine(secs), pos = [], uv = [], idx = [], cols = 18, rows = 10;
  for (let i = 0; i <= rows; i++) for (let j = 0; j <= cols; j++) {
    const u = j / cols, v = i / rows, y = yBottom + (yTop - yBottom) * v;

/* ---------- armour detailing: thin patches laid on a plate's own surface ---------- */
const skin = color => new THREE.MeshToonMaterial({ color, gradientMap: ramp, side: THREE.DoubleSide });
const D = { lite: skin(0x69738c), dark: skin(0x0d0e14), sage: skin(0x4a5062), sageDark: skin(0x323746), cream: skin(0x7b8295), seam: skin(0x05060a), creamDark: skin(0x323746) };

  patch(parent, secs, lo, hi, s => -s.half, s => -s.half + w, mat, o);

  patch(parent, secs, lo, lo + h, s => -s.half, s => s.half, mat, o);

const lineH = (parent, secs, y, a, b, opts, mat = D.seam, t = .02) => patch(parent, secs, y - t, y + t, a, b, mat, { rows: 1, ...opts });

function updateCombat(dt) {
  for (const o of fissures) {
    if (!o.mesh.visible) continue;
    o.age += dt;
    if (o.age >= o.life) { o.mesh.visible = false; continue; }
    const u = o.mesh.material.uniforms; u.reveal.value = Math.min(1, o.age / .22); u.a.value = 1.25 * (1 - (o.age / o.life) ** 2);
  }
  for (const s of dataSpikes) {
    if (!s.g.visible) continue;
    s.age += dt;
    if (s.age >= s.life) { s.g.visible = false; continue; }
    const a = Math.max(0, s.age), up = a < .12 ? a / .12 : a > s.life - .34 ? (s.life - a) / .34 : 1;
    s.g.scale.y = Math.max(.001, s.h * up);
  }
  for (const c of crystals) { if (!c.mesh.visible) continue; c.life -= dt; if (c.life <= 0) { c.mesh.visible = false; continue; } c.mesh.position.addScaledVector(c.v, dt); }
  for (const c of chips) { if (!c.mesh.visible) continue; c.life -= dt; if (c.life <= 0) { c.mesh.visible = false; continue; } c.mesh.position.addScaledVector(c.v, dt); c.mesh.rotation.x += dt * 9; }

  swordBody.rotation.set(ch('edge'), 0, swordAngle);
  swordOut = Math.min(1, ch('draw'));
  for (const s of [-1, 1]) arms[s].hand.rotation.y = s * (HAND_TURN + ch((s > 0 ? 'L' : 'R') + 'h')) * (s < 0 ? 1 - swordOut : 1); // the sword hand turns back into its grip
  arms[-1].fingers.forEach(([a, b]) => { a.rotation.x = .2 + swordOut; b.rotation.x = .3 + swordOut; }); arms[-1].thumb.rotation.x = .1 + swordOut * .8;
  swordShaft.scale.x = .28;
  const big = 1.3 + ch('big') * 1.3; // a heavier blade than any man could lift
  swordBody.scale.set(big, 1 + ch('big') * .7, 1 + ch('big') * .7);
  ribbonNow.blade = ch('Bt'); ribbonNow.claw = ch('Ct');

  fxTime.value = time;
  const glitch = Math.sin(time * 43) * Math.sin(time * 7.3) > .55 ? 1.5 : 1;
  const charge = ch('charge');
  redGlow.value = (.34 + breathe * .06) * glitch + charge * .7;
  reactorGlow.value = .78 + Math.sin(time * 2.2) * .14;
  violetGlow.value = .24 + Math.sin(time * 1.6) * .06 + Math.abs(ch('wing')) * .5;
  fireGlow.value = .2 + Math.sin(time * 19) * .05 + ch('fire') * .5;
  auraBoost = ch('aura');
  bladeCharge.value = ch('Bp') * .55 * (.9 + Math.sin(time * 37) * .1);
  coreBeam.value = ch('beam') * (.9 + Math.sin(time * 47) * .1);
  if (ch('beam') > .5) camShake = Math.max(camShake, .12);
  const sky = ch('sky'), sig = ch('sigil');
  skyDome.visible = sky > .01; skyMat.uniforms.a.value = sky;
  sigil.visible = sig > .01; sigil.material.uniforms.a.value = sig;
  whiteNow = ch('white'); wideNow = ch('wide');
  updateWorldEnd(ch);
  const holeSize = 1 + ch('bh') * 2.8;
  holeGroup.scale.setScalar(holeSize);
  holeGroup.position.z = -14 - (holeSize - 1) * HOLE_R * 1.05; // however large it grows, its near edge stays behind the body
  holeDisc.rotation.z = -time * .32;
  { // the cape moves with a slow wind off the black hole
    const p = capeGeo.attributes.position;
    capeRest.forEach((r, i) => p.setZ(i, r.z + Math.sin(time * 1.3 + r.x * 1.4 + r.v * 5) * .22 * r.v - .06 * r.v * Math.sin(time * 2.7 + r.x)));
    p.needsUpdate = true;
  }
  holeRing.uniforms.power.value = .95 + Math.sin(time * 1.7) * .08 + ch('bh') * .4;
  graveyard.rotation.y = time * .05;
  worlds.forEach((w, i) => {
    const eat = ch('eat'), delay = Math.max(0, Math.min(1, eat * 1.4 - i * .05));
    const a = w.a + time * w.speed, r = w.r * (1 - delay * delay);
    w.m.position.set(Math.cos(a) * r, Math.sin(a * 1.3) * .8, Math.sin(a) * r);
    w.m.visible = delay < .97; w.m.rotation.y = time * .1 + i; w.m.scale.setScalar(1 - delay * delay * .7);
  });
  ashPos.forEach((_, i) => {
    if (i % 3 !== 1) return;
    let y = ashPos[i] - ashSpeed[i / 3 | 0] * .012;
    ashPos[i] = y < 0 ? 13 : y;
  });
  ashGeo.attributes.position.needsUpdate = true;
  hawking.value = ch('ray') * (.9 + Math.sin(time * 41) * .1);
  if (hawking.value > .4) camShake = Math.max(camShake, .8);
  const end = ch('end'), none = ch('none');
  doomSheet.visible = end > .002 || none > .002;
  doomMat.uniforms.p.value = end; doomMat.uniforms.none.value = none; doomMat.uniforms.aspect.value = innerWidth / innerHeight;
  impactLight.intensity = flash + ch('beam') * 7;
  M.red.color.copy(redBase).multiplyScalar(.85 + (glitch > 1 ? .25 : breathe * .1) + ch('aura') * .15);
  for (const o of shards) { o.m.position.y = o.y + Math.sin(time * 1.6 + o.r * 3) * .035; o.m.rotation.z = o.r + time * .25 * Math.sign(o.r); }
}

/* ---------- GLB export ---------- */
const exportMats = new Map();
function exportMaterial(mat) {
  if (!exportMats.has(mat)) {
    exportMats.set(mat, mat.isMeshToonMaterial ? new THREE.MeshStandardMaterial({ color: mat.color, roughness: .5, metalness: .35, side: mat.side }) : mat.isShaderMaterial ? new THREE.MeshStandardMaterial({ color: 0x050308, roughness: .9, metalness: 0 }) : mat.clone());
  }
  return exportMats.get(mat);
}
function exportTree(src) {
  let out;
  if (src.isMesh) {
    const g = new THREE.BufferGeometry();
    for (const name of ['position', 'normal', 'uv', 'color']) if (src.geometry.attributes[name]) g.setAttribute(name, src.geometry.attributes[name].clone());
    if (src.geometry.index) g.setIndex(src.geometry.index.clone());
    out = new THREE.Mesh(g, exportMaterial(src.material));
  } else out = new THREE.Group();
  out.name = src.name;
  out.position.copy(src.position); out.quaternion.copy(src.quaternion); out.scale.copy(src.scale);
  for (const child of src.children) { // outlines and additive glows are renderer tricks glTF cannot carry
    if (child.material !== hullMat && child.material !== edgeMat && child.material?.blending !== THREE.AdditiveBlending) out.add(exportTree(child));
  }
  return out;
}
document.getElementById('download').onclick = async e => {
  const button = e.target, label = 'DOWNLOAD GLB';
  button.disabled = true; button.textContent = 'EXPORTING…';
  try {
    pose(0, 0, null, 0); // always export the resting stance
    root.updateWorldMatrix(true, true); placeSword();
    const glb = await new GLTFExporter().parseAsync(exportTree(root), { binary: true });
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'system_overlord.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    button.textContent = label;
  } catch (err) {
    console.error(err);
    button.textContent = 'EXPORT FAILED';
  }
  button.disabled = false;
};

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1);
  if (!edgesAligned) { edgesAligned = true; alignEdges(); }
  const t0 = t, move = act ? MOVES[act] : null, q0 = move ? actT / move.dur : 0, tF0 = fxClock;
  if (idle) t += dt;
  fxClock += dt;
  fightW += ((fightMode ? 1 : 0) - fightW) * (1 - Math.exp(-dt * 8));
  guardRoll += ((act ? 0 : 1) - guardRoll) * (1 - Math.exp(-dt * 12));
  let name = act, q1 = q0, due = [];
  if (move) {
    actT += dt; q1 = Math.min(1, actT / move.dur);
    due = move.fx.filter(([at]) => q0 < at && q1 >= at);
    if (q1 >= 1) { act = null; actT = 0; showAct(); name = null; q1 = 0; }
  }
  // several poses per frame keep the motion trails smooth through fast swings
  const steps = name ? 3 : 1;
  for (let i = 1; i <= steps; i++) {
    const u = i / steps, at = tF0 + (fxClock - tF0) * u;
    pose(t0 + (t - t0) * u, fightW, name, name ? q0 + (q1 - q0) * u : 0);
    root.updateWorldMatrix(true, true);
    placeSword();
    ribbons.blade.push(swordPoint(.4), swordPoint(swordLen * (1 + (name ? (MOVES[name].big ? 0 : 0) : 0))), ribbonNow.blade, at);
    ['c0', 'c1', 'c2'].forEach((k, j) => ribbons[k].push(clawPoint(j - 1, 0), clawPoint(j - 1, 1), ribbonNow.claw, at));
  }
  updateFx(dt); updateCombat(dt); updateCrescents(dt);
  due.forEach(([, fx, ...args]) => FX[fx](...args));
  for (const r of Object.values(ribbons)) r.draw(fxClock);
  updateAura(dt, t + (fxClock - t) * 0);
  flashEl.style.opacity = whiteNow;
  camera.fov = baseFov * (1 + wideNow * .75); camera.updateProjectionMatrix();
  if (goal) {
    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  if (act === 'worldend') { if (!cineSaved) { cineSaved = camera.position.clone(); goal = null; } cine(actT / MOVES.worldend.dur); }
  else if (cineSaved) { camera.position.copy(cineSaved); cineSaved = null; camera.fov = baseFov; camera.updateProjectionMatrix(); camera.lookAt(controls.target); }
  const shakeBy = Vec((Math.random() - .5) * camShake * 2.6, (Math.random() - .5) * camShake * 2.6, 0);
  camera.position.add(shakeBy);
  renderer.render(scene, camera);
  camera.position.sub(shakeBy);
  camShake *= Math.exp(-dt * 7);
}
animate();
</script>
