    void main(){ vec4 c = texture2D(tDiffuse, vUv); if (any(isnan(c)) || any(isinf(c))) c = vec4(0., 0., 0., 1.); gl_FragColor = vec4(min(c.rgb, vec3(40.)), c.a); }`,
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .5, .45, .82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function setForm(form) {
  if (!THEMES[form]) return;
  curForm = form;
  const T = curTheme = THEMES[form];
  document.body.classList.toggle('red', form === 'red');
  document.body.classList.toggle('black', form === 'black');
  document.getElementById('title').firstChild.textContent = T.name;
  document.querySelectorAll('[data-form]').forEach(b => b.classList.toggle('on', b.dataset.form === form));

  rimA.color.setHex(T.rimA); rimB.color.setHex(T.rimB); kick.color.setHex(T.kick);
  scene.background.setHex(T.bg); scene.fog.color.setHex(T.bg);

  ['plate', 'mid', 'lite', 'dark', 'steel'].forEach((k, i) => M[k].color.setHex(T.armor[i]));
  M.green.color.setHex(T.primary); M.deep.color.setHex(T.deep); M.pale.color.setHex(T.pale);
  greenA.setHex(T.rootA); greenB.setHex(T.rootB);
  links.material.color.setHex(T.chain);
  pillars.material.color.setHex(T.pillar);
  smokes.forEach(o => o.s.material.color.setHex(T.smoke));
  themePrimaryMats.forEach(m => m.color.setHex(T.primary));
  themePaleMats.forEach(m => m.color.setHex(m.opacity > .9 ? T.bolt : m.opacity === 0 ? T.crescent : T.paleFx));
  boltMesh.material.color.setHex(T.bolt);
  crescentMat.color.setHex(T.crescent);
  themeSprites.forEach(s => {
    const r = s.userData.themeRole;
    s.material.color.setHex(r === 'flare' ? T.flare : r === 'backdrop' ? T.backdrop : r === 'backglow' ? T.backglow : T.primary);
  });

  voxGreen.setHex(T.vox);
  const pktPale = new THREE.Color(T.pktPale), wormHead = new THREE.Color(T.paleFx);
  for (let i = 0; i < VOX; i++) voxels.setColorAt(i, i % 3 ? voxGreen : voxDark);
  voxels.instanceColor.needsUpdate = true;
  for (let i = 0; i < PKT; i++) packets.setColorAt(i, i % 7 === 0 ? voxDark : i % 4 === 0 ? pktPale : voxGreen);
  packets.instanceColor.needsUpdate = true;
  for (let i = 0; i < WORM_N; i++) worm.setColorAt(i, i < 2 ? wormHead : i % 5 === 0 ? voxDark : voxGreen);
  worm.instanceColor.needsUpdate = true;

  drawVisor(T); setTimer(timerText, true); drawCode(T); drawCape(T); drawCracks(T);
  holos.forEach(h => h.userData.drawHolo(T));

  rainMat.uniforms.uCol1.value.set(...T.rain1); rainMat.uniforms.uCol2.value.set(...T.rain2);
  floorMat.uniforms.uColor.value.set(...T.floor);
  shaftMat.uniforms.uColor.value.set(...T.shaft);
  skinMain.uniforms.tint.value.setHex(T.skin); skinMain.uniforms.tintHi.value.set(...T.skinHi);
  ghostA.uniforms.tint.value.setHex(T.ghostA); ghostB.uniforms.tint.value.setHex(T.ghostB);
  binPts.material.uniforms.uColor.value.set(...T.bin);
}
document.querySelectorAll('[data-form]').forEach(b => b.onclick = () => {
  setForm(b.dataset.form);
  flash = Math.max(flash, .25); camShake = Math.max(camShake, .5);
});

let glitchT = 2, glitchOn = 0;
function updateStyle(dt, t) {
  zt.value = t;
  shafts.forEach(({ g, s }) => { g.rotation.z = s * (.32 + Math.sin(t * .35 + s) * .14); g.rotation.x = .25 + Math.sin(t * .27 + s * 2) * .08; });
  // glitch bursts: a few times a second during skills, every couple of seconds at rest
  glitchT -= dt;
  if (glitchT <= 0) { glitchOn = .12 + Math.random() * .16; glitchT = (act ? .35 : 1.6) + Math.random() * (act ? .6 : 2.4); }
  glitchOn = Math.max(0, glitchOn - dt);
  glitchAmt.value = glitchOn > 0 ? (.6 + Math.random() * .4) : 0;
  const ghostK = glitchAmt.value;
  ghostA.uniforms.strength.value = ghostB.uniforms.strength.value = ghostK * .7;
  if (ghosts[0].visible !== ghostK > 0) ghosts.forEach(g => g.visible = ghostK > 0);
  skinMain.uniforms.strength.value = .5 + (act ? .25 : 0) + ghostK * .3;
  document.getElementById('title').classList.toggle('glitch', ghostK > 0);
}

/* ---------- loop ---------- */
const clock = new THREE.Clock(); let boltClock = 0, glitchClock = 0, camW = 1, camL = 0;
const flashEl = document.getElementById('flash');
let simT = 0;
function animate() {
  requestAnimationFrame(animate);
  frameStep(Math.min(clock.getDelta(), .05));
}
function frameStep(dt) {
  simT += dt; const t = simT;
  fightW += (fightGoal - fightW) * (1 - Math.exp(-dt * 7));
  calmW += ((calmGoal && !act ? 1 : 0) - calmW) * (1 - Math.exp(-dt * 5));
  stowW += (((act ? MOVES[act].noBlade : calmGoal) ? 1 : 0) - stowW) * (1 - Math.exp(-dt * 6)); // skills without the sword leave it on the back
  const move = act && MOVES[act], q0 = move ? actT / move.dur : 0;
  let due = [];
  if (move) {
    actT += dt * (rootT > 0 ? 1.35 : 1); const q1 = Math.min(1, actT / move.dur);
    due = move.fx.filter(([at]) => q0 < at && q1 >= at);
    if (q1 >= 1) { act = null; actT = 0; resetSkills(); showAct(); }
  }
  const q = pose(t);
  due.forEach(([, name, ...args]) => FX[name](...args));
  updateCape(t);
  updateLocks(t, q);
  updateFx(dt, t, q);
  updateSkills(dt, t, q);
  updateStyle(dt, t);
  updateNew(dt, t, q);
  boltClock += dt;
  if (boltClock > .055) { boltClock = 0; regrowBolts(); edgeFlare.scale.setScalar(4 + Math.random() * 3.5); }
  codeTex.offset.y = (t * .35) % 1; codeA.material.map = codeTex;
  // the countdown only ever arrives at zero
  if (act === 'countdown') { const left = Math.max(0, Math.ceil((1 - q / .82) * 9)); setTimer(`00:00:0${left}`); }
  else if (act === 'ransom') setTimer('LOCKED!!');
  else if (act === 'rain') setTimer(Math.random() > .5 ? 'PAYLOAD' : 'DROP>>>');
  else if (act === 'worm') setTimer('WORM.EXE');
  else if (act === 'master') setTimer(q < .73 ? 'KEY>>>>' : 'UNLOCKED');
  else if (act === 'panic') setTimer(Math.random() > .5 ? 'PANIC!!!' : '0xDEAD00');
  else if (rootT > 0) setTimer(`R00T:${String(Math.ceil(rootT)).padStart(2, '0')}`);
  else {
    glitchClock -= dt;
    if (glitchClock < -.12) { glitchClock = 1.6 + Math.random() * 3.5; setTimer('00:00:00'); }
    else if (glitchClock < 0) setTimer(Math.random() > .5 ? '0x:00:FF' : 'NU:LL:00');
  }
  spin += ((act === 'countdown' ? 9 * (q < .82 ? 1 : 0) + 1 : 1) + rootW * 2 - spin) * (1 - Math.exp(-dt * 4));
  orbitClock += dt * spin;
  orbitArcs.forEach((a, i) => a.rotation.z = a.userData.from + Math.sin(orbitClock * (.5 + i * .13)) * .22);
  haloArcs.forEach((a, i) => a.rotation.z += dt * (i < 3 ? .07 : -.14) * spin);
  halo.position.y = 18.2 - hips.position.y * 0 + Math.sin(t * .9) * .15;
  visorGlow.material.opacity = .42 + Math.sin(t * 8) * .06 + (Math.random() > .95 ? .24 : 0);
  backGlow.material.opacity = .2 + Math.sin(t * .8) * .04;
  holos.forEach((h, i) => { h.position.y += Math.sin(t * .7 + i) * .002; h.material.opacity = Math.random() > .985 ? .22 : .68; });
  flashEl.style.opacity = Math.min(.9, flash);
  if (goal) { camera.position.lerp(goal, 1 - Math.exp(-dt * 7)); if (camera.position.distanceTo(goal) < .02) goal = null; }
  { // the big new powers pull the camera back and up to show all of themselves, then let it come home
    const mv = act && MOVES[act], prevW = camW, k = 1 - Math.exp(-dt * 2.5);
    camW += ((mv && mv.wide || 1) - camW) * k;
    const dl = ((mv && mv.lift || 0) - camL) * k; camL += dl;
    camera.position.sub(controls.target).multiplyScalar(camW / prevW).add(controls.target);
    controls.target.y += dl; camera.position.y += dl;
  }
  controls.update();
  const shakeBy = V((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);
  camera.position.add(shakeBy);
  composer.render();
  camera.position.sub(shakeBy);
}
animate();
</script>
