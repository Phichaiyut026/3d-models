<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- scene ---------- */
const GREEN = 0x4dff4a, TAU = Math.PI * 2;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05090a);
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 1200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 10.8, 0);
controls.minDistance = 12; controls.maxDistance = 300;

scene.add(new THREE.HemisphereLight(0x9fb4b8, 0x10201a, 1.7));
const key = new THREE.DirectionalLight(0xe8f4ee, 2.5);
key.position.set(-16, 44, 36); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -32, right: 32, top: 34, bottom: -12, far: 130 });
key.shadow.bias = -.004; key.shadow.normalBias = .2;
scene.add(key);
const rimA = new THREE.DirectionalLight(GREEN, 3.6); rimA.position.set(11, 8, -11); scene.add(rimA);
const rimB = new THREE.DirectionalLight(0x38d8a0, 3); rimB.position.set(-11, 9, -9); scene.add(rimB);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.ShadowMaterial({ opacity: .5 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(170, 68, 0x12402a, 0x0a1d14);
grid.position.y = .002; scene.add(grid);

/* ---------- materials ---------- */
const ramp = new THREE.DataTexture(new Uint8Array([70, 140, 215, 255]), 4, 1, THREE.RedFormat);
ramp.magFilter = ramp.minFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = color => new THREE.MeshToonMaterial({ color, gradientMap: ramp });
const flat = color => new THREE.MeshBasicMaterial({ color, toneMapped: false });
const M = {
  plate: toon(0x23282e), mid: toon(0x353c44), lite: toon(0x5d6771), dark: toon(0x0c0f12), steel: toon(0x8b959e),
  green: flat(GREEN), deep: flat(0x13802a), pale: flat(0xc9ffbc), void: flat(0x030706),
};
const outlineMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: `attribute vec3 aOut; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + aOut * .055, 1.); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(.008, .014, .012, 1.); }`,
});
const outlineCache = new WeakMap();
function outlined(geo) { // averaged normals keep the outline closed at hard corners
  if (outlineCache.has(geo)) return outlineCache.get(geo);
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  if (!g.attributes.normal) g.computeVertexNormals();
  const p = g.attributes.position, n = g.attributes.normal, sum = new Map(), key = i => `${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;
  for (let i = 0; i < p.count; i++) { const k = key(i), v = sum.get(k) || new THREE.Vector3(); v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(k, v); }
  const out = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) { const v = sum.get(key(i)).clone().normalize(); out.set([v.x, v.y, v.z], i * 3); }
  g.setAttribute('aOut', new THREE.BufferAttribute(out, 3));
  outlineCache.set(geo, g);
  return g;
}

/* ---------- builders ---------- */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const fxOnly = []; // holograms, glows and outlines: left out of the GLB
function add(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], outline = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = mat.isMeshToonMaterial === true;
  parent.add(m);
  if (outline) { const o = new THREE.Mesh(outlined(geo), outlineMat); m.add(o); fxOnly.push(o); }
  return m;
}
function joint(parent, pos, name) { const g = new THREE.Group(); g.name = name; g.position.set(...pos); g.rotation.order = 'XZY'; parent.add(g); return g; }
function prism(points, depth, b = .06) {
  const s = new THREE.Shape(points.map(([x, y]) => new THREE.Vector2(x, y)));
  return new THREE.ExtrudeGeometry(s, { depth: Math.max(.001, depth - 2 * b), bevelEnabled: true, bevelSize: b, bevelThickness: b, bevelOffset: -b, bevelSegments: 1 }).translate(0, 0, -(depth - 2 * b) / 2);
}
function cb(w, h, d, c = .18) { // a chamfered block
  const x = w / 2, y = h / 2;
  return prism([[-x + c, -y], [x - c, -y], [x, -y + c], [x, y - c], [x - c, y], [-x + c, y], [-x, y - c], [-x, -y + c]], d, Math.min(.08, d * .2));
}
function taper(geo, top, bottom) { // scale x and z by height
  geo.computeBoundingBox();
  const p = geo.attributes.position, a = geo.boundingBox.min.y, h = geo.boundingBox.max.y - a;
  for (let i = 0; i < p.count; i++) { const s = bottom + (top - bottom) * (p.getY(i) - a) / h; p.setX(i, p.getX(i) * s); p.setZ(i, p.getZ(i) * s); }
  geo.computeVertexNormals();
  return geo;
}
function aim(m, a, b) { m.position.copy(a).add(b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(V(0, 1), b.clone().sub(a).normalize()); return m; }
function limb(parent, a, b, r1, r2, mat, sides = 14, outline = true) {
  const A = V(...a), B = V(...b);
  return aim(add(parent, new THREE.CylinderGeometry(r2, r1, A.distanceTo(B), sides), mat, [0, 0, 0], [0, 0, 0], outline), A, B);
}
function trace(parent, pts, w = .1) { // a glowing line that lies on a plate
  for (let i = 0; i < pts.length - 1; i++) {
    const A = V(...pts[i]), B = V(...pts[i + 1]);
    aim(add(parent, new THREE.BoxGeometry(w, A.distanceTo(B) + w, w), M.green, [0, 0, 0], [0, 0, 0], false), A, B);
  }
}
function canvasTex(draw, w = 512, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const glowTex = canvasTex((g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.42)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, w);
}, 128, 128);
function glow(parent, pos, size, color = GREEN, opacity = .7) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  s.position.set(...pos); s.scale.setScalar(size); parent.add(s); fxOnly.push(s);
  return s;
}
const additive = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
function arc(parent, r, tube, from, sweep, opacity = 1) { // a bright arc with a soft halo
  const g = new THREE.Group(); g.rotation.z = from; parent.add(g); fxOnly.push(g);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 90, sweep), additive(GREEN, opacity)));
  g.add(new THREE.Mesh(new THREE.TorusGeometry(r, tube * 3.4, 8, 90, sweep), additive(GREEN, .14 * opacity)));
  return g;
}
function keyholeGeo(s) {
  const c = new THREE.Shape(); c.absarc(0, .26 * s, .34 * s, 0, TAU);
  const t = new THREE.Shape([[-.16, .1], [.16, .1], [.34, -.62], [-.34, -.62]].map(([x, y]) => new THREE.Vector2(x * s, y * s)));
  return new THREE.ShapeGeometry([c, t], 24);
}

/* ---------- screens ---------- */
function bolt(g, x, y, len, angle, width) {
  g.lineWidth = width; g.beginPath(); g.moveTo(x, y);
  for (let i = 0; i < 7; i++) { angle += (Math.random() - .5) * 1.2; x += Math.cos(angle) * len; y += Math.sin(angle) * len; g.lineTo(x, y); }
  g.stroke();
}
const visorTex = canvasTex((g, w) => {
  const c = w / 2;
  g.fillStyle = '#031409'; g.fillRect(0, 0, w, w);
  const r = g.createRadialGradient(c, c, 10, c, c, c); r.addColorStop(0, '#1da133'); r.addColorStop(.6, '#0a4d1c'); r.addColorStop(1, '#03160a');
  g.fillStyle = r; g.fillRect(0, 0, w, w);
  g.strokeStyle = '#49e55088'; g.lineWidth = 3;
  for (const q of [.78, .9]) { g.setLineDash(q > .8 ? [8, 18] : [60, 16, 8, 16]); g.beginPath(); g.arc(c, c, c * q, 0, TAU); g.stroke(); }
  g.setLineDash([]);
  g.strokeStyle = '#a8ff9a'; g.shadowColor = '#4dff4a'; g.shadowBlur = 14;
  for (let i = 0; i < 16; i++) { const a = Math.random() * TAU; bolt(g, c + Math.cos(a) * 82, c - 18 + Math.sin(a) * 82, 19, a, 2.4); }
  const path = () => { g.beginPath(); g.arc(c, c - 44, 66, Math.PI * .68, Math.PI * .32 + 0, false); g.lineTo(c + 78, c + 128); g.lineTo(c - 78, c + 128); g.closePath(); };
  g.shadowBlur = 34; g.fillStyle = '#020a05'; path(); g.fill();
  g.strokeStyle = '#7dff6a'; g.lineWidth = 19; path(); g.stroke();
  g.strokeStyle = '#eaffe2'; g.lineWidth = 6; g.shadowBlur = 8; path(); g.stroke();
  g.shadowBlur = 0; g.fillStyle = '#8dff7e'; g.font = '13px Menlo,monospace';
  g.fillText('0x00', 70, 212); g.fillText('NULL', 66, 318); g.fillText('CVE-?', 392, 216); g.fillText('NOFIX', 386, 314);
}, 512, 512);

const crackPoints = Array.from({ length: 13 }, () => [.3 + Math.random() * .4, .2 + Math.random() * .6]);
const timerCanvas = document.createElement('canvas'); timerCanvas.width = 768; timerCanvas.height = 432;
const timerTex = new THREE.CanvasTexture(timerCanvas); timerTex.colorSpace = THREE.SRGBColorSpace; timerTex.anisotropy = 8;
let timerText = '';
function setTimer(text) {
  if (text === timerText) return;
  timerText = text;
  const g = timerCanvas.getContext('2d'), w = 768, h = 432, rand = (seed => () => (seed = seed * 16807 % 2147483647) / 2147483647)(9731);
  g.shadowBlur = 0; g.fillStyle = '#0a2e15'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffffff0a'; for (let y = 0; y < h; y += 6) g.fillRect(0, y, w, 2);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '700 124px Menlo,Courier New,monospace';
  g.shadowColor = '#4dff4a'; g.shadowBlur = 30; g.fillStyle = '#b3ff9c'; g.fillText(text, w / 2, h / 2);
  g.shadowBlur = 0; g.strokeStyle = '#d9f2d4'; g.lineCap = 'round';
  for (const [u, v] of [[.42, .32], [.6, .68], [.73, .25]]) for (let i = 0; i < 6; i++) {
    let x = u * w, y = v * h, a = rand() * TAU; g.lineWidth = 1.2 + rand() * 2; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 7; k++) { a += (rand() - .5) * .9; const l = 22 + rand() * 36; x += Math.cos(a) * l; y += Math.sin(a) * l; g.lineTo(x, y); }
    g.stroke();
  }
  timerTex.needsUpdate = true;
}
setTimer('00:00:00');

const codeTex = canvasTex((g, w, h) => {
  g.fillStyle = '#071a0e'; g.fillRect(0, 0, w, h);
  g.font = '700 22px Menlo,monospace'; g.fillStyle = '#58ff50';
  for (let x = 12; x < w; x += 25) for (let y = 20; y < h; y += 25) if (Math.random() > .3) g.fillText(Math.random() > .5 ? '1' : '0', x, y);
}, 256, 512);
codeTex.wrapT = THREE.RepeatWrapping;
const codeMat = new THREE.MeshBasicMaterial({ map: codeTex, toneMapped: false });

const capeTex = canvasTex((g, w, h) => {
  g.fillStyle = '#343c44'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#20262c'; for (let x = 18; x < w; x += 58) g.fillRect(x, 0, 16 + Math.random() * 14, h);
  g.font = '700 15px Menlo,monospace'; g.fillStyle = '#3ee64b';
  for (const x of [210, 228, 246, 266, 284, 302]) for (let y = 70; y < h * .8; y += 18) if (Math.random() > .34) g.fillText(Math.random() > .5 ? '1' : '0', x, y);
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000';
  for (let x = 0; x < w; x += 16) { const cut = 34 + Math.random() * Math.random() * 300; g.fillRect(x, h - cut, 16, cut); }
  for (let i = 0; i < 210; i++) { const v = Math.pow(Math.random(), .55), side = Math.random() > .5, b = 8 + Math.random() * 20; g.fillRect(side ? w - Math.random() * 110 * v : Math.random() * 110 * v, v * h, b, b); }
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#54ff4a';
  for (let i = 0; i < 90; i++) { const v = .45 + Math.random() * .5; g.fillRect((Math.random() > .5 ? w - Math.random() * 130 : Math.random() * 130), v * h, 7 + Math.random() * 15, 7 + Math.random() * 15); }
}, 512, 640);

/* ---------- padlocks ---------- */
function padlock(parent, s, pos, rot = [0, 0, 0]) {
  const g = new THREE.Group(); g.position.set(...pos); g.rotation.set(...rot); g.scale.setScalar(s); parent.add(g);
  const pts = [[-.72, -1], [.72, -1], [1.1, -.6], [1.1, .62], [.72, 1], [-.72, 1], [-1.1, .62], [-1.1, -.6]];
  add(g, prism(pts, 1.05, .07), M.mid);
  const face = pts.map(([x, y]) => [x * .86, y * .86]);
  add(g, prism(face, .1, .02), M.plate, [0, 0, .54], [0, 0, 0], false);
  add(g, prism(face, .1, .02), M.plate, [0, 0, -.54], [0, 0, 0], false);
  add(g, new THREE.TorusGeometry(.66, .17, 10, 22, Math.PI), M.lite, [0, 1.42, 0]);
  for (const x of [-.66, .66]) { add(g, new THREE.CylinderGeometry(.17, .17, .55, 10), M.lite, [x, 1.17, 0]); add(g, new THREE.CylinderGeometry(.27, .27, .14, 10), M.dark, [x, 1.03, 0]); }
  const hole = add(g, keyholeGeo(.74), M.green, [0, -.04, .6], [0, 0, 0], false);
  g.userData.hole = hole;
  glow(g, [0, 0, .85], 2.1, GREEN, .34);
  for (const [x, y] of [[-.72, .68], [.72, .68], [-.72, -.68], [.72, -.68]]) add(g, new THREE.CylinderGeometry(.07, .07, .05, 6), M.lite, [x, y, .6], [Math.PI / 2, 0, 0], false);
  return g;
}

/* ---------- body ---------- */
const root = new THREE.Group(); root.name = 'ZeroDay'; scene.add(root);
const hips = joint(root, [0, 7.8, 0], 'hips');
const spine = joint(hips, [0, 1.1, 0], 'spine');
const chest = joint(spine, [0, 1.9, 0], 'chest');
const head = joint(chest, [0, 4.75, .15], 'head');

// pelvis
add(hips, cb(6.1, 1.35, 3.9, .3), M.plate, [0, -.05, 0]);
add(hips, prism([[-1.05, .72], [1.05, .72], [1.3, -.1], [0, -1.05], [-1.3, -.1]], .5), M.mid, [0, -.05, 2.05]);
add(hips, new THREE.CircleGeometry(.36, 6), M.green, [0, -.1, 2.36], [0, 0, 0], false);
glow(hips, [0, -.1, 2.6], 2.1, GREEN, .4);
add(hips, cb(2.5, 4.3, .22, .2), M.dark, [0, -2.65, 1.85], [.04, 0, 0]);
const codeA = add(hips, new THREE.PlaneGeometry(2.1, 3.8), codeMat, [0, -2.65, 1.98], [.04, 0, 0], false);
for (const s of [-1, 1]) {
  add(hips, prism([[-1.45, 1], [1.45, 1], [1.7, -1.3], [.4, -2.4], [-1.25, -1.75]], .42), M.mid, [s * 3.05, -1.45, .3], [0, s * 1.15, s * .1]);
  trace(hips, [[s * 3.3, -.8, 2.1], [s * 3.65, -1.5, 1.8], [s * 3.7, -2.5, 1.65]], .09);
}

// abdomen
add(spine, cb(5.1, 2.9, 3.5, .35), M.dark, [0, .8, 0]);
for (const [y, w] of [[-.1, 3.9], [.86, 4.3], [1.82, 4.7]]) for (const s of [-1, 1]) {
  add(spine, prism([[0, -.4], [w / 2, -.4], [w / 2 + .1, .3], [.25, .4], [0, .2]].map(([x, yy]) => [s * x, yy]), .5), M.mid, [s * .06, y, 1.75]);
}
trace(spine, [[-1.9, 2.2, 2.07], [-.6, 1.05, 2.07], [-.12, -.5, 2.07]], .12);
trace(spine, [[1.9, 2.2, 2.07], [.6, 1.05, 2.07], [.12, -.5, 2.07]], .12);

// chest box: the broken countdown
add(chest, taper(cb(7, 5.1, 4.5, .55), 1, .84), M.plate, [0, 2.45, 0]);
add(chest, cb(5.7, 3.8, .4, .2), M.lite, [0, 2.75, 2.2]);
add(chest, cb(5.3, 3.4, .2, .14), M.dark, [0, 2.75, 2.42], [0, 0, 0], false);
const screen = add(chest, new THREE.PlaneGeometry(5, 3.05), new THREE.MeshBasicMaterial({ map: timerTex, toneMapped: false }), [0, 2.75, 2.54], [0, 0, 0], false);
glow(chest, [0, 2.75, 3.1], 9.5, GREEN, .22);
for (const s of [-1, 1]) {
  add(chest, prism([[-.9, 1.1], [.9, .8], [.9, -1.3], [-.5, -1.3]], .42), M.mid, [s * 3.3, 1.1, 1.55], [0, s * .8, s * .08]);
  trace(chest, [[s * 2.75, .55, 2.2], [s * 1.7, .25, 2.34]], .11);
  add(chest, cb(1.5, 2.8, 3.2), M.mid, [s * 3.75, 3.1, -.1]);
}
add(chest, cb(5.4, 4.6, 1.2, .4), M.mid, [0, 2.6, -2.45]);
add(chest, new THREE.CylinderGeometry(2.1, 2.5, 1.5, 12), M.dark, [0, 5.05, .05]);
for (const s of [-1, 1]) limb(chest, [s * 1.2, 4.9, -2], [s * 2.6, 6, -3.3], .24, .18, M.dark, 8);

  panic: { dur: 3, keys: [[0, {}], [.3, { d: .15, lean: -.22, tilt: -.28, rx: -.4, rz: -1.25, re: -.3, lx: -.4, ly: 1.2, lz: 1.75, le: -.5, blade: [.95, .3, .1], y: 1.1 }], [.39, { d: .15, lean: -.24, tilt: -.3, rx: -.4, rz: -1.3, re: -.3, lx: -.4, ly: 1.2, lz: 1.8, le: -.5, blade: [.95, .34, .1], y: 2.2 }], [.46, { d: 2.2, lean: .52, rx: -1.2, rz: -.15, re: -.9, lx: -1.2, ly: .2, lz: .2, le: -.9, blade: [.1, -.33, .94] }], [.84, { d: 2.2, lean: .52, rx: -1.2, rz: -.15, re: -.9, lx: -1.2, ly: .2, lz: .2, le: -.9, blade: [.1, -.33, .94] }], [1, {}]], fx: [[.44, 'panicHit']] },
  root: { dur: 2.5, keys: [[0, {}], [.3, { d: .9, lean: .25, rx: -.9, rz: -.1, re: -1.5, lx: -.9, ly: .8, lz: .3, le: -1.7, blade: [.02, .96, .25] }], [.5, { d: .25, lean: -.16, tilt: -.28, rx: -2.8, rz: -.2, re: -.15, lx: -.3, ly: 1.2, lz: 1.5, le: -.35, blade: [.02, 1, .1], y: 3.2 }], [.78, { d: .25, lean: -.16, tilt: -.28, rx: -2.8, rz: -.2, re: -.15, lx: -.3, ly: 1.2, lz: 1.5, le: -.35, blade: [.02, 1, .1], y: 3.7 }], [1, {}]], fx: [[.5, 'rootOn']] },
});
Object.assign(FX, {
  blink(x, z) { burstAt(x, 10, z, 95, 19); flash = Math.max(flash, .16); camShake = Math.max(camShake, .6); },
  backstab() { flash = .24; camShake = 1.2; shock(9, 9, 12, 13, .5, 1, false); shock(9, 9, 12, 21, .75, .6, false); burstAt(9, 9, 12, 70, 24); },
  lockLand() { flash = .24; camShake = 1.5; cracks.material.opacity = .9; shock(0, .1, RANSOM_Z, 19, .6); burstAt(0, 2, RANSOM_Z, 45, 15); },
  lockBreak() { flash = .55; camShake = 2; shock(0, .1, RANSOM_Z, 34, .9); shock(0, 7, RANSOM_Z, 22, .65, .8, false); burstAt(0, 6, RANSOM_Z, 190, 30); giantLock.visible = false; cage.visible = false; },
  ddosEnd() { flash = .34; camShake = 1.5; shock(13, .1, 19, 30, .8); burstAt(13, 5, 19, 150, 28); },
  panicHit() { flash = .75; camShake = 2.4; panicAge = 0; pillars.visible = true; cracks.material.opacity = 1; boltLevel = 1; shock(0, .1, 0, 58, 1.2); },
  rootOn() { rootT = 10; pillarAge = 0; rootPillar.visible = true; flash = .7; camShake = 1.5; boltLevel = 1; shock(0, .1, 0, 36, .9); shock(0, 16, 0, 26, .7, .8, false); burstAt(0, 12, 0, 120, 22); },
});
function resetSkills() {
  beam.visible = false; root.visible = true; root.position.x = root.position.z = 0; root.rotation.y = 0;
  portalHome.visible = portalFar.visible = giantLock.visible = cage.visible = false;
  panicEl.style.display = 'none'; scene.background.setHex(0x05090a); pillars.visible = false; panicAge = 9;
}
function updateSkills(dt, t, q) {
  updatePackets(dt);
  // backdoor
  if (act === 'backdoor') {
    const home = Math.max(env(q, .02, .18, .28, .4), env(q, .74, .84, .93, 1)), far = env(q, .16, .3, .76, .88);
    portalHome.visible = home > .01; portalHome.scale.set(home, home * (1 + Math.sin(t * 40) * .02), 1);
    portalFar.visible = far > .01; portalFar.scale.set(far, far * (1 + Math.sin(t * 37) * .02), 1);
    const away = q >= .27 && q < .84;
    root.position.x = away ? -14 : 0; root.position.z = away ? 12 : 0; root.rotation.y = away ? Math.PI / 2 : 0;
    root.visible = !((q > .22 && q < .32) || (q > .78 && q < .89)) && !(Math.random() > .75 && (q < .26 || (q > .32 && q < .37)));
  }
  // ransomware
  if (act === 'ransom') {
    const drop = clamp01((q - .08) / .35);
    if (q > .05 && q < .81) {
      giantLock.visible = cage.visible = true;
      const y = 40 + (3.75 - 40) * drop * drop * drop, quake = q > .5 ? (q - .5) * .9 : 0;
      giantLock.position.set((Math.random() - .5) * quake, y, RANSOM_Z + (Math.random() - .5) * quake);
      giantLock.rotation.y = (1 - drop) * 5 + Math.sin(t * 33) * quake * .18;
      cage.material.opacity = env(q, .3, .46, .76, .81) * .9; cage.rotation.y += dt * 3.2;
    }
  }
  // ddos
  ddosFlow = act === 'ddos' && q > .14 && q < .83 ? ddosFlow + dt * 240 : 0;
  if (act === 'ddos') {
    armL.hand.getWorldPosition(handWorld); handWorld.y -= .8;
    while (ddosFlow >= 1) { ddosFlow--; streamPacket(handWorld, ddosTarget.set(13 + (Math.random() - .5) * 7, 1 + Math.random() * 9, 19 + (Math.random() - .5) * 6)); }
    ddosPulse -= dt;
    if (q > .22 && q < .83 && ddosPulse <= 0) { ddosPulse = .13; shock(13 + (Math.random() - .5) * 4, .1, 19 + (Math.random() - .5) * 4, 7 + Math.random() * 11, .36, .75); camShake = Math.max(camShake, .42); }
  }
  // kernel panic
  if (panicAge < 2) {
    panicAge += dt;
    pillarData.forEach((o, i) => {
      const k = clamp01((panicAge - o.r / 36) / .72), h = o.h * Math.sin(k * Math.PI);
      _p.set(o.x, Math.max(.001, h / 2), o.z); _q.identity(); _s.set(o.w, Math.max(.001, h), o.w); _m.compose(_p, _q, _s); pillars.setMatrixAt(i, _m);
    });
    pillars.instanceMatrix.needsUpdate = true;
    if (panicAge >= 2) pillars.visible = false;
  }
  if (act === 'panic' && q > .44 && q < .85) {
    panicEl.style.display = 'flex';
    panicClock -= dt;
    if (panicClock <= 0) {
      panicClock = .055;
      panicEl.firstElementChild.style.transform = `translate(${(Math.random() - .5) * 26}px,${(Math.random() - .5) * 12}px)`;
      panicBars.forEach(b => { b.style.top = Math.random() * 100 + '%'; b.style.height = 2 + Math.random() * 40 + 'px'; b.style.background = Math.random() > .55 ? '#4dff4a70' : '#000000b0'; b.style.transform = `translateX(${(Math.random() - .5) * 90}px)`; });
      scene.background.setHex(Math.random() > .68 ? 0x0c421a : 0x05090a);
    }
  } else if (act === 'panic') { panicEl.style.display = 'none'; scene.background.setHex(0x05090a); }
  // root
  rootT = Math.max(0, rootT - dt);
  rootW += ((rootT > 0 ? 1 : 0) - rootW) * (1 - Math.exp(-dt * 5));
  M.green.color.lerpColors(greenA, greenB, rootW);
  rimA.intensity = 3.6 + rootW * 4.5;
  halo.scale.setScalar(1 + rootW * .14);
  keyCrown.visible = rootW > .02; keyCrown.scale.setScalar(Math.max(.01, rootW)); keyCrown.rotation.y = t * 1.5;
  if (pillarAge < 1.3) { pillarAge += dt; const k = clamp01(pillarAge / 1.3); rootPillar.material.opacity = (1 - k) * .34; rootPillar.scale.set(.3 + k * 1.7, 1, .3 + k * 1.7); if (k >= 1) rootPillar.visible = false; }
}

/* ---------- controls ---------- */
const VIEWS = { front: [0, 12.5, 72], side: [72, 13, 0], back: [0, 15, -72], iso: [45, 24, 56] };
let goal = null;
const scaled = v => { const portrait = Math.max(1, 1.28 / camera.aspect); return V(v[0] * portrait, v[1], v[2] * portrait); };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { goal = scaled(VIEWS[b.dataset.view]); });
controls.addEventListener('start', () => { goal = null; });
const idleBtn = document.getElementById('idle'), fightBtn = document.getElementById('fight');
function showStance() { idleBtn.classList.toggle('on', !fightGoal); fightBtn.classList.toggle('on', !!fightGoal); }
idleBtn.onclick = () => { fightGoal = 0; showStance(); };
fightBtn.onclick = () => { fightGoal = 1; showStance(); };
const showAct = () => document.querySelectorAll('[data-act]').forEach(b => b.classList.toggle('on', b.dataset.act === act));
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { resetSkills(); act = b.dataset.act; actT = 0; showAct(); });
document.getElementById('download').onclick = () => {
  const hidden = fxOnly.filter(o => o.visible); hidden.forEach(o => o.visible = false);
  new GLTFExporter().parse(root, buf => {
    hidden.forEach(o => o.visible = true);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })); a.download = 'zero_day.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, err => { hidden.forEach(o => o.visible = true); console.error(err); }, { binary: true });
};
function applySize() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', applySize); applySize();
camera.position.copy(scaled(VIEWS.front));

/* ---------- loop ---------- */
const clock = new THREE.Clock(); let boltClock = 0, glitchClock = 0;
const flashEl = document.getElementById('flash');
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  fightW += (fightGoal - fightW) * (1 - Math.exp(-dt * 7));
  const move = act && MOVES[act], q0 = move ? actT / move.dur : 0;
  let due = [];
  if (move) {
    actT += dt * (rootT > 0 ? 1.35 : 1); const q1 = Math.min(1, actT / move.dur);
    due = move.fx.filter(([at]) => q0 < at && q1 >= at);
    if (q1 >= 1) { act = null; actT = 0; resetSkills(); showAct(); }
  }
  const q = pose(t);
  due.forEach(([, name, ...args]) => FX[name](...args));
  updateCape(t);
  updateLocks(t, q);
  updateFx(dt, t, q);
  updateSkills(dt, t, q);
  boltClock += dt;
  if (boltClock > .055) { boltClock = 0; regrowBolts(); edgeFlare.scale.setScalar(4 + Math.random() * 3.5); }
  codeTex.offset.y = (t * .35) % 1; codeA.material.map = codeTex;
  // the countdown only ever arrives at zero
  if (act === 'countdown') { const left = Math.max(0, Math.ceil((1 - q / .82) * 9)); setTimer(`00:00:0${left}`); }
  else if (act === 'ransom') setTimer('LOCKED!!');
  else if (act === 'panic') setTimer(Math.random() > .5 ? 'PANIC!!!' : '0xDEAD00');
  else if (rootT > 0) setTimer(`R00T:${String(Math.ceil(rootT)).padStart(2, '0')}`);
  else {
    glitchClock -= dt;
    if (glitchClock < -.12) { glitchClock = 1.6 + Math.random() * 3.5; setTimer('00:00:00'); }
    else if (glitchClock < 0) setTimer(Math.random() > .5 ? '0x:00:FF' : 'NU:LL:00');
  }
  spin += ((act === 'countdown' ? 9 * (q < .82 ? 1 : 0) + 1 : 1) + rootW * 2 - spin) * (1 - Math.exp(-dt * 4));
  orbitClock += dt * spin;
  orbitArcs.forEach((a, i) => a.rotation.z = a.userData.from + Math.sin(orbitClock * (.5 + i * .13)) * .22);
  haloArcs.forEach((a, i) => a.rotation.z += dt * (i < 3 ? .07 : -.14) * spin);
  halo.position.y = 18.2 - hips.position.y * 0 + Math.sin(t * .9) * .15;
  visorGlow.material.opacity = .42 + Math.sin(t * 8) * .06 + (Math.random() > .95 ? .24 : 0);
  backGlow.material.opacity = .2 + Math.sin(t * .8) * .04;
  holos.forEach((h, i) => { h.position.y += Math.sin(t * .7 + i) * .002; h.material.opacity = Math.random() > .985 ? .22 : .68; });
  flashEl.style.opacity = Math.min(.9, flash);
  if (goal) { camera.position.lerp(goal, 1 - Math.exp(-dt * 7)); if (camera.position.distanceTo(goal) < .02) goal = null; }
  controls.update();
  const shakeBy = V((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);
  camera.position.add(shakeBy);
  renderer.render(scene, camera);
  camera.position.sub(shakeBy);
}
