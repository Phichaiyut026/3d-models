<style>

</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<body>
<div id="title">CLAWD<small>ลากเพื่อหมุน · เลื่อนเพื่อซูม · คลิกขวาลากเพื่อเลื่อน<br>กด CHARGE ค้างไว้เพื่อชาร์จ ปล่อยเพื่อฟัน</small></div>
<div id="meter" hidden><i></i></div>
<div id="bar">
  <button data-view="front">FRONT</button>
  <button data-view="side">SIDE</button>
  <button data-view="back">BACK</button>
  <button data-view="iso">ISO</button>
  <span class="gap"></span>
  <button data-mode="idle" class="on">IDLE</button>
  <button data-mode="walk">WALK</button>

  <button data-act="combo">COMBO</button>
  <span class="gap"></span>
  <button data-act="spin">SPIN</button>
  <button data-act="slam">SLAM</button>
  <button data-act="wave">WAVE</button>
  <button id="charge">CHARGE</button>
  <span class="gap"></span>
  <button data-act="snap">SNAP</button>
  <button data-act="roar">ROAR</button>
  <span class="gap"></span>

  <button id="pixel" class="on">PIXEL</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- scene ---------- */
const PIXEL_SIZE = 2;
const scene = new THREE.Scene();
scene.background = (() => { // a short canvas, so the dusk sky falls in visible pixel bands
  const c = document.createElement('canvas'); c.width = 2; c.height = 56;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 56);
  g.addColorStop(0, '#0d0b1e'); g.addColorStop(.5, '#2b1436'); g.addColorStop(.74, '#7a2f2a'); g.addColorStop(.84, '#3c1a26'); g.addColorStop(1, '#170d18');
  x.fillStyle = g; x.fillRect(0, 0, 2, 56);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 3.05, 0);
controls.minDistance = 5; controls.maxDistance = 50;

scene.add(new THREE.HemisphereLight(0x7f7fc8, 0x5a2016, 1.35));
const key = new THREE.DirectionalLight(0xffd7ad, 2.7);
key.position.set(-4, 12, 9); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 10, bottom: -6, far: 40 });
key.shadow.bias = -.0015; key.shadow.normalBias = .03;
scene.add(key);
const rimLight = new THREE.DirectionalLight(0x45dcff, 3.2); // cool rim against the warm body
rimLight.position.set(6, 7, -10); scene.add(rimLight);
const emberLight = new THREE.PointLight(0xff5a1c, 10, 16, 1.4);
emberLight.position.set(0, 1.1, 2.6); scene.add(emberLight);

/* ---------- pixel-art surface ---------- */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TEX = 256, TILE = 8; // one tile covers 8 world units, so 32 texels per unit

function noiseTexture() {
  const c = document.createElement('canvas'); c.width = c.height = TEX;
  const x = c.getContext('2d');
  x.fillStyle = '#eee'; x.fillRect(0, 0, TEX, TEX);
  const paint = (v, px, py, w, h) => { x.fillStyle = `rgb(${v},${v},${v})`; x.fillRect(px, py, w, h); };
  for (let i = 0; i < 900; i++) paint(205 + rnd() * 50 | 0, rnd() * TEX | 0, rnd() * TEX | 0, 2 + rnd() * 7 | 0, 1 + rnd() * 5 | 0);
  for (let i = 0; i < 90; i++) paint(95 + rnd() * 45 | 0, rnd() * TEX | 0, rnd() * TEX | 0, 2 + rnd() * 5 | 0, 1 + rnd() * 2 | 0); // scuffs
  for (let i = 0; i < 16; i++) { // chips with a lit lower edge
    const px = rnd() * TEX | 0, py = rnd() * TEX | 0, w = 3 + rnd() * 5 | 0;
    paint(70, px, py, w, 2); paint(255, px, py + 2, w, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const noise = noiseTexture();
const ramp = new THREE.DataTexture(new Uint8Array([78, 150, 225, 255]), 4, 1, THREE.RedFormat);
ramp.magFilter = ramp.minFilter = THREE.NearestFilter; ramp.needsUpdate = true;

const toon = color => new THREE.MeshToonMaterial({ color, map: noise, gradientMap: ramp });
const flat = color => new THREE.MeshBasicMaterial({ color, toneMapped: false });
const M = {
  orange: toon(0xe8430c), bright: toon(0xff6318), hot: toon(0xffa23a), dark: toon(0x9c2a12),
  steel: toon(0x262a3a), steelLite: toon(0x454e68), gold: toon(0xf0b13a), ember: flat(0xff7a22),
  black: flat(0x130d0b), eyeHalo: flat(0xffa425), eye: flat(0xfffbe6),
  badge: flat(0xffb340), letter: flat(0xfff0c2),
};

/* ---------- ground ---------- */
const floorTile = (() => {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#3b2a3a'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 26; i++) { x.fillStyle = rnd() < .5 ? '#322332' : '#463244'; x.fillRect(rnd() * S | 0, rnd() * S | 0, 2 + rnd() * 8 | 0, 2 + rnd() * 4 | 0); }
  x.fillStyle = '#8a4a2c'; x.fillRect(0, 0, S, 2); x.fillRect(0, 0, 2, S);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(56, 56);
  t.magFilter = THREE.NearestFilter; t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const floorFade = (() => { // separate from the tile, so the floor can scroll under a fixed vignette
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, '#fff'); g.addColorStop(.42, '#fff'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(56, 56), new THREE.MeshToonMaterial({ map: floorTile, alphaMap: floorFade, gradientMap: ramp, transparent: true, depthWrite: false }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const hullMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { t: { value: .036 } },
  vertexShader: `attribute vec3 smoothNormal; uniform float t;
    void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + smoothNormal * t, 1.); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(.05,.03,.06,1.); }`,
});

function prepare(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  const p = g.attributes.position, n = g.attributes.normal, count = p.count;
  // world-scale UVs so every surface shares one texel size
  const uv = new Float32Array(count * 2), ou = rnd(), ov = rnd(), k = 1 / TILE;
  for (let i = 0; i < count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ax >= ay && ax >= az) { u = p.getZ(i); v = p.getY(i); }
    else if (ay >= az) { u = p.getX(i); v = p.getZ(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv[i * 2] = u * k + ou; uv[i * 2 + 1] = v * k + ov;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  // averaged normals keep the outline closed at hard corners
  const sum = new Map(), keys = [];
  for (let i = 0; i < count; i++) {
    const key = `${Math.round(p.getX(i) * 1e3)},${Math.round(p.getY(i) * 1e3)},${Math.round(p.getZ(i) * 1e3)}`;
    keys.push(key);
    const v = sum.get(key) || new THREE.Vector3();
    v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(key, v);
  }
  const smooth = new Float32Array(count * 3);
  keys.forEach((key, i) => { const v = sum.get(key).clone().normalize(); smooth.set([v.x, v.y, v.z], i * 3); });
  g.setAttribute('smoothNormal', new THREE.BufferAttribute(smooth, 3));
  return g;
}

function add(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], outline = true) {
  const g = prepare(geo);
  const m = new THREE.Mesh(g, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = !mat.isMeshBasicMaterial;
  if (outline) m.add(new THREE.Mesh(g, hullMat));
  parent.add(m);
  return m;
}
const box = (parent, pos, size, mat, rot) => add(parent, new THREE.BoxGeometry(...size), mat, pos, rot);

function seg(parent, a, b, r1, r2, mat, sides = 6) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const m = add(parent, new THREE.CylinderGeometry(r2, r1, d.length(), sides, 1), mat, A.clone().add(B).multiplyScalar(.5).toArray());
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}
const spike = (parent, base, tip, r = .13, mat = M.bright) => seg(parent, base, tip, r, .008, mat, 5);

function shapeGeo(points, depth, bevel = 0, holes = []) {
  const s = new THREE.Shape(points.map(p => new THREE.Vector2(...p)));
  holes.forEach(h => s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(...p)))));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 1, curveSegments: 4 });
  g.translate(0, 0, -depth / 2);
  return g;
}

/* ---------- body ---------- */
const root = new THREE.Group(); scene.add(root);
const upper = new THREE.Group(); root.add(upper);

// a faceted carapace over a glowing seam, then an abdomen of narrowing plates
add(upper, shapeGeo([[-1.12, -.57], [1.12, -.57], [1.24, .02], [1, .57], [-1, .57], [-1.24, .02]], 2.1), M.orange, [0, 3.35, 0]);
add(upper, shapeGeo([[-.95, -.39], [.95, -.39], [1.12, .39], [-1.12, .39]], 1.98), M.orange, [0, 2.4, 0]);
box(upper, [0, 2.78, 0], [2.28, .05, 2.03], M.ember);
for (let i = 0; i < 5; i++) box(upper, [0, 2 - i * .21, 0], [2.02 - i * .2, .22, 1.76 - i * .14], i % 2 ? M.dark : M.steel);
for (const s of [-1, 1]) box(upper, [s * .72, 2, .89], [.3, .12, .06], M.gold);

// feelers that lean forward, clear of the sword's arc
const antennae = [];
for (const s of [-1, 1]) {
  const a = new THREE.Group(); a.position.set(s * .42, 3.9, .82); upper.add(a);
  const pts = [[0, 0, 0], [s * .25, .35, .3], [s * .55, .55, .7], [s * .95, .5, 1.05]], radii = [.08, .06, .04, .012];
  for (let i = 0; i < 3; i++) seg(a, pts[i], pts[i + 1], radii[i], radii[i + 1], i === 2 ? M.hot : M.dark, 5);
  antennae.push({ group: a, s });
  spike(upper, [s * .72, 3.02, 1], [s * .46, 2.86, 1.34], .09, M.gold); // mandible
}

// head spikes: two rows of three, plus one centred
for (const [x, z, h] of [[-.76, .62, .42], [0, .62, .34], [.76, .62, .46], [-.76, -.55, .4], [0, -.55, .46], [.76, -.55, .36], [.3, .03, .32]])
  spike(upper, [x, 3.9, z], [x, 3.92 + h, z], .15);

// face
for (const s of [-1, 1]) {
  const eye = k => [[-.21 * k, .03 * k], [.2 * k, .17 * k], [.23 * k, -.03 * k], [.1 * k, -.15 * k], [-.11 * k, -.15 * k]].map(([o, y]) => [s * o, y]);
  add(upper, shapeGeo(eye(1.32), .02), M.eyeHalo, [s * .52, 3.47, 1.055], [0, 0, 0], false);
  add(upper, shapeGeo(eye(.8), .02), M.eye, [s * .52, 3.47, 1.075], [0, 0, 0], false);
  box(upper, [s * .53, 3.66, 1.1], [.88, .17, .17], M.steel, [0, 0, s * .58]);
}
box(upper, [0, 3.2, 1.06], [.34, .055, .03], M.black);
for (const s of [-1, 1]) box(upper, [s * .24, 3.155, 1.06], [.2, .055, .03], M.black, [0, 0, s * .62]);

// chest badge
box(upper, [0, 2.38, 1.01], [1.02, .78, .06], M.dark);
const rrect = (w, h, c) => [[-w + c, -h], [w - c, -h], [w, -h + c], [w, h - c], [w - c, h], [-w + c, h], [-w, h - c], [-w, -h + c]];
add(upper, shapeGeo(rrect(.47, .38, .1), .04, 0, [rrect(.39, .3, .07).reverse()]), M.badge, [0, 2.38, 1.05], [0, 0, 0], false);
add(upper, shapeGeo([[-.31, -.2], [-.19, .2], [-.04, .2], [.08, -.2], [-.03, -.2], [-.06, -.11], [-.17, -.11], [-.2, -.2]], .03, 0, [[[-.145, -.03], [-.085, -.03], [-.115, .08]]]), M.letter, [0, 2.38, 1.055], [0, 0, 0], false);
add(upper, shapeGeo([[.14, -.2], [.25, -.2], [.25, .2], [.14, .2]], .03), M.letter, [0, 2.38, 1.055], [0, 0, 0], false);

// back plates and studs
box(upper, [0, 3.28, -1.08], [1.9, .86, .08], M.bright);
box(upper, [0, 2.48, -1.02], [1.5, .68, .1], M.bright);
for (const [x, y, h] of [[-.95, 3.72, .24], [.95, 3.72, .24], [-.47, 3.42, .3], [.47, 3.42, .3], [-.47, 2.86, .26], [.47, 2.86, .26], [-.47, 2.38, .3], [.47, 2.38, .3]]) {
  const z = y > 2.8 ? -1.12 : -1.07;
  seg(upper, [x, y, z + .02], [x, y, z - .06], .16, .15, M.hot, 6);
  spike(upper, [x, y, z - .06], [x, y, z - .06 - h], .13, M.hot);
}

// shoulders
for (const s of [-1, 1]) {
  seg(upper, [s * 1.2, 2.88, .05], [s * 2.1, 2.88, .05], .55, .6, M.steel, 8);
  seg(upper, [s * 1.6, 2.88, .05], [s * 1.7, 2.88, .05], .63, .64, M.gold, 8);
  spike(upper, [s * 1.55, 3.34, .05], [s * 1.5, 3.9, .05], .17);
  spike(upper, [s * 1.92, 3.3, .05], [s * 2.02, 3.72, .05], .14);
  box(upper, [s * 1.72, 2.94, .62], [.12, .08, .05], M.ember);
  box(upper, [s * 2.14, 2.76, .2], [.03, .14, .1], M.ember);
}

/* ---------- legs ---------- */
const rel = (p, o) => p.map((v, i) => v - o[i]);
const legs = [];
function leg(s, hip, knee, ankle, foot, big, phase) {
  const h = [s * hip[0], hip[1], hip[2]], k = [s * knee[0], knee[1], knee[2]];
  const a = [s * ankle[0], ankle[1], ankle[2]], f = [s * foot[0], foot[1], foot[2]];
  // yaw about the vertical keeps the foot on the ground; lift raises it for the swing
  const yaw = new THREE.Group(); yaw.position.set(...h); root.add(yaw);
  const lift = new THREE.Group(); yaw.add(lift);
  const kneeJoint = new THREE.Group(); kneeJoint.position.set(...rel(k, h)); lift.add(kneeJoint);
  const H = p => rel(p, h), K = p => rel(p, k);

  seg(lift, [0, 0, 0], H(k), big ? .25 : .22, big ? .3 : .27, M.dark);
  add(kneeJoint, new THREE.IcosahedronGeometry(big ? .34 : .3, 0), M.steel);
  seg(kneeJoint, [0, 0, 0], K(a), big ? .3 : .27, big ? .23 : .2, M.orange);
  const toe = [0, 1, 2].map(i => a[i] + (f[i] - a[i]) * .72);
  seg(kneeJoint, K(a), K(toe), big ? .23 : .2, .09, M.bright);
  seg(kneeJoint, K(toe), K(f), .09, .012, M.steelLite);

  const mid = [0, 1, 2].map(i => (h[i] + k[i]) / 2);
  spike(lift, H([mid[0], mid[1] + .2, mid[2]]), H([mid[0] + s * .03, mid[1] + .55, mid[2]]), .1);
  spike(kneeJoint, [0, .2, 0], [s * .12, .6, 0], .11);
  spike(kneeJoint, K([(k[0] + a[0]) / 2 + s * .22, (k[1] + a[1]) / 2 + .02, (k[2] + a[2]) / 2]), K([(k[0] + a[0]) / 2 + s * .52, (k[1] + a[1]) / 2 + .1, (k[2] + a[2]) / 2]), .08);

  const dir = new THREE.Vector3(f[0] - h[0], 0, f[2] - h[2]), reach = dir.length();
  const axis = new THREE.Vector3().crossVectors(dir.normalize(), new THREE.Vector3(0, 1, 0));
  legs.push({ yaw, lift, knee: kneeJoint, axis, reach, s, phase });
}
for (const s of [-1, 1]) { // tripod gait: diagonal sets of three step together
  const p = odd => (odd === (s > 0) ? 0 : Math.PI);
  leg(s, [.75, 1.55, .72], [1.3, 1.82, 1.25], [1.42, 1.0, 1.62], [1.44, .02, 1.82], true, p(true));
  leg(s, [.85, 1.55, 0], [1.95, 1.98, .05], [2.42, 1.08, .08], [2.55, .02, .1], true, p(false));
  leg(s, [.75, 1.55, -.72], [1.55, 1.86, -1.3], [1.86, 1.0, -1.72], [1.95, .02, -1.92], false, p(true));
}

/* ---------- blade aura ---------- */
const auraTime = { value: 0 }, auraPower = { value: 1 }, auraSize = { value: 1 };
const AURA_SPARKS = 60, auraPos = new Float32Array(AURA_SPARKS * 3), auraRise = new Float32Array(AURA_SPARKS);
let auraGeo, auraLight;
const auraFlame = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { time: auraTime, power: auraPower, size: auraSize },
  // a quad that spins about the blade to face the camera, nudged forward so it clears the banner
  vertexShader: `uniform float size; varying vec2 vP;
    void main(){
      vec4 c = modelViewMatrix * vec4(0., 0., 0., 1.);
      vec3 axis = normalize((modelViewMatrix * vec4(0., 1., 0., 0.)).xyz);
      vec3 view = normalize(-c.xyz);
      vec3 side = normalize(cross(axis, view));
      vP = position.xy;
      gl_Position = projectionMatrix * vec4(c.xyz + (side * position.x + axis * position.y) * size + view * .4, 1.);
    }`,
  // distance to a wavering capsule gives a soft, rounded flame with no polygon edges
  fragmentShader: `uniform float time, power; varying vec2 vP;
    void main(){
      float up = smoothstep(-1.5, 2.2, vP.y);
      float sway = (sin(vP.y * 2.1 - time * 3.4) + .5 * sin(vP.y * 4.7 - time * 5.9 + 1.3)) * .1 * (.25 + up);
      float top = 1.35 + .28 * sin(time * 4.1) + .16 * sin(time * 7.3 + 1.);
      float d = length(vec2(vP.x + sway, vP.y - clamp(vP.y, -1.3, top)));
      float r = mix(1.25, .55, up) * (1. + .14 * sin(vP.y * 5.3 - time * 6.2) + .08 * sin(vP.y * 11. - time * 9.5 + vP.x * 4.));
      float g = clamp(1. - d / r, 0., 1.);
      g *= smoothstep(-2.3, -1.1, vP.y);

document.getElementById('pixel').onclick = e => { pixel = !pixel; e.target.classList.toggle('on', pixel); applySize(); };
document.getElementById('pause').onclick = e => { paused = !paused; e.target.classList.toggle('on', paused); };
const modeButtons = document.querySelectorAll('[data-mode]'), actButtons = document.querySelectorAll('[data-act]');
modeButtons.forEach(b => b.onclick = () => { mode = b.dataset.mode; modeButtons.forEach(o => o.classList.toggle('on', o === b)); });
const showAct = () => actButtons.forEach(o => o.classList.toggle('on', o.dataset.act === act));
actButtons.forEach(b => b.onclick = () => { if (act || charging) return; act = b.dataset.act; actT = 0; showAct(); }); // a move always finishes before the next

const chargeButton = document.getElementById('charge'), meter = document.getElementById('meter'), meterFill = meter.firstElementChild;
chargeButton.onpointerdown = () => { if (act || paused) return; charging = true; charge = 0; chargeButton.classList.add('on'); meter.hidden = false; };
chargeButton.oncontextmenu = e => e.preventDefault(); // a long press on a phone must not open a menu
function releaseCharge() {
  if (!charging) return;
  charging = false; chargeButton.classList.remove('on'); meter.hidden = true;
  if (charge < .12) { charge = 0; return; } // a quick tap cancels
  releasePower = charge; charge = 0; chargeW = 0; // the release's first frame matches the charge stance
  act = 'release'; actT = 0; showAct();
}
for (const type of ['pointerup', 'pointercancel', 'blur']) addEventListener(type, releaseCharge);

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let t = 0;
const WALK_RATE = 5.5, WALK_STRIDE = .36, WALK_SPEED = 2 * WALK_STRIDE * WALK_RATE / Math.PI; // floor speed matches the feet
const HIP_Y = 1.55; // the torso tilts about the hips, so they stay inside the abdomen

function track(p, keys) {
  if (p <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (p <= b) { const u = (p - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }
  }
  return keys[keys.length - 1][1];
}

/* Sword channels, in radians unless noted:
   armX swings the shoulder forward and down, armY across the body, armZ out to the side.
   wristX tips the blade forward and down. wristZ undoes the resting inward lean: without it
   the blade points at the body's centre and can never aim at the ground.
   edge turns the blade about its own length, so a swing leads with the cutting edge, not the flat.
   leap and crouch are world units, trail and surge are strengths. */
const STRAIGHT = .888, EDGE = Math.PI / 2, CHARGE_TIME = 1.8;
const MOVES = {
  slash: { dur: 1.05, fx: [[.44, 'hit']],
    armX: [[0, 0], [.3, -.9], [.44, 1.3], [.64, 1.3], [1, 0]], wristX: [[0, 0], [.3, -.55], [.44, .97], [.64, .97], [1, 0]],
    wristZ: [[0, 0], [.22, STRAIGHT], [.64, STRAIGHT], [1, 0]],
    pitch: [[0, 0], [.3, -.1], [.44, .14], [.64, .12], [1, 0]], twist: [[0, 0], [.3, -.26], [.44, .18], [.64, .14], [1, 0]],
    edge: [[0, 0], [.22, EDGE], [.64, EDGE], [1, 0]],
    surge: [[0, 0], [.24, .4], [.44, 1.4], [.66, .8], [1, 0]], trail: [[.3, 0], [.34, 1], [.5, 1], [.56, 0]] },
  sweep: { dur: 1.05,
    armX: [[0, 0], [.3, 1.15], [.7, 1.15], [1, 0]], wristX: [[0, 0], [.3, .42], [.7, .42], [1, 0]],
    wristZ: [[0, 0], [.25, STRAIGHT], [.7, STRAIGHT], [1, 0]], armY: [[0, 0], [.3, -.55], [.48, .75], [.7, .75], [1, 0]],
    twist: [[0, 0], [.3, -.95], [.48, 1.05], [.7, .9], [1, 0]],
    edge: [[0, 0], [.3, 0], [.7, 0], [1, 0]], // already edge-on for a horizontal cut
    surge: [[0, 0], [.3, .5], [.48, 1.4], [.7, .7], [1, 0]], trail: [[.32, 0], [.36, 1], [.5, 1], [.56, 0]] },
  rise: { dur: 1.05,
    armX: [[0, 0], [.3, 1.2], [.46, -.7], [.66, -.7], [1, 0]], wristX: [[0, 0], [.3, 1], [.46, -.55], [.66, -.55], [1, 0]],
    wristZ: [[0, 0], [.25, STRAIGHT], [.66, STRAIGHT], [1, 0]],
    pitch: [[0, 0], [.3, .16], [.46, -.2], [.66, -.16], [1, 0]], crouch: [[0, 0], [.3, -.22], [.46, .22], [.66, .1], [1, 0]],
    leap: [[.3, 0], [.5, .9], [.72, 0]], tuck: [[.3, 0], [.5, 1], [.72, 0]],
    edge: [[0, 0], [.25, EDGE], [.66, EDGE], [1, 0]],
    surge: [[0, 0], [.3, .5], [.46, 1.5], [.66, .7], [1, 0]], trail: [[.32, 0], [.35, 1], [.46, 1], [.52, 0]] },
  spin: { dur: 1.45,
    armZ: [[0, 0], [.16, 1.3], [.84, 1.3], [1, 0]], wristZ: [[0, 0], [.16, 1.16], [.84, 1.16], [1, 0]],
    spin: [[0, 0], [.14, -.55], [.86, Math.PI * 4], [1, Math.PI * 4]],
    leap: [[.08, 0], [.2, .7], [.78, .7], [.9, 0]], tuck: [[.08, 0], [.2, 1], [.78, 1], [.9, 0]],
    edge: [[0, 0], [.16, EDGE], [.84, EDGE], [1, 0]],
    surge: [[0, 0], [.18, 1.2], [.82, 1.2], [1, 0]], trail: [[.16, 0], [.2, 1], [.8, 1], [.85, 0]] },
  slam: { dur: 1.7, fx: [[.56, 'impact']],
    armX: [[0, 0], [.2, -.8], [.46, -.8], [.56, 1.3], [.76, 1.3], [1, 0]], wristX: [[0, 0], [.2, -.5], [.46, -.5], [.56, 1], [.76, 1], [1, 0]],
    wristZ: [[0, 0], [.2, STRAIGHT], [.76, STRAIGHT], [1, 0]],
    leap: [[.18, 0], [.42, 3.2], [.47, 3.2], [.56, 0]], tuck: [[.18, 0], [.34, 1], [.52, 1], [.56, 0]],
    crouch: [[0, 0], [.18, -.28], [.3, .05], [.56, .02], [.76, .02], [1, 0]], pitch: [[0, 0], [.2, -.12], [.46, -.18], [.56, .14], [.76, .12], [1, 0]],
    edge: [[0, 0], [.2, EDGE], [.76, EDGE], [1, 0]],
    surge: [[0, 0], [.3, 1], [.56, 2.4], [.8, .7], [1, 0]], trail: [[.46, 0], [.49, 1], [.56, 1], [.6, 0]] },
  wave: { dur: 1.1, fx: [[.42, 'wave']],
    armX: [[0, 0], [.28, -.7], [.42, 1.35], [.62, 1.35], [1, 0]], wristX: [[0, 0], [.28, -.4], [.42, .55], [.62, .55], [1, 0]],
    wristZ: [[0, 0], [.22, STRAIGHT], [.62, STRAIGHT], [1, 0]], twist: [[0, 0], [.28, -.5], [.42, .45], [.62, .35], [1, 0]],
    edge: [[0, 0], [.22, EDGE], [.62, EDGE], [1, 0]],
    surge: [[0, 0], [.3, 1.6], [.42, 2], [.6, .4], [1, 0]], trail: [[.3, 0], [.33, 1], [.46, 1], [.52, 0]] },
  release: { dur: 1.25, fx: [[.34, 'chargedImpact']], // begins exactly where the charge stance ends
    armX: [[0, -.5], [.14, -.95], [.34, 1.3], [.62, 1.3], [1, 0]], wristX: [[0, 0], [.14, -.55], [.34, 1], [.62, 1], [1, 0]],
    wristZ: [[0, STRAIGHT], [.62, STRAIGHT], [1, 0]], pitch: [[0, 0], [.14, -.12], [.34, .14], [.62, .12], [1, 0]],
    twist: [[0, 0], [.14, -.3], [.34, .18], [.62, .14], [1, 0]], crouch: [[0, -.25], [.14, -.1], [.34, .02], [.62, .02], [1, 0]],
    edge: [[0, 0], [.14, EDGE], [.62, EDGE], [1, 0]],
    surge: [[0, 2], [.34, 3], [.6, 1], [1, 0]], trail: [[.16, 0], [.2, 1], [.34, 1], [.4, 0]] },
  snap: { dur: .95 },
  roar: { dur: 1.7 },
};
function chain(...names) { // joins moves, skipping each one's return to rest so they flow together
  const total = names.reduce((sum, n) => sum + MOVES[n].dur, 0), out = { dur: total * .85, fx: [] };
  let start = 0;
  names.forEach((n, i) => {
    const m = MOVES[n], span = m.dur / total;
    for (const [at, fx] of m.fx || []) out.fx.push([start + at * span, fx]);
    for (const channel of ['armX', 'armY', 'armZ', 'wristX', 'wristZ', 'edge', 'pitch', 'twist', 'crouch', 'leap', 'tuck', 'surge', 'trail']) {
      (m[channel] || [[0, 0], [1, 0]]).forEach((key, j, keys) => {
        if ((j === 0 && i > 0) || (j === keys.length - 1 && i < names.length - 1)) return;
        (out[channel] ||= []).push([start + key[0] * span, key[1]]);
      });
    }
    start += span;
  });
  return out;
}
MOVES.combo = chain('slash', 'sweep', 'rise');

const tipPoint = () => swordBlade.localToWorld(new THREE.Vector3(0, 3, 0));
const FX = {
  hit() { const q = tipPoint(); if (q.y < 1.2) burst(q, 22, 5); camShake = Math.max(camShake, .07); flash = Math.max(flash, 10); },
  impact() { const q = tipPoint(); shockwave(q, 8, 1); burst(q, 70, 8); camShake = .3; flash = 34; },
  wave() { launchWave(1); camShake = Math.max(camShake, .08); flash = Math.max(flash, 14); },
  chargedImpact() {
    const q = tipPoint(), k = releasePower;
    shockwave(q, 8 + 12 * k, 1 + k); burst(q, 90 + 150 * k | 0, 9 + 6 * k);
    if (k > .4) launchWave(1 + k * 1.2);
    camShake = .25 + .4 * k; flash = 30 + 50 * k;
  },
};

function pose(time, walk = walkW, name = act, p = name ? actT / MOVES[name].dur : 0, cw = chargeW, c = charge) {
  const on = (n, keys) => (n === name ? track(p, keys) : 0);
  const m = name ? MOVES[name] : null, ch = key => (m && m[key] ? track(p, m[key]) : 0);
  const stride = time * WALK_RATE, tuck = ch('tuck');

  for (const l of legs) {
    const a = stride + l.phase, raised = Math.max(0, -Math.sin(a)) * walk;
    l.yaw.rotation.y = -l.s * WALK_STRIDE * Math.cos(a) / l.reach * walk;
    l.lift.quaternion.setFromAxisAngle(l.axis, Math.max(raised * .34, tuck * .55));
    l.knee.quaternion.setFromAxisAngle(l.axis, -Math.max(raised * .3, tuck * .5));
  }
  root.position.y = ch('leap');
  root.rotation.y = ch('spin');

  const roar = on('roar', [[0, 0], [.15, 1], [.85, 1], [1, 0]]);
  const pitch = ch('pitch') - roar * .24 - cw * .06;
  const twist = ch('twist') + on('snap', [[0, 0], [.22, .14], [.42, -.26], [.7, -.26], [1, 0]]);
  const roll = Math.sin(stride) * .035 * walk;
  const held = cw * c, tremble = (roar * .025 + held * .03) * Math.sin(time * 46);
  upper.rotation.set(pitch, twist, roll);
  upper.position.set(HIP_Y * Math.sin(roll) + tremble, Math.sin(time * 2) * .03 + Math.abs(Math.sin(stride)) * .07 * walk + HIP_Y * (1 - Math.cos(pitch)) + roar * .22 + ch('crouch') - cw * .25, -HIP_Y * Math.sin(pitch));

  swordArm.rotation.x = ch('armX') + Math.sin(stride) * .08 * walk - roar * .25 - cw * .5;
  swordArm.rotation.y = ch('armY');
  swordArm.rotation.z = Math.sin(time * 1.3) * .025 - roar * .25 + ch('armZ');
  swordHand.rotation.set(ch('wristX'), 0, -STRAIGHT + ch('wristZ') + cw * STRAIGHT);
  swordHand.rotateY(ch('edge')); // local, so it spins the sword about its own length whatever the wrist is doing
  trailNow = ch('trail');

  clawArm.rotation.x = Math.sin(time * 1.3 + 1) * .02 - Math.sin(stride) * .08 * walk + on('snap', [[0, 0], [.22, -.35], [.42, -.1], [.7, -.1], [1, 0]]);
  clawArm.rotation.y = on('snap', [[0, 0], [.22, .28], [.42, -.6], [.7, -.6], [1, 0]]);
  clawArm.rotation.z = roar * .7;
  lowerJaw.rotation.x = Math.max(
    Math.max(0, Math.sin(time * 1.1) - .55) * .55,
    on('snap', [[0, 0], [.22, .85], [.38, .85], [.44, 0], [.56, .6], [.64, 0], [.76, .6], [.84, 0], [1, 0]]),
    roar * .8);

  for (const { group, s } of antennae) {
    group.rotation.x = Math.sin(time * 2.4 + s) * .08 + Math.sin(stride * 2) * .1 * walk - roar * .5;
    group.rotation.z = Math.sin(time * 1.7 + s * 2) * .06 + s * roar * .3;
  }

  const flicker = .9 + Math.sin(time * 9) * .05 + Math.sin(time * 23) * .05;
  glows.forEach(g => { g.material.opacity = flicker; g.scale.setScalar(1 + roar * .7 + held * .5); });
  emberLight.intensity = 10 * flicker + roar * 22 + trailNow * 18 + held * 26 + flash;
  const surge = ch('surge') + roar * .7;
  auraTime.value = time;
  auraPower.value = (.86 + .14 * Math.sin(time * 5.3)) * (1 + surge + held * 1.5);
  auraSize.value = 1 + surge * (.1 + (name === 'release' ? releasePower * .25 : 0)) + held * .55;
  auraLight.intensity = 9 * auraPower.value;
  chargeRing.visible = held > .01;
  chargeRing.material.uniforms.c.value = held;
  waveBanner(time);
}

/* ---------- GLB export ---------- */
const exportMats = new Map();
function exportMaterial(mat) {
  if (!exportMats.has(mat)) {
    let out;
    if (mat.isMeshToonMaterial) out = new THREE.MeshStandardMaterial({ color: mat.color, map: mat.map, roughness: .8, metalness: 0 });
    else { out = mat.clone(); out.side = THREE.FrontSide; }
    exportMats.set(mat, out);
  }
  return exportMats.get(mat);
}
function exportGeometry(src, backFacing) {
  const g = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) g.setAttribute(name, src.attributes[name].clone());
  if (src.index) g.setIndex(src.index.clone());
  if (backFacing) { // glTF has no back-side-only mode, so turn the faces around
    const n = g.attributes.normal;
    for (let i = 0; i < n.count; i++) n.setXYZ(i, -n.getX(i), -n.getY(i), -n.getZ(i));
    const idx = g.index.array;
    for (let i = 0; i < idx.length; i += 3) { const a = idx[i]; idx[i] = idx[i + 2]; idx[i + 2] = a; }
  }
  return g;
}
function exportTree(src) {
  const out = src.isMesh ? new THREE.Mesh(exportGeometry(src.geometry, src.material.side === THREE.BackSide), exportMaterial(src.material)) : new THREE.Group();
  out.name = src.name;
  out.position.copy(src.position); out.quaternion.copy(src.quaternion); out.scale.copy(src.scale);
  for (const child of src.children) {
    // outlines and additive glows are renderer tricks glTF cannot carry
    if (child.isLight || child.material === hullMat || child.material?.blending === THREE.AdditiveBlending) continue;
    out.add(exportTree(child));
  }
  return out;
}
root.name = 'Clawd'; upper.name = 'UpperBody'; swordArm.name = 'SwordArm'; clawArm.name = 'ClawArm'; lowerJaw.name = 'LowerJaw';
document.getElementById('download').onclick = async e => {
  const button = e.target, label = 'DOWNLOAD GLB';
  button.disabled = true; button.textContent = 'EXPORTING…';
  try {
    pose(0, 0, null, 0, 0, 0); // always export the neutral stance
    const glb = await new GLTFExporter().parseAsync(exportTree(root), { binary: true });
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'clawd.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    button.textContent = label;
  } catch (err) {
    console.error(err);
    button.textContent = 'EXPORT FAILED';
  }
  button.disabled = false;
};

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1); // a stall slows the action instead of skipping it
  if (!paused) {
    const t0 = t, move = act ? MOVES[act] : null, p0 = move ? actT / move.dur : 0;
    t += dt;
    walkW += ((mode === 'walk' ? 1 : 0) - walkW) * (1 - Math.exp(-dt * 6));
    floorTile.offset.y -= WALK_SPEED * walkW * dt;
    if (charging) {
      charge = Math.min(1, charge + dt / CHARGE_TIME);
      chargeW += (1 - chargeW) * (1 - Math.exp(-dt * 10));
      chargeSparks(dt, charge);
      meterFill.style.width = charge * 100 + '%';
    } else if (!act) chargeW *= Math.exp(-dt * 10);

    let name = act, p1 = p0, due = [];
    if (move) {
      actT += dt; p1 = Math.min(1, actT / move.dur);
      due = (move.fx || []).filter(([at]) => p0 < at && p1 >= at);
      if (p1 >= 1) { act = null; actT = 0; showAct(); name = null; p1 = 0; }
    }
    // several poses per frame keep the ribbon a smooth curve through fast swings
    const steps = name ? 3 : 1;
    for (let i = 1; i <= steps; i++) {
      const u = i / steps, at = t0 + (t - t0) * u;
      pose(at, walkW, name, name ? p0 + (p1 - p0) * u : 0);
      root.updateWorldMatrix(true, true);
      pushTrail(at, trailNow);
    }
    driftEmbers(dt, t);
    driftAura(dt, t);
    updateFx(dt);
    due.forEach(([, fx]) => FX[fx]()); // after updateFx, so a slow frame can't age a new effect away
    drawTrail(t);
  } else pose(t);
  if (goal) {
    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  const off = new THREE.Vector3((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);
  camera.position.add(off);
  renderer.render(scene, camera);
  camera.position.sub(off);
  camShake *= Math.exp(-dt * 8);
}
animate();
