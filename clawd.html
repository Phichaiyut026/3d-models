<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- scene ---------- */
const PIXEL_SIZE = 2;
const scene = new THREE.Scene();
scene.background = (() => { // a short canvas, so the dusk sky falls in visible pixel bands
  const c = document.createElement('canvas'); c.width = 2; c.height = 56;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 56);
  g.addColorStop(0, '#0d0b1e'); g.addColorStop(.5, '#2b1436'); g.addColorStop(.74, '#7a2f2a'); g.addColorStop(.84, '#3c1a26'); g.addColorStop(1, '#170d18');
  x.fillStyle = g; x.fillRect(0, 0, 2, 56);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, .1, 900);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 9.6, 0);
controls.minDistance = 10; controls.maxDistance = 240;

scene.add(new THREE.HemisphereLight(0x7f7fc8, 0x5a2016, 1.35));
const key = new THREE.DirectionalLight(0xffd7ad, 2.7);
key.position.set(-10, 30, 22); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -26, right: 26, top: 26, bottom: -14, far: 90 });
key.shadow.bias = -.0015; key.shadow.normalBias = .03;
scene.add(key);
const rimLight = new THREE.DirectionalLight(0x45dcff, 3.2); // cool rim against the warm body
rimLight.position.set(6, 7, -10); scene.add(rimLight);
const emberLight = new THREE.PointLight(0xff5a1c, 10, 16, 1.4);
emberLight.position.set(0, 3, 8); emberLight.distance = 44; scene.add(emberLight);

/* ---------- pixel-art surface ---------- */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TEX = 256, TILE = 8; // one tile covers 8 world units, so 32 texels per unit

function noiseTexture() {
  const c = document.createElement('canvas'); c.width = c.height = TEX;
  const x = c.getContext('2d');
  x.fillStyle = '#eee'; x.fillRect(0, 0, TEX, TEX);
  const paint = (v, px, py, w, h) => { x.fillStyle = `rgb(${v},${v},${v})`; x.fillRect(px, py, w, h); };
  for (let i = 0; i < 900; i++) paint(205 + rnd() * 50 | 0, rnd() * TEX | 0, rnd() * TEX | 0, 2 + rnd() * 7 | 0, 1 + rnd() * 5 | 0);
  for (let i = 0; i < 90; i++) paint(95 + rnd() * 45 | 0, rnd() * TEX | 0, rnd() * TEX | 0, 2 + rnd() * 5 | 0, 1 + rnd() * 2 | 0); // scuffs
  for (let i = 0; i < 16; i++) { // chips with a lit lower edge
    const px = rnd() * TEX | 0, py = rnd() * TEX | 0, w = 3 + rnd() * 5 | 0;
    paint(70, px, py, w, 2); paint(255, px, py + 2, w, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const noise = noiseTexture();
const ramp = new THREE.DataTexture(new Uint8Array([78, 150, 225, 255]), 4, 1, THREE.RedFormat);
ramp.magFilter = ramp.minFilter = THREE.NearestFilter; ramp.needsUpdate = true;

const toon = color => new THREE.MeshToonMaterial({ color, map: noise, gradientMap: ramp });
const flat = color => new THREE.MeshBasicMaterial({ color, toneMapped: false });
const godTime = { value: 0 };
const spaceMat = new THREE.ShaderMaterial({ // pixel-stepped, to sit with the rest of the sprite-like armour
  uniforms: { time: godTime },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform float time; varying vec3 vP;
    float h(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
    float n(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
    void main(){
      vec3 q = floor(vP * 26.) / 26.;
      float a = (n(q * 2.1 + time * .05) + .5 * n(q * 5.2 - time * .08)) / 1.5;
      vec3 col = mix(vec3(.04, .02, .13), vec3(.36, .07, .42), smoothstep(.34, .72, a));
      col += vec3(.95, .34, .08) * smoothstep(.66, .86, a);
      float r = h(floor(vP * 13.));
      col += vec3(1., .95, .8) * step(.955, r) * (.55 + .45 * sin(time * (1.5 + r * 5.) + r * 50.)) * 1.5;
      gl_FragColor = vec4(col, 1.);
    }`,
});
const M = {
  orange: toon(0xf0480c), bright: toon(0xff6c1c), hot: toon(0xffe08a), dark: spaceMat,
  steel: spaceMat, steelLite: toon(0xf0c050), gold: toon(0xffd25a), ember: flat(0xfff0c0),
  black: flat(0x130d0b), eyeHalo: flat(0xffe9a0), eye: flat(0xffffff),
  badge: flat(0xffb340), letter: flat(0xfff0c2),
};

/* ---------- ground ---------- */
const floorTile = (() => {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#3b2a3a'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 26; i++) { x.fillStyle = rnd() < .5 ? '#322332' : '#463244'; x.fillRect(rnd() * S | 0, rnd() * S | 0, 2 + rnd() * 8 | 0, 2 + rnd() * 4 | 0); }
  x.fillStyle = '#8a4a2c'; x.fillRect(0, 0, S, 2); x.fillRect(0, 0, 2, S);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(56, 56);
  t.magFilter = THREE.NearestFilter; t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const floorFade = (() => { // separate from the tile, so the floor can scroll under a fixed vignette
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, '#fff'); g.addColorStop(.42, '#fff'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(56, 56), new THREE.MeshToonMaterial({ map: floorTile, alphaMap: floorFade, gradientMap: ramp, transparent: true, depthWrite: false }));
ground.rotation.x = -Math.PI / 2; ground.scale.set(3, 3, 1); ground.receiveShadow = true; scene.add(ground);

const hullMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { t: { value: .036 } },
  vertexShader: `attribute vec3 smoothNormal; uniform float t;
    void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + smoothNormal * t, 1.); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(.05,.03,.06,1.); }`,
});
const headHull = hullMat.clone(); headHull.uniforms.t.value = .036 / .55;

function prepare(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  const p = g.attributes.position, n = g.attributes.normal, count = p.count;
  // world-scale UVs so every surface shares one texel size
  const uv = new Float32Array(count * 2), ou = rnd(), ov = rnd(), k = 1 / TILE;
  for (let i = 0; i < count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ax >= ay && ax >= az) { u = p.getZ(i); v = p.getY(i); }
    else if (ay >= az) { u = p.getX(i); v = p.getZ(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv[i * 2] = u * k + ou; uv[i * 2 + 1] = v * k + ov;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  // averaged normals keep the outline closed at hard corners
  const sum = new Map(), keys = [];
  for (let i = 0; i < count; i++) {
    const key = `${Math.round(p.getX(i) * 1e3)},${Math.round(p.getY(i) * 1e3)},${Math.round(p.getZ(i) * 1e3)}`;
    keys.push(key);
    const v = sum.get(key) || new THREE.Vector3();
    v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(key, v);
  }
  const smooth = new Float32Array(count * 3);
  keys.forEach((key, i) => { const v = sum.get(key).clone().normalize(); smooth.set([v.x, v.y, v.z], i * 3); });
  g.setAttribute('smoothNormal', new THREE.BufferAttribute(smooth, 3));
  return g;
}

function add(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], outline = true) {
  const g = prepare(geo);
  const m = new THREE.Mesh(g, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = !mat.isMeshBasicMaterial;
  if (outline) m.add(new THREE.Mesh(g, hullMat));
  parent.add(m);
  return m;
}
const box = (parent, pos, size, mat, rot) => add(parent, new THREE.BoxGeometry(...size), mat, pos, rot);

function seg(parent, a, b, r1, r2, mat, sides = 6) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const m = add(parent, new THREE.CylinderGeometry(r2, r1, d.length(), sides, 1), mat, A.clone().add(B).multiplyScalar(.5).toArray());
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}
const spike = (parent, base, tip, r = .13, mat = M.bright) => seg(parent, base, tip, r, .008, mat, 5);

function shapeGeo(points, depth, bevel = 0, holes = []) {
  const s = new THREE.Shape(points.map(p => new THREE.Vector2(...p)));
  holes.forEach(h => s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(...p)))));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 1, curveSegments: 4 });
  g.translate(0, 0, -depth / 2);
  return g;
}

/* ---------- body ---------- */
const root = new THREE.Group(); scene.add(root);
const upper = new THREE.Group(); root.add(upper);
const pelvis = new THREE.Group(); root.add(pelvis);

const THIGH = 1.3, SHIN = 1.25, ANKLE_Y = .45, HIP_Y = 2.87, LEG_SPLAY = .1; // the torso tilts about the hips

// the head is the original armoured block, now a helmet on a neck
const NECK_Y = 5.25, HEAD_K = [.52, .8, .55];
seg(upper, [0, 4.92, 0], [0, 5.4, 0], .36, .3, M.steel, 7);
const neck = new THREE.Group(); neck.position.y = NECK_Y; upper.add(neck);
const head = new THREE.Group(); head.position.y = -2.78 * HEAD_K[1]; head.scale.set(...HEAD_K); neck.add(head);

add(head, shapeGeo([[-1.12, -.57], [1.12, -.57], [1.24, .02], [1, .57], [-1, .57], [-1.24, .02]], 2.1), M.orange, [0, 3.35, 0]);
box(head, [0, 2.8, 0], [2.26, .05, 2.03], M.ember);

// feelers that lean forward, clear of the sword's arc
const antennae = [];
for (const s of [-1, 1]) {
  const a = new THREE.Group(); a.position.set(s * .42, 3.9, .82); head.add(a);
  const pts = [[0, 0, 0], [s * .25, .35, .3], [s * .55, .55, .7], [s * .95, .5, 1.05]], radii = [.08, .06, .04, .012];
  for (let i = 0; i < 3; i++) seg(a, pts[i], pts[i + 1], radii[i], radii[i + 1], i === 2 ? M.hot : M.dark, 5);
  antennae.push({ group: a, s });
  spike(head, [s * .72, 3.02, 1], [s * .46, 2.86, 1.34], .09, M.gold); // mandible
}

// head spikes: two rows of three, plus one centred
for (const [x, z, h] of [[-.76, .62, .42], [0, .62, .34], [.76, .62, .46], [-.76, -.55, .4], [0, -.55, .46], [.76, -.55, .36], [.3, .03, .32]])
  spike(head, [x, 3.9, z], [x, 3.92 + h, z], .15);

// face
for (const s of [-1, 1]) {
  const eye = k => [[-.21 * k, .03 * k], [.2 * k, .17 * k], [.23 * k, -.03 * k], [.1 * k, -.15 * k], [-.11 * k, -.15 * k]].map(([o, y]) => [s * o, y]);
  add(head, shapeGeo(eye(1.32), .02), M.eyeHalo, [s * .52, 3.47, 1.055], [0, 0, 0], false);
  add(head, shapeGeo(eye(.8), .02), M.eye, [s * .52, 3.47, 1.075], [0, 0, 0], false);
  box(head, [s * .53, 3.66, 1.1], [.88, .17, .17], M.steel, [0, 0, s * .58]);
}
box(head, [0, 3.2, 1.06], [.34, .055, .03], M.black);
for (const s of [-1, 1]) box(head, [s * .24, 3.155, 1.06], [.2, .055, .03], M.black, [0, 0, s * .62]);

// the helmet's rear plate and studs
box(head, [0, 3.28, -1.08], [1.9, .86, .08], M.bright);
for (const [x, y, h] of [[-.95, 3.72, .24], [.95, 3.72, .24], [-.47, 3.42, .3], [.47, 3.42, .3]]) {
  seg(head, [x, y, -1.1], [x, y, -1.18], .16, .15, M.hot, 6);
  spike(head, [x, y, -1.18], [x, y, -1.18 - h], .13, M.hot);
}
head.traverse(o => { if (o.material === hullMat) o.material = headHull; }); // the head is scaled, so its outline must not be

// a tapered chest over the glowing seam, then an abdomen of narrowing plates
add(upper, shapeGeo([[-.72, -.65], [.72, -.65], [1.14, .35], [.9, .65], [-.9, .65], [-1.14, .35]], 1.15), M.orange, [0, 4.35, 0]);
box(upper, [0, 3.68, 0], [1.52, .05, 1.02], M.ember);
for (let i = 0; i < 4; i++) box(upper, [0, 3.54 - i * .19, 0], [1.36 - i * .08, .2, 1 - i * .05], i % 2 ? M.dark : M.steel);
for (const s of [-1, 1]) box(upper, [s * .44, 3.54, .51], [.26, .1, .06], M.gold);

// chest badge
box(upper, [0, 4.42, .58], [1.02, .78, .06], M.dark);
const rrect = (w, h, c) => [[-w + c, -h], [w - c, -h], [w, -h + c], [w, h - c], [w - c, h], [-w + c, h], [-w, h - c], [-w, -h + c]];
add(upper, shapeGeo(rrect(.47, .38, .1), .04, 0, [rrect(.39, .3, .07).reverse()]), M.badge, [0, 4.42, .62], [0, 0, 0], false);
add(upper, shapeGeo([[-.31, -.2], [-.19, .2], [-.04, .2], [.08, -.2], [-.03, -.2], [-.06, -.11], [-.17, -.11], [-.2, -.2]], .03, 0, [[[-.145, -.03], [-.085, -.03], [-.115, .08]]]), M.letter, [0, 4.42, .625], [0, 0, 0], false);
add(upper, shapeGeo([[.14, -.2], [.25, -.2], [.25, .2], [.14, .2]], .03), M.letter, [0, 4.42, .625], [0, 0, 0], false);

// back plate and studs
box(upper, [0, 4.42, -.6], [1.5, .98, .1], M.bright);
for (const [x, y, h] of [[-.95, 4.82, .24], [.95, 4.82, .24], [-.42, 4.68, .3], [.42, 4.68, .3], [-.42, 4.12, .3], [.42, 4.12, .3]]) {
  const z = x * x > .5 ? -.56 : -.65;
  seg(upper, [x, y, z + .02], [x, y, z - .06], .14, .13, M.hot, 6);
  spike(upper, [x, y, z - .06], [x, y, z - .06 - h], .12, M.hot);
}

// shoulders
for (const s of [-1, 1]) {
  seg(upper, [s * 1, 4.72, .05], [s * 1.68, 4.72, .05], .42, .47, M.steel, 8);
  seg(upper, [s * 1.3, 4.72, .05], [s * 1.38, 4.72, .05], .49, .5, M.gold, 8);
  spike(upper, [s * 1.26, 5.08, .05], [s * 1.22, 5.56, .05], .15);
  spike(upper, [s * 1.54, 5.04, .05], [s * 1.64, 5.42, .05], .12);
  box(upper, [s * 1.4, 4.78, .5], [.12, .08, .05], M.ember);
  box(upper, [s * 1.71, 4.62, .2], [.03, .14, .1], M.ember);
}

// hips
box(pelvis, [0, 2.86, 0], [1.42, .5, .96], M.dark);
box(pelvis, [0, 3.1, 0], [1.46, .13, 1.02], M.gold);
add(pelvis, shapeGeo([[-.34, .22], [.34, .22], [.13, -.42], [-.13, -.42]], .1), M.orange, [0, 2.76, .52]);
box(pelvis, [0, 2.84, .58], [.26, .06, .03], M.ember);
for (const s of [-1, 1]) box(pelvis, [s * .86, 2.62, 0], [.3, .74, .9], M.orange, [0, 0, s * .16]);

/* ---------- legs ---------- */
const rel = (p, o) => p.map((v, i) => v - o[i]);
const legs = [];
function leg(s, phase) {
  const tilt = new THREE.Group(); tilt.position.set(s * .48, HIP_Y, 0); tilt.rotation.z = s * LEG_SPLAY; pelvis.add(tilt);
  const thigh = new THREE.Group(); tilt.add(thigh);
  const knee = new THREE.Group(); knee.position.y = -THIGH; thigh.add(knee);
  const ankle = new THREE.Group(); ankle.position.y = -SHIN; knee.add(ankle);

  seg(thigh, [0, 0, 0], [0, -THIGH, 0], .42, .32, M.dark, 7);
  box(thigh, [0, -.62, .3], [.42, .78, .12], M.bright);
  spike(thigh, [s * .34, -.52, 0], [s * .74, -.2, 0], .1);

  add(knee, new THREE.IcosahedronGeometry(.36, 0), M.steel);
  spike(knee, [0, .16, .28], [s * .06, .52, .62], .11);

    const a = rnd() * Math.PI * 2, up = rnd(), v = speed * (.4 + rnd() * .8);
    emit(q.x, Math.max(q.y, .1), q.z, Math.cos(a) * v, (.4 + up * 1.2) * speed * .6, Math.sin(a) * v, .45 + rnd() * .6, -11);
  }
}
function chargeSparks(dt, c) { // sparks pulled in from around the blade
  const mid = swordBlade.localToWorld(new THREE.Vector3(0, 1.6, 0));
  sparkDebt += dt * (45 + c * 170);
  while (sparkDebt >= 1) {
    sparkDebt--;
    const a = rnd() * Math.PI * 2, d = 2.5 + rnd() * 3, life = .38 + rnd() * .22;
    const x = mid.x + Math.cos(a) * d, y = mid.y + (rnd() - .5) * 4, z = mid.z + Math.sin(a) * d;
    emit(x, y, z, (mid.x - x) / life, (mid.y - y) / life, (mid.z - z) / life, life, 0);
  }
}

function updateFx(dt) {
  for (let i = 0; i < P_N; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt;
    const n = i * 3, k = Math.max(0, pLife[i] / pMax[i]);
    pVel[n + 1] += pGrav[i] * dt;
    pPos[n] += pVel[n] * dt; pPos[n + 1] += pVel[n + 1] * dt; pPos[n + 2] += pVel[n + 2] * dt;
    pCol[n] = k; pCol[n + 1] = k * (.35 + .5 * k); pCol[n + 2] = k * .14;
  }
  fxGeo.attributes.position.needsUpdate = true; fxGeo.attributes.color.needsUpdate = true;
  for (const s of rings) {
    if (!s.mesh.visible) continue;
    s.age += dt;
    const a = s.age / s.life;
    if (a >= 1) { s.mesh.visible = false; continue; }
    s.mesh.material.uniforms.r.value = (1 - (1 - a) * (1 - a)) * .9;
    s.mesh.material.uniforms.a.value = (1 - a) * s.strength;
  }
  for (const w of waves) {
    if (!w.mesh.visible) continue;
    w.age += dt;
    const a = w.age / w.life;
    if (a >= 1) { w.mesh.visible = false; continue; }
    w.mesh.position.z += 62 * dt;
    w.mesh.scale.setScalar(w.size * (1 + a * .6));
    w.mesh.material.uniforms.a.value = 1 - a * a;
  }
  flash *= Math.exp(-dt * 7);
}

  hakai.visible = orb > .02; hakai.scale.setScalar(Math.max(.01, orb)); hakai.position.z = 12 + ch('orbZ'); hakaiPower.value = Math.min(1.2, orb * .35);
  const spk = ch('spk');
  for (const s of spikeRing) {
    const grow = Math.max(0, Math.min(1, (spk - s.userData.delay) / .55));
    s.visible = grow > .01; s.scale.set(1, Math.max(.01, grow * s.userData.tall), 1);
  }
  const erase = ch('erase'), whiteOut = ch('whiteOut');
  eraseSheet.visible = erase > .002 || whiteOut > .002;
  eraseMat.uniforms.p.value = erase; eraseMat.uniforms.white.value = whiteOut; eraseMat.uniforms.aspect.value = innerWidth / innerHeight;

  waveBanner(time);
}

/* ---------- GLB export ---------- */
const exportMats = new Map();
function exportMaterial(mat) {
  if (!exportMats.has(mat)) {
    let out;
    if (mat.isMeshToonMaterial) out = new THREE.MeshStandardMaterial({ color: mat.color, map: mat.map, roughness: .8, metalness: 0 });
    else if (mat.isShaderMaterial) out = new THREE.MeshStandardMaterial({ color: 0x140a2c, roughness: .8, metalness: 0 });
    else { out = mat.clone(); out.side = THREE.FrontSide; }
    exportMats.set(mat, out);
  }
  return exportMats.get(mat);
}
function exportGeometry(src, backFacing) {
  const g = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) g.setAttribute(name, src.attributes[name].clone());
  if (src.index) g.setIndex(src.index.clone());
  if (backFacing) { // glTF has no back-side-only mode, so turn the faces around
    const n = g.attributes.normal;
    for (let i = 0; i < n.count; i++) n.setXYZ(i, -n.getX(i), -n.getY(i), -n.getZ(i));
    const idx = g.index.array;
    for (let i = 0; i < idx.length; i += 3) { const a = idx[i]; idx[i] = idx[i + 2]; idx[i + 2] = a; }
  }
  return g;
}
function exportTree(src) {
  const out = src.isMesh ? new THREE.Mesh(exportGeometry(src.geometry, src.material.side === THREE.BackSide), exportMaterial(src.material)) : new THREE.Group();
  out.name = src.name;
  out.position.copy(src.position); out.quaternion.copy(src.quaternion); out.scale.copy(src.scale);
  for (const child of src.children) {
    // outlines and additive glows are renderer tricks glTF cannot carry
    if (child.isLight || child.material === hullMat || child.material === headHull || child.material?.blending === THREE.AdditiveBlending) continue;
    out.add(exportTree(child));
  }
  return out;
}
root.name = 'Clawd'; upper.name = 'UpperBody'; swordArm.name = 'SwordArm'; clawArm.name = 'ClawArm'; lowerJaw.name = 'LowerJaw';
document.getElementById('download').onclick = async e => {
  const button = e.target, label = 'DOWNLOAD GLB';
  button.disabled = true; button.textContent = 'EXPORTING…';
  try {
    pose(0, 0, null, 0, 0, 0); // always export the neutral stance
    const glb = await new GLTFExporter().parseAsync(exportTree(root), { binary: true });
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'clawd.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    button.textContent = label;
  } catch (err) {
    console.error(err);
    button.textContent = 'EXPORT FAILED';
  }
  button.disabled = false;
};

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1); // a stall slows the action instead of skipping it
  if (!paused) {
    const t0 = t, move = act ? MOVES[act] : null, p0 = move ? actT / move.dur : 0;
    t += dt;
    walkW += ((mode === 'walk' ? 1 : 0) - walkW) * (1 - Math.exp(-dt * 6));
    floorTile.offset.y -= WALK_SPEED * CLAWD_SCALE * walkW * dt;
    if (charging) {
      charge = Math.min(1, charge + dt / CHARGE_TIME);
      chargeW += (1 - chargeW) * (1 - Math.exp(-dt * 10));
      chargeSparks(dt, charge);
      meterFill.style.width = charge * 100 + '%';
    } else if (!act) chargeW *= Math.exp(-dt * 10);

    let name = act, p1 = p0, due = [];
    if (move) {
      actT += dt; p1 = Math.min(1, actT / move.dur);
      due = (move.fx || []).filter(([at]) => p0 < at && p1 >= at);
      if (p1 >= 1) { act = null; actT = 0; showAct(); name = null; p1 = 0; }
    }
    // several poses per frame keep the ribbon a smooth curve through fast swings
    const steps = name ? 3 : 1;
    for (let i = 1; i <= steps; i++) {
      const u = i / steps, at = t0 + (t - t0) * u;
      pose(at, walkW, name, name ? p0 + (p1 - p0) * u : 0);
      root.updateWorldMatrix(true, true);
      pushTrail(at, trailNow);
    }
    driftEmbers(dt, t);
    driftAura(dt, t);
    updateFx(dt);
    updateBolts(dt);
    due.forEach(([, fx]) => FX[fx]()); // after updateFx, so a slow frame can't age a new effect away
    drawTrail(t);
  } else pose(t);
  if (goal) {
    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  const off = new THREE.Vector3((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);
  camera.position.add(off);
  renderer.render(scene, camera);
  camera.position.sub(off);
  camShake *= Math.exp(-dt * 8);
}
animate();
