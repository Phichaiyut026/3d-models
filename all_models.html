function track(p, keys) {
  if (p <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (p <= b) { const u = (p - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }
  }
  return keys[keys.length - 1][1];
}

  let start = 0;

    const m = MOVES[n], span = m.dur / total;
    for (const [at, fx] of m.fx || []) out.fx.push([start + at * span, fx]);
    for (const channel of ['armX', 'armY', 'armZ', 'wristX', 'wristZ', 'edge', 'pitch', 'twist', 'crouch', 'leap', 'tuck', 'surge', 'trail']) {
      (m[channel] || [[0, 0], [1, 0]]).forEach((key, j, keys) => {
        if ((j === 0 && i > 0) || (j === keys.length - 1 && i < names.length - 1)) return;
        (out[channel] ||= []).push([start + key[0] * span, key[1]]);
      });
    }
    start += span;
  });

}

    walkW += ((mode === 'walk' ? 1 : 0) - walkW) * (1 - Math.exp(-dt * 6));
    floorTile.offset.y -= WALK_SPEED * CLAWD_SCALE * walkW * dt;
    if (charging) {
      charge = Math.min(1, charge + dt / CHARGE_TIME);
      chargeW += (1 - chargeW) * (1 - Math.exp(-dt * 10));
      chargeSparks(dt, charge);
      meterFill.style.width = charge * 100 + '%';
    } else if (!act) chargeW *= Math.exp(-dt * 10);

    let name = act, p1 = p0, due = [];
    if (move) {
      actT += dt; p1 = Math.min(1, actT / move.dur);
      due = (move.fx || []).filter(([at]) => p0 < at && p1 >= at);
      if (p1 >= 1) { act = null; actT = 0; showAct(); name = null; p1 = 0; }
    }
    // several poses per frame keep the ribbon a smooth curve through fast swings
    const steps = name ? 3 : 1;
    for (let i = 1; i <= steps; i++) {
      const u = i / steps, at = t0 + (t - t0) * u;
      pose(at, walkW, name, name ? p0 + (p1 - p0) * u : 0);
      root.updateWorldMatrix(true, true);
      pushTrail(at, trailNow);
    }
    driftEmbers(dt, t);
    driftAura(dt, t);
    updateFx(dt);
    updateBolts(dt);
    due.forEach(([, fx]) => FX[fx]()); // after updateFx, so a slow frame can't age a new effect away
    drawTrail(t);
  } else pose(t);
  if (goal) {
    camera.position.lerp(goal, 1 - Math.exp(-dt * 7));
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  const off = new THREE.Vector3((Math.random() - .5) * camShake, (Math.random() - .5) * camShake, 0);
  camera.position.add(off);
  renderer.render(scene, camera);
  camera.position.sub(off);

}

const hull = (color, t) => new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { t: { value: t }, c: { value: new THREE.Color(color).convertLinearToSRGB() } },
  vertexShader: `attribute vec3 smoothNormal; uniform float t;
    void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + smoothNormal * t, 1.); }`,
  fragmentShader: `uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.); }`,
});
const outlineMat = hull(0x120a3a, .02), wingRim = hull(0x4a27b0, .05);

function prepare(geo, smooth) {
  let g = geo;
  if (smooth) { g.computeVertexNormals(); g = g.toNonIndexed(); }
  else { if (g.index) g = g.toNonIndexed(); g.computeVertexNormals(); }
  const p = g.attributes.position, n = g.attributes.normal, count = p.count;
  const uv = new Float32Array(count * 2), ou = rnd(), ov = rnd(), k = 1 / TILE;
  for (let i = 0; i < count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ax >= ay && ax >= az) { u = p.getZ(i); v = p.getY(i); }
    else if (ay >= az) { u = p.getX(i); v = p.getZ(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv[i * 2] = u * k + ou; uv[i * 2 + 1] = v * k + ov;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  const sum = new Map(), keys = [];
  for (let i = 0; i < count; i++) {
    const key = `${Math.round(p.getX(i) * 1e3)},${Math.round(p.getY(i) * 1e3)},${Math.round(p.getZ(i) * 1e3)}`;
    keys.push(key);
    const v = sum.get(key) || new THREE.Vector3();
    v.x += n.getX(i); v.y += n.getY(i); v.z += n.getZ(i); sum.set(key, v);
  }
  const out = new Float32Array(count * 3);
  keys.forEach((key, i) => { const v = sum.get(key).clone().normalize(); out.set([v.x, v.y, v.z], i * 3); });
  g.setAttribute('smoothNormal', new THREE.BufferAttribute(out, 3));
  return g;
}

function add(parent, geo, mat, pos = [0, 0, 0], { rot = [0, 0, 0], outline = outlineMat, smooth = false } = {}) {
  const g = prepare(geo, smooth);
  const m = new THREE.Mesh(g, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = !mat.isMeshBasicMaterial;
  if (outline) { const h = new THREE.Mesh(g, outline); h.userData.helper = true; m.add(h); }
  parent.add(m);
  return m;
}

/* Lofted solid: rings are [height, halfWidth, halfDepth, depthOffset] */
function loftGeo(rings, N = 14, p = .8) {
  const pos = [], idx = [];
  rings.forEach(([y, w, d, o = 0]) => {
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      pos.push(w * Math.sign(c) * Math.abs(c) ** p, y, d * Math.sign(s) * Math.abs(s) ** p + o);
    }
  });
  const R = rings.length, bottom = pos.length / 3; pos.push(0, rings[0][0], rings[0][3] || 0);
  const top = pos.length / 3; pos.push(0, rings[R - 1][0], rings[R - 1][3] || 0);
  for (let j = 0; j < R - 1; j++) for (let i = 0; i < N; i++) {
    const a = j * N + i, b = j * N + (i + 1) % N, c = a + N, d = b + N;
    idx.push(a, c, d, a, d, b);
  }
  for (let i = 0; i < N; i++) {
    idx.push(bottom, i, (i + 1) % N);
    idx.push(top, (R - 1) * N + (i + 1) % N, (R - 1) * N + i);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
const loft = (parent, rings, mat, pos, p, N) => add(parent, loftGeo(rings, N, p), mat, pos, { smooth: true });
const UP = new THREE.Vector3(0, 1, 0);

/* Limb from a to b: rings are [fraction, halfWidth, halfDepth] */
function limb(parent, a, b, rings, mat, p = 1, N = 12) {
  const A = new THREE.Vector3(...a), d = new THREE.Vector3(...b).sub(A), len = d.length();
  const m = loft(parent, rings.map(([t, w, h = w, o = 0]) => [t * len, w, h, o]), mat, a, p, N);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  return m;
}
function shapeGeo(points, depth, bevel = 0) {
  const s = new THREE.Shape(points.map(q => new THREE.Vector2(...q)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 1 });
  g.translate(0, 0, -depth / 2);
  return g;
}
const plate = (parent, pts, depth, mat, pos, opts) => add(parent, shapeGeo(pts, depth, opts?.bevel ?? 0), mat, pos, opts);
const star4 = (r, w = r * .24, h = r) => [[r, 0], [w, w], [0, h], [-w, w], [-r, 0], [-w, -w], [0, -h], [w, -w]];
function orient(obj, normal, up = [0, 1, 0]) {
  const z = new THREE.Vector3(...normal).normalize();
  const x = new THREE.Vector3(...up).cross(z).normalize(), y = z.clone().cross(x);
  obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}

function glow(parent, pos, size, color, strength = 1) {

    m.rotation.z = Math.atan2(by - ay, bx - ax);
  }
}

    // a camera-facing quad, so the fire always rises up the screen whatever the arm is doing

      void main(){
        vP = position.xy;

function track(q, keys) {
  if (q <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (q <= b) { const u = b === a ? 1 : (q - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }
  }
  return keys[keys.length - 1][1];
}

/* ---------- poses ---------- */
const HIP_Y = 2.5, THIGH = .98, SHIN = 1.08, ANKLE_Y = .34;

function legSolve(drop, stride, s) { // knee bend that keeps the foot planted while the hips drop
  const V = LEG_H - drop, D = Math.min(Math.hypot(stride, V), THIGH + SHIN - 1e-4);
  const line = Math.atan2(stride, V), hip = Math.acos(unit((THIGH * THIGH + D * D - SHIN * SHIN) / (2 * THIGH * D)));
  return [-(line + hip), Math.PI - Math.acos(unit((THIGH * THIGH + SHIN * SHIN - D * D) / (2 * THIGH * SHIN)))];

const LEG_H = 2.4 - ANKLE_Y;
function pose(time, power, fw = fightW, name = act, q = name ? actT / MOVES[name].dur : 0) {

    a.arm.rotation.set(e[0] + v(0), e[1] + s * v(1), e[2] + s * v(2));
    a.fore.rotation.set(e[3] + v(3), s * v(4), e[4]);

function track(q, keys) {
  if (q <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (q <= b) { const u = b === a ? 1 : (q - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }
  }
  return keys[keys.length - 1][1];
}

function track(q, keys) {
  if (q <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (q <= b) { const u = b === a ? 1 : (q - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }
  }
  return keys[keys.length - 1][1];
}

function updateCombat(dt) {
  for (const o of fissures) {
    if (!o.mesh.visible) continue;
    o.age += dt;
    if (o.age >= o.life) { o.mesh.visible = false; continue; }
    const u = o.mesh.material.uniforms; u.reveal.value = Math.min(1, o.age / .22); u.a.value = 1.25 * (1 - (o.age / o.life) ** 2);
  }
  for (const s of dataSpikes) {
    if (!s.g.visible) continue;
    s.age += dt;
    if (s.age >= s.life) { s.g.visible = false; continue; }
    const a = Math.max(0, s.age), up = a < .12 ? a / .12 : a > s.life - .34 ? (s.life - a) / .34 : 1;
    s.g.scale.y = Math.max(.001, s.h * up);
  }
  for (const c of crystals) { if (!c.mesh.visible) continue; c.life -= dt; if (c.life <= 0) { c.mesh.visible = false; continue; } c.mesh.position.addScaledVector(c.v, dt); }
  for (const c of chips) { if (!c.mesh.visible) continue; c.life -= dt; if (c.life <= 0) { c.mesh.visible = false; continue; } c.mesh.position.addScaledVector(c.v, dt); c.mesh.rotation.x += dt * 9; }
}

function track(q, keys) {
  if (q <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (q <= b) { const u = b === a ? 1 : (q - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }
  }
  return keys[keys.length - 1][1];
}

function track(p, keys) {
  if (p <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [a, from] = keys[i - 1], [b, to] = keys[i];
    if (p <= b) { const u = b === a ? 1 : (p - a) / (b - a); return from + (to - from) * u * u * (3 - 2 * u); }

  return keys[keys.length - 1][1];
}

}
function updateLocks(t, q) {
  const locked = act === 'lockdown';
  lockRig.forEach((l, i) => {
    const hover = V(l.base.x + Math.sin(t * .7 + l.ph) * .35, l.base.y + Math.sin(t * 1.15 + l.ph) * .55, l.base.z + Math.cos(t * .55 + l.ph) * .35);
    let target = hover;

      const a = i / 4 * TAU + .75, slam = V(Math.cos(a) * 9.4, 1.65 + l.s * 1.05, 14 + Math.sin(a) * 6.5), raised = V(l.base.x * .55, 27 + i * .8, 9);

  chainB.set(chainA.x + Math.sin(t * 1.4) * .3, Math.max(.3, chainA.y - 6.5), chainA.z + Math.cos(t) * .2);

}
function updateFx(dt, t, q) {
  const voxBoost = act === 'countdown' && q > .8 ? 3 : 1;

    o.life += dt; if (o.life > o.max) spawnVoxel(o, false);
    _p.copy(o.p).addScaledVector(o.v, o.life * voxBoost);

    o.life += dt; if (o.life > o.max) spawnSpark(o, false);
    o.p.addScaledVector(o.v, dt); o.v.y -= 4.5 * dt;
    if (o.p.y < .05) { o.p.y = .05; o.v.y *= -.4; }
    sparkPos.set([o.p.x, o.p.y, o.p.z], i * 3);
  });

  smokes.forEach((o, i) => {
    o.age = (o.age + dt * .22) % 1;
    const k = o.age, drift = Math.sin(i * 7.3) * 2.2;
    o.s.position.set(1.8 + drift * k + k * 3.2 + Math.sin(i) * .4, 2.6 + k * 4.5, 2.9 + k * .8);
    o.s.scale.setScalar(.9 + k * 5.2); o.s.material.opacity = Math.sin(k * Math.PI) * .2;
  });

    if (s.age >= s.life) { s.m.visible = false; continue; }
    s.age += dt; const k = Math.min(1, s.age / s.life), r = s.size * (.12 + .88 * (1 - Math.pow(1 - k, 3)));
    s.m.scale.setScalar(Math.max(.01, r)); s.m.material.opacity = (1 - k) * s.power;
  }
  if (crescent.visible) {
    crescent.userData.age += dt;
    const k = crescent.userData.age / .35; crescent.position.set(hips.position.x, 6.5, 2 + k * 3); crescent.scale.setScalar(.9 + k * .25);
    crescentMat.opacity = Math.max(0, 1 - k) * .48; if (k >= 1) crescent.visible = false;
  }

    beam.userData.age += dt;
    skullPoint(_p); beam.position.copy(_p);
    const a = beam.userData.age, len = Math.min(_p.y / Math.sin(.52), a * 240), w = .9 + Math.sin(t * 55) * .12;
    beamCore.scale.set(w, w, len); beamGlow.scale.set(w, w, len);

  cracks.material.opacity += (.34 + Math.sin(t * 2.4) * .05 - cracks.material.opacity) * (1 - Math.exp(-dt * 2.2));

}
function skullPoint(out) { skull.getWorldPosition(out); root.worldToLocal(out); out.z += 2.6; return out; }

/* ---------- controls ---------- */
const VIEWS = { front: [0, 12.5, 72], side: [72, 13, 0], back: [0, 15, -72], iso: [45, 24, 56] };
let goal = null;
const scaled = v => { const portrait = Math.max(1, 1.28 / camera.aspect); return V(v[0] * portrait, v[1], v[2] * portrait); };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { goal = scaled(VIEWS[b.dataset.view]); });
controls.addEventListener('start', () => { goal = null; });
const idleBtn = document.getElementById('idle'), fightBtn = document.getElementById('fight');
function showStance() { idleBtn.classList.toggle('on', !fightGoal); fightBtn.classList.toggle('on', !!fightGoal); }
idleBtn.onclick = () => { fightGoal = 0; showStance(); };
fightBtn.onclick = () => { fightGoal = 1; showStance(); };
const showAct = () => document.querySelectorAll('[data-act]').forEach(b => b.classList.toggle('on', b.dataset.act === act));
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { act = b.dataset.act; actT = 0; beam.visible = false; showAct(); });
document.getElementById('download').onclick = () => {
  const hidden = fxOnly.filter(o => o.visible); hidden.forEach(o => o.visible = false);
  new GLTFExporter().parse(root, buf => {
    hidden.forEach(o => o.visible = true);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })); a.download = 'zero_day.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, err => { hidden.forEach(o => o.visible = true); console.error(err); }, { binary: true });
};
function applySize() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', applySize); applySize();
camera.position.copy(scaled(VIEWS.front));

/* ---------- loop ---------- */
const clock = new THREE.Clock(); let boltClock = 0, glitchClock = 0;
const flashEl = document.getElementById('flash');
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  fightW += (fightGoal - fightW) * (1 - Math.exp(-dt * 7));
  const move = act && MOVES[act], q0 = move ? actT / move.dur : 0;
  let due = [];
  if (move) {
    actT += dt; const q1 = Math.min(1, actT / move.dur);
    due = move.fx.filter(([at]) => q0 < at && q1 >= at);
    if (q1 >= 1) { act = null; actT = 0; beam.visible = false; showAct(); }
  }
  const q = pose(t);
  due.forEach(([, name]) => FX[name]());
  updateCape(t);
  updateLocks(t, q);
  updateFx(dt, t, q);
  boltClock += dt;
  if (boltClock > .055) { boltClock = 0; regrowBolts(); edgeFlare.scale.setScalar(4 + Math.random() * 3.5); }
  codeTex.offset.y = (t * .35) % 1; codeA.material.map = codeTex;
  // the countdown only ever arrives at zero
  if (act === 'countdown') { const left = Math.max(0, Math.ceil((1 - q / .82) * 9)); setTimer(`00:00:0${left}`); }
  else {
    glitchClock -= dt;
    if (glitchClock < -.12) { glitchClock = 1.6 + Math.random() * 3.5; setTimer('00:00:00'); }
    else if (glitchClock < 0) setTimer(Math.random() > .5 ? '0x:00:FF' : 'NU:LL:00');
  }
  spin += ((act === 'countdown' ? 9 * (q < .82 ? 1 : 0) + 1 : 1) - spin) * (1 - Math.exp(-dt * 4));
  orbitArcs.forEach((a, i) => a.rotation.z = a.userData.from + Math.sin(t * (.5 + i * .13) * spin) * .22);
  haloArcs.forEach((a, i) => a.rotation.z += dt * (i < 3 ? .07 : -.14) * spin);
  halo.position.y = 18.2 - hips.position.y * 0 + Math.sin(t * .9) * .15;
  visorGlow.material.opacity = .42 + Math.sin(t * 8) * .06 + (Math.random() > .95 ? .24 : 0);
  backGlow.material.opacity = .2 + Math.sin(t * .8) * .04;
  holos.forEach((h, i) => { h.position.y += Math.sin(t * .7 + i) * .002; h.material.opacity = Math.random() > .985 ? .22 : .68; });

animate();

return { root, hide: [...holos, orbit, backGlow, backDrop] };
}

/* ---------- stand-ins handed to each page's code ---------- */
const stub = new Proxy(function () {}, {
  get: (_, key) => key === Symbol.toPrimitive ? () => '' : key === 'length' ? 0 : key === Symbol.iterator ? function* () {} : stub,
  set: () => true, apply: () => stub, construct: () => stub,

const pageStub = {
  body: stub,
  getElementById: () => stub,
  querySelector: () => stub,
  querySelectorAll: () => [],
  createElement: tag => document.createElement(tag),
  createElementNS: (ns, tag) => document.createElementNS(ns, tag),
  addEventListener() {},
};
class ControlsStub {
  constructor() { this.target = new THREE.Vector3(); this.enableDamping = true; }
  addEventListener() {}
  update() {}
}

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16243f);
const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new RealOrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 4;

scene.add(new THREE.HemisphereLight(0xc4ccf0, 0x3a2c4a, 1.9));
const key = new THREE.DirectionalLight(0xfff6ea, 2.7);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.bias = -.0008; key.shadow.normalBias = .03;
scene.add(key, key.target);
const rimCool = new THREE.DirectionalLight(0x45dcff, 3); rimCool.position.set(10, 9, -13); scene.add(rimCool);
const rimWarm = new THREE.DirectionalLight(0xff5a6a, 2.2); rimWarm.position.set(-12, 6, -9); scene.add(rimWarm);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.ShadowMaterial({ opacity: .4, color: 0x050810 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

/* ---------- line-up ---------- */
const CAST = [
  { id: 'clawd0', name: 'CLAWD', sub: 'ร่างแรก', pool: 0, mount: mount_clawd0 },
  { id: 'clawd', name: 'CLAWD', sub: 'ร่างใหม่ · ผู้คุมจักรวาล', pool: 0, mount: mount_clawd },
  { id: 'cosmic0', name: 'COSMIC WARRIOR', sub: 'ร่างแรก', pool: 0, mount: mount_cosmic0 },
  { id: 'cosmic', name: 'COSMIC WARRIOR', sub: 'ร่างใหม่ · เทพสูงสุด', pool: 0, mount: mount_cosmic },
  { id: 'overlord0', name: 'SYSTEM OVERLORD', sub: 'ร่างแรก', pool: 9, mount: mount_overlord0 },
  { id: 'overlord', name: 'SYSTEM OVERLORD', sub: 'ร่างใหม่ · OBLIVION', pool: 32, mount: mount_overlord },
  { id: 'zero', name: 'ZERO DAY', sub: 'บอส · UNPATCHED', pool: 0, mount: mount_zero },
  { id: 'gpt0', name: 'CHATGPT MECHA', sub: 'ร่างแรก', pool: 0, mount: mount_gpt0 },
  { id: 'gpt', name: 'CHATGPT', sub: 'ร่างใหม่ · เทพแห่งเทคโนโลยี', pool: 0, mount: mount_gpt },
  { id: 'grok0', name: 'GROK FIGHTER', sub: 'ร่างแรก', pool: 0, mount: mount_grok0 },
  { id: 'grok', name: 'GROK', sub: 'ร่างใหม่ · เทพแห่งการทำลายล้าง', pool: 0, mount: mount_grok },
  { id: 'aum', name: 'อั้ม', sub: 'ร่างแรก · มนุษย์', pool: 0, mount: mount_aum },
  { id: 'aum2', name: 'อั้ม', sub: 'ร่างใหม่ · ครึ่งจักรวาล', pool: 0, mount: mount_aum2 }

const GAP = .5, BOSS_BACK = -1.6;
for (const c of CAST) {

  const fakeRenderer = new Proxy({}, {
    get: (_, key) => key === 'domElement' ? { get height() { return renderer.domElement.height; }, style: stub } : stub,

  }

  if (parts.hide) parts.hide.forEach(o => { o.visible = false; }); // effects too wide for a line-up
  scene.add(c.stage);
}

function visibleBox(root) {
  const box = new THREE.Box3(), part = new THREE.Box3();
  root.updateWorldMatrix(true, true);
  (function walk(o) {
    if (!o.visible) return;
    if (o.isMesh && !o.material.transparent && o.geometry.attributes.position) {
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      box.union(part.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld));
    }
    o.children.forEach(walk);
  })(root);
  return box;
}

// Characters rest in their stage's local space while their own code runs, as if alone on their page.
function tick(c, now) {
  const cb = c.next; c.next = null;
  if (!cb) return;
  const { stage } = c, x = stage.position.x, z = stage.position.z;
  stage.position.set(0, 0, 0);

}

for (const c of CAST) c.box = visibleBox(c.root);
const total = CAST.reduce((sum, c) => sum + c.box.max.x - c.box.min.x, 0) + GAP * (CAST.length - 1);
let cursor = -total / 2;
for (const c of CAST) {
  const width = c.box.max.x - c.box.min.x;
  c.stage.position.x = cursor - c.box.min.x;
  c.stage.position.z = c.id.startsWith('overlord') || c.id === 'zero' ? BOSS_BACK : 0;
  cursor += width + GAP;
  c.tag = document.createElement('div'); c.tag.className = 'tag';
  c.tag.innerHTML = c.name + '<small>' + c.sub + '</small>';
  document.body.appendChild(c.tag);
  c.tagPoint = new THREE.Vector3(c.stage.position.x + (c.box.min.x + c.box.max.x) / 2, 0, c.stage.position.z + Math.min(2, c.box.max.z) + .9);
}
const tallest = Math.max(...CAST.map(c => c.box.max.y));
const TARGET = new THREE.Vector3(0, tallest * .46, 0);

controls.maxDistance = total * 8;
const span = total / 2 + 4;
key.position.set(-span * .45, tallest + 12, span * .8);
Object.assign(key.shadow.camera, { left: -span, right: span, top: tallest + 6, bottom: -14, near: .5, far: 120 });
key.shadow.camera.updateProjectionMatrix();
const grid = new THREE.GridHelper(Math.ceil(total * 2.4), Math.ceil(total * 2.4), 0x6fa8d0, 0x2c5075);
grid.position.y = .002; scene.add(grid);

/* ---------- ui ---------- */
const HALF_WIDTH = total / 2 + 1.8, HALF_HEIGHT = tallest / 2 + .9;
const DIRECTIONS = { front: [0, 0, 1], side: [1, 0, 0], back: [0, 0, -1], iso: [.42, .3, .86] };
let goal = null, distance = 30;
const viewPosition = name => new THREE.Vector3(...DIRECTIONS[name]).normalize().multiplyScalar(distance).add(TARGET);
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { goal = viewPosition(b.dataset.view); });
controls.addEventListener('start', () => { goal = null; });

let idle = true, pixel = false;
function applySize() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 38 : 24;
  camera.updateProjectionMatrix();
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  distance = Math.max(HALF_HEIGHT / tan, HALF_WIDTH / (tan * camera.aspect)) + 4;
  renderer.setPixelRatio(pixel ? .5 : Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

}
applySize();
camera.position.copy(viewPosition('iso'));
addEventListener('resize', applySize);
document.getElementById('idle').onclick = e => { idle = !idle; e.target.classList.toggle('on', idle); };
document.getElementById('pixel').onclick = e => { pixel = !pixel; e.target.classList.toggle('on', pixel); applySize(); };

const projected = new THREE.Vector3();
function placeTags() {
  for (const c of CAST) {
    projected.copy(c.tagPoint).project(camera);
    const visible = projected.z < 1 && Math.abs(projected.x) < 1 && Math.abs(projected.y) < 1;
    c.tag.style.visibility = visible ? 'visible' : 'hidden';
    if (visible) c.tag.style.transform = 'translate(-50%,0) translate(' + (projected.x + 1) / 2 * innerWidth + 'px,' + (1 - projected.y) / 2 * innerHeight + 'px)';
  }
}

function animate(now) {
  requestAnimationFrame(animate);
  if (idle) for (const c of CAST) tick(c, now);
  if (goal) {
    camera.position.lerp(goal, .12);
    if (camera.position.distanceTo(goal) < .02) goal = null;
  }
  controls.update();
  renderer.render(scene, camera);
  placeTags();
}
requestAnimationFrame(animate);
