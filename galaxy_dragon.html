import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const MODEL_URL = 'blender/galaxy_dragon.glb'; // sculpted + rigged by blender/build_galaxy_dragon.py

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp01 = x => Math.min(1, Math.max(0, x));
const smooth = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };

const elasticOut = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * TAU / 3) + 1;
const r2 = () => Math.random() * 2 - 1;
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070418, .0052);
const camera = new THREE.PerspectiveCamera(34, (innerWidth || 1) / (innerHeight || 1), .1, 2200);
camera.position.set(36, 22, 46);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const MAX_PR = Math.min(devicePixelRatio, 1.5);
let pixelRatio = MAX_PR;
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth || 1, innerHeight || 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 10.5, 0);
controls.minDistance = 6; controls.maxDistance = 300; controls.maxPolarAngle = Math.PI * .58;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2((innerWidth || 1) / 2, (innerHeight || 1) / 2), .75, .5, .65);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio); composer.setPixelRatio(pixelRatio);
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
// adaptive resolution: drop the pixel ratio when frames run long, raise it again when there is headroom
let perfT = 0, perfN = 0;
function watchPerf(rawDt) {
  perfT += rawDt; perfN++;
  if (perfT < 1.5) return;
  const avg = perfT / perfN; perfT = perfN = 0;
  if (document.hidden) return;
  const next = avg > 1 / 40 ? Math.max(.6, pixelRatio - .2) : avg < 1 / 57 ? Math.min(MAX_PR, pixelRatio + .1) : pixelRatio;
  if (Math.abs(next - pixelRatio) > .01) { pixelRatio = next; resize(); }
}

scene.add(new THREE.HemisphereLight(0x8c84ff, 0x0b0820, 1.0));
const key = new THREE.DirectionalLight(0xdfe4ff, 2.0);
key.position.set(-20, 40, 34); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -40, right: 40, top: 40, bottom: -10, far: 140 });
key.shadow.bias = -.0008; key.shadow.normalBias = .06;
scene.add(key);
const rimA = new THREE.DirectionalLight(0xb35cff, 3.2); rimA.position.set(-18, 14, -22); scene.add(rimA);
const rimB = new THREE.DirectionalLight(0x4fc8ff, 2.6); rimB.position.set(20, 12, -18); scene.add(rimB);

/* ---------- textures ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = canvasTex(128, 128, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, w);
});
const swirlTex = canvasTex(256, 256, (g, w) => {
  g.globalCompositeOperation = 'lighter';
  const blob = (x, y, r, col, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); };
  const cols = ['170,90,255', '230,110,255', '110,150,255', '255,170,240'], R = w * .48;
  for (let a = 0; a < 2; a++) for (let i = 0; i < 260; i++) {
    const k = i / 260, th = k * 4.2 + a * Math.PI, r = R * k;
    blob(w / 2 + Math.cos(th) * r + (rnd() - .5) * R * .14, w / 2 + Math.sin(th) * r + (rnd() - .5) * R * .14, R * (.05 + .1 * (1 - k)) * (.6 + rnd()), cols[(rnd() * 4) | 0], .09 * (1 - k * .6));
  }
  blob(w / 2, w / 2, R * .42, '190,140,255', .55); blob(w / 2, w / 2, R * .16, '255,235,255', .95);
});
const ringTex = canvasTex(512, 512, (g, w) => {
  const c = w / 2;
  for (let i = 0; i < 150; i++) {
    const rr = 170 + i / 150 * 84, a = .05 + .2 * (Math.sin(i * .37) * .5 + .5) * (Math.sin(i * .11 + 1) * .5 + .5);
    g.strokeStyle = `hsla(${255 + 45 * Math.sin(i * .19)},90%,72%,${a})`; g.lineWidth = 1.6;
    g.beginPath(); g.arc(c, c, rr, 0, TAU); g.stroke();
  }
  for (let i = 0; i < 900; i++) { const a = rnd() * TAU, rr = 172 + rnd() * 80; g.fillStyle = `rgba(235,235,255,${.4 + rnd() * .6})`; g.fillRect(c + Math.cos(a) * rr, c + Math.sin(a) * rr, 1.5, 1.5); }
});

const gTime = { value: 0 };
const NOISE = `
float gh(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float gn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(gh(i), gh(i + vec3(1,0,0)), f.x), mix(gh(i + vec3(0,1,0)), gh(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(gh(i + vec3(0,0,1)), gh(i + vec3(1,0,1)), f.x), mix(gh(i + vec3(0,1,1)), gh(i + vec3(1,1,1)), f.x), f.y), f.z); }
float gfbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++){ s += a * gn(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }`;
const additive = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
function sprite(parent, pos, size, color, opacity = .8) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.position.set(...pos); s.scale.setScalar(size); parent.add(s); return s;
}

/* ---------- stage ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: { uT: gTime },
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `varying vec3 vD; uniform float uT; ${NOISE}
  void main(){
    vec3 d = vD; float n = gfbm(d * 2.2 + vec3(0., 0., uT * .005)); float m = gfbm(d * 4.5 + n * 1.8);
    vec3 c = vec3(.012, .008, .035);
    c += mix(vec3(.12, .04, .3), vec3(.35, .1, .45), m) * smoothstep(.48, .85, n) * .9;
    c += vec3(.05, .12, .35) * smoothstep(.55, .9, m) * .5;
    vec3 cp = d * 180.; vec3 ci = floor(cp); float h = gh(ci);
    c += vec3(.9, .9, 1.) * step(.985, h) * smoothstep(.35, .0, length(fract(cp) - .5)) * (.5 + .5 * sin(uT * 2. + h * 90.));
    gl_FragColor = vec4(c, 1.);
  }`,
}));
{ // the nebula sky is drawn once into a cube map instead of every frame
  const skyScene = new THREE.Scene(); skyScene.add(sky);
  const cubeRT = new THREE.WebGLCubeRenderTarget(1024);
  new THREE.CubeCamera(1, 2000, cubeRT).update(renderer, skyScene);
  scene.background = cubeRT.texture;
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 96), new THREE.MeshStandardMaterial({ color: 0x0a0820, roughness: 1, metalness: 0 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const floorGlow = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), new THREE.MeshBasicMaterial({ map: glowTex, color: 0x6a3cff, transparent: true, opacity: .45, blending: THREE.AdditiveBlending, depthWrite: false }));
floorGlow.rotation.x = -Math.PI / 2; floorGlow.position.y = .03; scene.add(floorGlow);
[12, 20, 30].forEach((r, i) => { const m = new THREE.Mesh(new THREE.RingGeometry(r, r + .08, 128), additive(0x7a5cff, .16 - i * .04)); m.rotation.x = -Math.PI / 2; m.position.y = .04; scene.add(m); });

const scaleGrp = new THREE.Group(); scene.add(scaleGrp);
{
  const mat = new THREE.MeshStandardMaterial({ color: 0x15141c, roughness: .8 });
  const human = new THREE.Group(); human.position.set(-9.5, 0, 7); scaleGrp.add(human);
  const part = (geo, pos) => { const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.castShadow = true; human.add(m); };
  [-1, 1].forEach(s => { part(new THREE.CapsuleGeometry(.1, .7, 4, 8), [s * .12, .5, 0]); part(new THREE.CapsuleGeometry(.06, .55, 4, 8), [s * .3, 1.17, 0]); });
  part(new THREE.CapsuleGeometry(.2, .35, 4, 10), [0, 1.22, 0]); part(new THREE.SphereGeometry(.12, 12, 10), [0, 1.68, 0]);
  const label = (text, pos, h = 1.1) => {
    const c = document.createElement('canvas'), g = c.getContext('2d'), font = '600 48px system-ui, "Segoe UI", Tahoma, sans-serif';
    g.font = font; c.width = Math.ceil(g.measureText(text).width) + 20; c.height = 64;
    g.font = font; g.fillStyle = '#cfd2ff'; g.textBaseline = 'middle'; g.fillText(text, 10, 34);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
    s.scale.set(h * c.width / 64, h, 1); s.position.set(...pos); scaleGrp.add(s);
  };
  const rulerMat = new THREE.MeshBasicMaterial({ color: 0x9a98c8 });
  const bar = new THREE.Mesh(new THREE.BoxGeometry(.07, 20, .07), rulerMat); bar.position.set(-15, 10, 0); scaleGrp.add(bar);
  for (let y = 0; y <= 20; y += 5) { const t = new THREE.Mesh(new THREE.BoxGeometry(y % 10 ? .4 : .8, .07, .07), rulerMat); t.position.set(-15, y, 0); scaleGrp.add(t); }
  label('20 m', [-16.9, 20, 0]); label('10 m', [-16.9, 10, 0]); label('0', [-16.2, .4, 0]); label('1.8 m', [-9.5, 2.6, 7], .8);
}

/* ---------- particles ---------- */
const PN = 2600,pPos = new Float32Array(PN * 3).fill(-999), pCol = new Float32Array(PN * 3);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const sparks = new THREE.Points(pGeo, new THREE.PointsMaterial({ map: glowTex, size: .8, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
sparks.frustumCulled = false; scene.add(sparks);
const PART = Array.from({ length: PN }, () => ({ life: 0, max: 1, p: V(), v: V(), c: new THREE.Color(), g: 0, drag: 0, to: null }));
let pNext = 0;
function emit(pos, vel, color, life, g = 0, drag = 0, to = null) {
  const o = PART[pNext]; pNext = (pNext + 1) % PN;
  o.p.copy(pos); o.v.copy(vel); o.c.set(color); o.life = o.max = life; o.g = g; o.drag = drag; o.to = to; o.parked = false;
}
const _d = V();
function updateParticles(dt) {
  for (let i = 0; i < PN; i++) {
    const o = PART[i];
    if (o.life <= 0 && o.parked) continue;
    o.parked = o.life <= 0;
    if (o.life > 0) {
      o.life -= dt;
      if (o.to) { _d.copy(o.to).sub(o.p); if (_d.length() < .6) o.life = 0; o.v.lerp(_d.multiplyScalar(4), 1 - Math.exp(-dt * 3)); }
      o.v.y -= o.g * dt; o.v.multiplyScalar(Math.exp(-o.drag * dt)); o.p.addScaledVector(o.v, dt);
    }
    if (o.life > 0) {
      const k = o.life / o.max;
      pPos[i * 3] = o.p.x; pPos[i * 3 + 1] = o.p.y; pPos[i * 3 + 2] = o.p.z;
      pCol[i * 3] = o.c.r * k; pCol[i * 3 + 1] = o.c.g * k; pCol[i * 3 + 2] = o.c.b * k;
    } else { pPos[i * 3 + 1] = -999; pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = 0; }
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}
const DUST = 600, dPos = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) { const a = Math.random() * TAU, r = 6 + Math.random() * 45; dPos.set([Math.cos(a) * r, Math.random() * 36, Math.sin(a) * r], i * 3); }
const dGeo = new THREE.BufferGeometry(); dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
const dust = new THREE.Points(dGeo, new THREE.PointsMaterial({ map: glowTex, size: .28, color: 0xb9a8ff, transparent: true, opacity: .8, depthWrite: false, blending: THREE.AdditiveBlending }));
dust.frustumCulled = false; scene.add(dust);

/* ---------- the dragon: sculpted and rigged in Blender ---------- */
const dragon = new THREE.Group(); scene.add(dragon);
// pivot at body height so the dragon can pitch level and bank while flying (identity on the ground)
const tilt = new THREE.Group(); tilt.position.y = 10; tilt.rotation.order = 'ZYX'; dragon.add(tilt);
const home = V(), BONE = {}, FX = {}, crystalMats = [], skinMats = [];
let ready = false;
const capEl = document.getElementById('cap');
let capTimer = 0;
function showCap(main, sub, secs = 2.8) { capEl.innerHTML = `${main}<small>${sub}</small>`; capEl.classList.add('on'); capTimer = secs; }
const skillBtns = document.querySelectorAll('[data-act]');
skillBtns.forEach(b => b.disabled = true);
showCap('LOADING', 'กำลังโหลดโมเดลมังกร…', Infinity);
const draco = new DRACOLoader().setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');
new GLTFLoader().setDRACOLoader(draco).load(MODEL_URL, g => {
  const model = g.scene; tilt.add(model); model.position.y = -10;
  model.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false; // skinned bounds don't follow the pose
    const m = o.material, n = m.name || '';

    o.castShadow = /Skin|Membrane|WingBone/.test(n); o.receiveShadow = /Skin|Belly|Plates/.test(n);
    if (m.transmission) m.transmission = 0; // transmission re-renders the whole scene every frame
    // Blender's strengths are tuned for Eevee; tame them for this bloom pass
    const cap = { Core: 2.2, Eye: 5, WingEdge: 1.1, Vein: 1.3, Membrane: 1.0, MouthGlow: 1.5 };
    for (const k in cap) if (n.includes(k)) m.emissiveIntensity = Math.min(m.emissiveIntensity, cap[k]);
    if (/Crystal/.test(n)) { m.userData.base = m.emissiveIntensity; crystalMats.push(m); }
    if (/Skin|Belly|ScalePlates|WingBone/.test(n)) { m.userData.base = m.emissiveIntensity; skinMats.push(m); }
    if (/Membrane/.test(n)) m.side = THREE.DoubleSide;
    if (/Core/.test(n)) { m.blending = THREE.AdditiveBlending; m.depthWrite = false; }
  });
  model.updateMatrixWorld(true);
  const mqi = model.getWorldQuaternion(new THREE.Quaternion()).invert();
  model.traverse(o => {
    if (o.isBone) {
      const W = o.getWorldQuaternion(new THREE.Quaternion()).premultiply(mqi);
      const PWi = o.parent.getWorldQuaternion(new THREE.Quaternion()).premultiply(mqi).invert();
      BONE[o.name] = { bone: o, restQ: o.quaternion.clone(), restP: o.position.clone(), W, Wi: W.clone().invert(), PWi };
    }
    if (/^fx/.test(o.name)) FX[o.name] = o;
  });
  // glows that ride on the bones

      if (s < 1) return;
      for (let i = 0; i < 2; i++) {
        const a = Math.random() * TAU, a2 = a + r2() * .8, rr = s * .36, c = v.g.position;
        const p1 = c.clone().addScaledVector(right, Math.cos(a) * rr).addScaledVector(up, Math.sin(a) * rr);
        const p2 = c.clone().addScaledVector(right, Math.cos(a2) * rr * 1.5).addScaledVector(up, Math.sin(a2) * rr * 1.5);
        bolt(p1, p2, Math.random() < .5 ? 0xe6d0ff : 0x9fc8ff, .1, .25);
      }
    });
    if (sA > 3 && Math.random() < dt * 4) shockRing(cA, camDir(), sA * 1.6, .7, 0xb48cff, true); // space folding inward
    if (q > .48 && once('reappear')) {
      flash = Math.max(flash, .5); camShake = Math.max(camShake, 1);
      shockRing(V(portalTo.x, .5, portalTo.z), UP, 42, 1, 0xd8c8ff); shockRing(vortexB.g.position, camDir(), 26, .7, 0xffffff);
      scorch(portalTo.x, portalTo.z, 26, 0x7a5cff, 6);
      for (let i = 0; i < 24; i++) spawnDebris(V(portalTo.x + r2() * 3, 2, portalTo.z + r2() * 3), V(r2() * 22, 8 + Math.random() * 16, r2() * 22), .4 + Math.random(), 3.5);
    }
    if (sA > 1) {
      const c = vortexA.g.position;
      for (let i = 0; i < 6; i++) {
        const a = Math.random() * TAU, r = 14 + Math.random() * 14;
        emit(V(c.x + Math.cos(a) * r, Math.max(.3, c.y + Math.sin(a) * r * .6), c.z + r2() * 4), V(-Math.sin(a), Math.cos(a) * .6, 0).multiplyScalar(14), Math.random() < .5 ? 0xb07cff : 0x6fb8ff, 1.6, 0, .2, c);
      }
    }
  } else { updateVortex(vortexA, 0, dt, t); updateVortex(vortexB, 0, dt, t); }
  if (FLY.state === 'ground') { dragon.scale.setScalar(scale); dragon.rotation.y = spin; }

  // 5 nebula strike: dash in, slash right then left, glide back
  const dash = is('strike') ? smooth(.18, .32, q) - smooth(.62, .95, q) : 0;
  if (is('strike')) {
    const front = V(home.x, 0, home.z + 36);
    if (q > .18 && once('dash')) {
      camShake = Math.max(camShake, .6); flash = Math.max(flash, .15);
      shockRing(V(home.x, 10, home.z + 2), _zAx, 18, .5, 0xff9ae6); spawnImpact(home.x, home.z, 26, 16); // sonic boom at take-off
    }
    const slash = (sx, tilt, col) => {
      camShake = Math.max(camShake, 1.1); flash = Math.max(flash, .25);
      const at = V(front.x + sx, 10, front.z + 2);
      slashArc(at, tilt, 15, col); slashArc(at.clone().add(V(0, 0, .5)), tilt + .12, 11, 0x7fe0ff);
      spawnImpact(front.x + sx, front.z + 4, 24, 24);
      for (let k = -1; k <= 1; k++) scorch(front.x + sx + k * 1.6, front.z + 5, 3.2, col, 5, 6, Math.PI / 2 + tilt * .6, 1.2); // three claw gashes
      for (let i = 0; i < 18; i++) spawnDebris(V(front.x + sx + r2() * 4, 1, front.z + 4 + r2() * 4), V(r2() * 16, 10 + Math.random() * 16, 6 + Math.random() * 14), .3 + Math.random(), 3.5);
      for (let i = 0; i < 5; i++) bolt(at.clone().add(V(r2() * 8, r2() * 8, 0)), at.clone().add(V(r2() * 12, r2() * 12, 4)), col, .18, .2);
    };
    if (q > .3 && once('slashR')) slash(-3, -.75, 0xff7ae6);
    if (q > .46 && once('slashL')) slash(3, .75, 0xc77dff);
    if (q > .18 && q < .42) for (let i = 0; i < 14; i++) emit(V(dragon.position.x + r2() * 7, 1 + Math.random() * 18, dragon.position.z - 2 - Math.random() * 10), V(r2() * .5, r2() * .5, -45 - Math.random() * 20), Math.random() < .5 ? 0xff7ae6 : 0x7fb6ff, .45, 0, .5); // speed lines
    if (q > .18 && q < .4 && Math.random() < dt * 10) scorch(dragon.position.x + r2() * 2, dragon.position.z, 5, 0x9a5cff, 2.5, 2.5, Math.PI / 2, .7);
  }
  ['R', 'L'].forEach(g => ribbons[g].forEach(rb => updateRibbon(rb, g, is('strike') && (g === 'R' ? q > .22 && q < .42 : q > .36 && q < .56), t)));

  // 6 supernova: rise, gather a star at the chest, burst
  const nova = is('nova');
  const gather = nova ? smooth(.1, .48, q) * (1 - smooth(.5, .53, q)) : 0;
  if (nova) {
    if (q > .08 && q < .5) for (let i = 0; i < 8; i++) {
      const d = V(r2(), r2() * .7, r2()).normalize().multiplyScalar(20 + Math.random() * 18);
      emit(coreW.clone().add(d), d.clone().cross(UP).multiplyScalar(.5), Math.random() < .5 ? 0xe0c0ff : 0x7fd0ff, 1.4, 0, 0, coreW);
    }
    const hc = V(home.x, 0, home.z);
    if (q > .06 && once('lift')) { // everything nearby rises into orbit around the dragon
      shockRing(V(home.x, .5, home.z), UP, 30, 1, 0xb48cff);
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * TAU, r = 12 + Math.random() * 24;
        spawnDebris(V(home.x + Math.cos(a) * r, .5, home.z + Math.sin(a) * r), V(0, 2 + Math.random() * 4.5, 0), .4 + Math.random() * 1.6, MOVES.nova.dur * .46, 1, hc);
      }
    }
    if (q > .12 && once('pillar')) lightPillar(home.x, home.z, 5, 160, MOVES.nova.dur * .42);
    if (q > .1 && q < .5) {
      if (Math.random() < dt * 5) shockRing(coreW, camDir(), 26, .6, 0xc8b0ff, true); // space collapsing into the star
      for (let i = 0; i < 2; i++) { const o = DB[(Math.random() * DEB) | 0]; if (o.life > 0 && o.mode === 1) bolt(coreW, o.p, Math.random() < .5 ? 0xe6d6ff : 0x8fd8ff, .1, .18); }
    }
    if (q > .52 && once('burst')) {
      flash = .9; camShake = 2.4;
      spawnImpact(home.x, home.z, 70, 40); spawnImpact(home.x, home.z, 120, 0);
      shockRing(coreW, UP, 110, 1.6, 0xe8dcff); shockRing(coreW, _zAx, 80, 1.3, 0xb48cff); shockRing(coreW, V(1, .5, .2), 95, 1.5, 0x8fd8ff);
      scorch(home.x, home.z, 70, 0x9a5cff, 9); scorch(home.x, home.z, 34, 0xffffff, 6, 1, 0, .6);
      DB.forEach(o => { if (o.life > 0 && o.mode === 1) { o.mode = 0; o.v.copy(o.p).sub(coreW).setY(0).normalize().multiplyScalar(35 + Math.random() * 30).setY(10 + Math.random() * 16); o.life = 4; } });
      for (let i = 0; i < 40; i++) spawnDebris(coreW.clone().add(V(r2(), r2(), r2()).multiplyScalar(3)), V(r2(), r2() * .6, r2()).normalize().multiplyScalar(40 + Math.random() * 30), .4 + Math.random() * 1.4, 4);
      for (let i = 0; i < 220; i++) { const d = V(r2(), r2() * .6, r2()).normalize(); emit(coreW, d.multiplyScalar(40 + Math.random() * 60), Math.random() < .5 ? 0xffffff : 0xb98cff, 1.8, 4, .8); }
      for (let i = 0; i < 12; i++) bolt(coreW, coreW.clone().add(V(r2(), r2() * .7, r2()).normalize().multiplyScalar(25 + Math.random() * 25)), 0xffffff, .3, .2);
    }
    if (q > .64 && once('aftershock')) { camShake = Math.max(camShake, 1.4); spawnImpact(home.x, home.z, 140, 30); shockRing(V(home.x, 1, home.z), UP, 150, 1.8, 0x9a7cff); }
  }
  novaCloud.position.copy(coreW); novaCloud.scale.setScalar(50 + 60 * (nova ? smooth(.52, 1, q) : 0));
  novaCloud.material.opacity = nova ? env(q, .53, .6, .8, 1) * .45 : 0;
  starBall.position.copy(coreW); starHalo.position.copy(coreW);
  starBall.scale.setScalar(.01 + 7 * gather * (1 + .1 * Math.sin(t * 30)) * (q > .47 ? .5 : 1));
  starBall.material.opacity = gather; starHalo.scale.setScalar(.01 + 14 * gather); starHalo.material.opacity = gather * .4;
  const k = nova ? smooth(.52, .78, q) : 1;
  novaShell.visible = nova && q > .52 && k < 1;
  novaShell.position.copy(coreW); novaShell.scale.setScalar(.1 + 85 * (1 - Math.pow(1 - k, 3)));
  novaMat.uniforms.uFade.value = (1 - k) * (1 - k) * .75;
  novaLight.position.copy(coreW); novaLight.intensity = nova ? 500 * gather + 9000 * env(q, .52, .54, .6, .8) : 0;
  floorGlow.scale.setScalar(1 + 4 * (nova ? env(q, .52, .55, .7, .9) : 0));

  if (FLY.state === 'ground') dragon.position.set(home.x, 7 * W8.riseX, home.z + 30 * dash);

  impacts.forEach(o => {
    if (o.t >= 1) return;
    o.t = Math.min(1, o.t + dt / (o.size > 50 ? 1.6 : .9));
    const e = 1 - Math.pow(1 - o.t, 3);
    o.ringM.scale.setScalar(o.size * e + .01); o.ringM.material.opacity = (1 - o.t) * .9;
    o.fl.scale.setScalar(Math.min(o.size, 34) * (.6 + e * .6)); o.fl.material.opacity = (1 - o.t) * (1 - o.t) * (o.size > 40 ? .5 : 1);
    if (o.t >= 1) o.ringM.visible = o.fl.visible = false;
  });
}

function updateAmbient(dt, t) {
  const boost = act ? .6 : 0;
  const cBoost = act === 'breath' ? -.35 : boost; // dim the rest so the charge wave on the back reads clearly
  crystalMats.forEach((m, i) => m.emissiveIntensity = m.userData.base * (.85 + .2 * Math.sin(t * 2 + i * 1.5) + cBoost));
  skinMats.forEach(m => m.emissiveIntensity = m.userData.base * (.9 + .12 * Math.sin(t * .8) + boost * .5));
  if (FX.coreGlow) {
    FX.coreGlow.material.opacity = .55 + .15 * Math.sin(t * 2.2) + boost * .3;
    FX.coreLight.intensity = 26 + 8 * Math.sin(t * 2.2) + boost * 30;
  }
  ['L', 'R'].forEach(s => {
    const a = FX['aura' + s]; if (!a) return;
    a.material.opacity = .32 + .1 * Math.sin(t * 7) + boost * .3;
    FX['fxHand' + s].getWorldPosition(_w);
    if (dragon.scale.x > .5) for (let i = 0; i < 2; i++) emit(V(_w.x + r2() * .5, _w.y + r2() * .4, _w.z + r2() * .5), V(r2() * .6, 1.4 + Math.random() * 1.4, r2() * .6), Math.random() < .5 ? 0x8f7bff : 0x6fd6ff, .9 + Math.random() * .5, -.5, .5);
  });
  if (FX.tailGlow) FX.tailGlow.material.opacity = .4 + .15 * Math.sin(t * 3);
  for (let i = 0; i < DUST; i++) { let y = dPos[i * 3 + 1] + dt * (.3 + (i % 5) * .12); if (y > 36) y = 0; dPos[i * 3 + 1] = y; }
  dGeo.attributes.position.needsUpdate = true;
  floorGlow.position.x = dragon.position.x; floorGlow.position.z = dragon.position.z;
  floorGlow.material.opacity = (.4 + .08 * Math.sin(t * 1.1) + boost * .3) * dragon.scale.x * (1 - .75 * clamp01(dragon.position.y / 20));
  key.position.set(dragon.position.x - 20, 40, dragon.position.z + 34); key.target.position.copy(dragon.position);
}

/* ---------- ui ---------- */
const VIEWS = { front: [0, 11, 54], side: [54, 11, 0], back: [0, 11, -54], iso: [36, 22, 42] };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { camGoal = V(...VIEWS[b.dataset.view]).add(dragon.position); tgtGoal = V(0, 10.5, 0).add(dragon.position); });
skillBtns.forEach(b => b.onclick = () => startSkill(b.dataset.act));
flyBtn.onclick = toggleFly;
addEventListener('keydown', e => {
  const i = '123456'.indexOf(e.key); if (i >= 0) startSkill(Object.keys(MOVES)[i]);
  if (e.key === 'f' || e.key === 'F') toggleFly();
});
controls.addEventListener('start', () => { camGoal = tgtGoal = null; });
const scaleBtn = document.getElementById('scale');
scaleBtn.onclick = () => { scaleGrp.visible = !scaleGrp.visible; scaleBtn.classList.toggle('on', scaleGrp.visible); };
document.getElementById('download').onclick = () => { const a = document.createElement('a'); a.href = MODEL_URL; a.download = 'galaxy_dragon.glb'; a.click(); };
scene.add(key.target);

/* ---------- loop ---------- */
const clock = new THREE.Clock(), flashEl = document.getElementById('flash');
const focus = V(0, 10, 0), lastFocus = V(0, 10, 0);
let simT = 0;
function animate() {
  requestAnimationFrame(animate);
  const raw = clock.getDelta();
  watchPerf(raw);
  frame(Math.min(raw, .05));
}
function frame(dt) {
  simT += dt; const t = simT;
  gTime.value = t;
  if (act) { actT += dt; if (actT >= MOVES[act].dur) { act = null; actT = 0; skillBtns.forEach(b => b.classList.remove('on')); } }
  if (capTimer > 0 && capTimer !== Infinity && (capTimer -= dt) <= 0) capEl.classList.remove('on');
  if (ready) { updateFly(dt); pose(t); updateSkills(dt, t); updateAmbient(dt, t); }
  updateSpectacle(dt);
  updateParticles(dt);
  // the camera rides along while the dragon is airborne (orbit controls still work around it)
  focus.copy(dragon.position).setY(dragon.position.y + 10);
  if (FLY.state !== 'ground') {
    const d = focus.clone().sub(lastFocus);
    controls.target.add(d); camera.position.add(d);
    if (camGoal) { camGoal.add(d); tgtGoal.add(d); }
  }
  lastFocus.copy(focus);
  if (camGoal) {
    const k = 1 - Math.exp(-dt * 3);
    camera.position.lerp(camGoal, k); controls.target.lerp(tgtGoal, k);
    if (camera.position.distanceTo(camGoal) < .05) camGoal = tgtGoal = null;
  }
  controls.update();
  flash = Math.max(0, flash - dt * 1.6); flashEl.style.opacity = Math.min(.9, flash);
  camShake *= Math.exp(-dt * 4);
  const shake = V(r2() * camShake, r2() * camShake, 0);
  camera.position.add(shake);
  composer.render();
  camera.position.sub(shake);
}
animate();
</script>
